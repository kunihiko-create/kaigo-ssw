<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>介護SSW 試験対策</title>
<style>
  :root {
    --main: #1D9E75;
    --main-dark: #157a5a;
    --main-light: #e8f7f2;
    --main-mid: #b2e0d0;
    --ok: #15803d;
    --ok-light: #dcfce7;
    --ng: #b91c1c;
    --ng-light: #fee2e2;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --line: #e5e7eb;
    --text: #1f2937;
    --text-sub: #6b7280;
    --shadow: 0 4px 20px rgba(0,0,0,0.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Noto Sans JP', sans-serif;
    background: #f2faf7; color: var(--text); min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; }
  ruby rt { font-size: 0.55em; color: var(--text-sub); }
  .wrap { max-width: 600px; margin: 0 auto; padding: 16px; }

  /* ===== HEADER ===== */
  header {
    background: var(--main); color: white; padding: 12px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 10px rgba(29,158,117,0.35);
  }
  .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-title { font-size: 1.02rem; font-weight: bold; line-height: 1.3; cursor: pointer; }
  .header-title small { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.85; }
  .toggles { display: flex; gap: 6px; flex-shrink: 0; }
  .tg {
    border: 1.5px solid rgba(255,255,255,0.7); background: transparent; color: white;
    border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; font-weight: bold;
  }
  .tg.on { background: white; color: var(--main); border-color: white; }

  /* ===== CARDS / BUTTONS ===== */
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1rem; margin-bottom: 10px; }
  .sub { color: var(--text-sub); font-size: 0.78rem; }
  .btn {
    display: block; width: 100%; border: none; border-radius: 12px; padding: 14px 16px;
    font-size: 0.98rem; font-weight: bold; background: var(--main); color: white;
    transition: transform .1s, background .2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #d1d5db; color: #9ca3af; cursor: default; }
  .btn.sec { background: var(--gray-light); color: var(--text); }
  .btn.ghost { background: white; color: var(--main); border: 2px solid var(--main-mid); }
  .btn rt { color: inherit; opacity: 0.8; }
  .btn small { display: block; font-weight: normal; font-size: 0.72rem; opacity: 0.85; margin-top: 2px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .mt { margin-top: 10px; }

  .menu-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: white; border: 2px solid var(--line); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; color: var(--text);
  }
  .menu-btn:active { background: var(--main-light); }
  .menu-btn .ic { font-size: 1.7rem; width: 40px; text-align: center; flex-shrink: 0; }
  .menu-btn b { display: block; font-size: 0.98rem; }
  .menu-btn span { font-size: 0.75rem; color: var(--text-sub); }

  .due-box {
    background: linear-gradient(135deg, var(--main), var(--main-dark)); color: white;
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .due-num { font-size: 2.2rem; font-weight: bold; line-height: 1.1; }
  .due-box rt { color: rgba(255,255,255,0.85); }
  .due-box .btn { background: white; color: var(--main); margin-top: 12px; }
  .due-box .btn:disabled { background: rgba(255,255,255,0.4); color: white; }

  .stat-row { display: flex; justify-content: space-around; text-align: center; }
  .stat-row b { display: block; font-size: 1.4rem; color: var(--main); }
  .stat-row span { font-size: 0.72rem; color: var(--text-sub); }

  /* category chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 12px; border-radius: 20px; border: 2px solid var(--line); background: white;
    font-size: 0.82rem; font-weight: bold; color: var(--gray);
  }
  .chip.on { background: var(--main); border-color: var(--main); color: white; }
  .chip small { font-weight: normal; opacity: 0.8; }

  /* bars */
  .bar-row { display: grid; grid-template-columns: 7.5em 1fr 3.2em; align-items: center; gap: 8px; font-size: 0.8rem; margin: 7px 0; }
  .bar { height: 10px; background: var(--gray-light); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #f59e0b; border-radius: 6px; }
  .bar i.good { background: var(--ok); }
  .bar i.weak { background: var(--ng); }
  .bar-row .pct { text-align: right; font-weight: bold; }

  /* ===== QUIZ ===== */
  .qbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 0.8rem; }
  .qbar .close { border: none; background: var(--gray-light); border-radius: 20px; padding: 6px 12px; font-weight: bold; color: var(--gray); }
  .timer { font-weight: bold; font-variant-numeric: tabular-nums; background: white; border-radius: 20px; padding: 5px 12px; box-shadow: var(--shadow); }
  .timer.low { color: var(--ng); }
  .progress { height: 6px; background: #cdebe0; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--main); transition: width .3s; }
  .badge { display: inline-block; background: var(--main-light); color: var(--main-dark); border-radius: 12px; padding: 3px 10px; font-size: 0.72rem; font-weight: bold; margin-bottom: 10px; }
  .qtype { display: inline-block; background: var(--gray-light); color: var(--gray); border-radius: 12px; padding: 3px 10px; font-size: 0.72rem; font-weight: bold; margin-left: 4px; }
  .qtext { font-size: 1.12rem; line-height: 2.0; font-weight: bold; }
  .passage { white-space: pre-line; background: #f6fbf9; border-left: 4px solid var(--main); border-radius: 8px; padding: 10px 12px; margin: 4px 0 12px; line-height: 2.0; font-size: 0.98rem; }
  .passage + .idn { white-space: pre-line; margin: -6px 0 12px; }
  .idn { display: block; color: #2563eb; font-size: 0.84rem; line-height: 1.5; margin-top: 6px; font-weight: normal; }

  .listen { display: flex; gap: 10px; margin-bottom: 14px; }
  .listen button {
    flex: 1; border: none; border-radius: 12px; padding: 14px 8px; font-weight: bold; font-size: 0.95rem;
    background: var(--main-light); color: var(--main-dark);
  }
  .listen button.main { background: var(--main); color: white; font-size: 1.05rem; }
  .warn { background: #fef3c7; color: #92400e; border-radius: 10px; padding: 10px 12px; font-size: 0.8rem; margin-bottom: 12px; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: white; border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px;
    font-size: 1rem; line-height: 1.85; color: var(--text); transition: border-color .15s, background .15s;
  }
  .opt .no {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--gray-light);
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; margin-top: 3px;
  }
  .opt.sel { border-color: var(--main); background: var(--main-light); }
  .opt.sel .no { background: var(--main); color: white; }
  .opt.ok { border-color: var(--ok); background: var(--ok-light); }
  .opt.ok .no { background: var(--ok); color: white; }
  .opt.ng { border-color: var(--ng); background: var(--ng-light); }
  .opt.ng .no { background: var(--ng); color: white; }
  .opt:disabled { cursor: default; }
  .tf { display: flex; gap: 12px; margin-top: 16px; }
  .tf .opt { flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 14px 8px; }
  .tf .mark { font-size: 2.2rem; line-height: 1.1; font-weight: bold; }
  .tf .lbl { font-size: 0.85rem; font-weight: bold; line-height: 1.4; }
  .tf .lbl small { display: block; font-weight: normal; color: var(--text-sub); }

  .fb { margin-top: 16px; border-radius: 14px; padding: 14px; line-height: 1.9; font-size: 0.95rem; }
  .fb.ok { background: var(--ok-light); border: 2px solid #86efac; }
  .fb.ng { background: var(--ng-light); border: 2px solid #fca5a5; }
  .fb .res { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; }
  .fb .ans { font-weight: bold; margin-bottom: 6px; }
  .fb .script { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .fb .script button { border: none; background: var(--main); color: white; border-radius: 14px; padding: 2px 10px; font-size: 0.75rem; margin-left: 6px; }

  .qfoot { display: flex; gap: 10px; margin-top: 16px; }
  .qfoot .btn { flex: 1; }
  .unans { text-align: center; font-size: 0.78rem; color: var(--text-sub); margin-top: 8px; }

  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 14px; }
  .grid button { border: none; border-radius: 6px; padding: 6px 0; font-size: 0.7rem; background: var(--gray-light); color: var(--gray); }
  .grid button.done { background: var(--main-mid); color: var(--main-dark); font-weight: bold; }
  .grid button.cur { outline: 2px solid var(--main); }

  /* ===== RESULT ===== */
  .score { text-align: center; padding: 8px 0 4px; }
  .score .big { font-size: 3rem; font-weight: bold; color: var(--main); line-height: 1.1; }
  .score .big small { font-size: 1.1rem; color: var(--text-sub); }
  .pass { display: inline-block; margin-top: 8px; border-radius: 20px; padding: 5px 16px; font-weight: bold; font-size: 0.9rem; }
  .pass.y { background: var(--ok-light); color: var(--ok); }
  .pass.n { background: var(--ng-light); color: var(--ng); }
  details.wrong { border-top: 1px solid var(--line); padding: 10px 0; }
  details.wrong summary { cursor: pointer; line-height: 1.8; font-size: 0.92rem; list-style: none; }
  details.wrong summary::before { content: '▶ '; color: var(--main); font-size: 0.7rem; }
  details.wrong[open] summary::before { content: '▼ '; }
  details.wrong .body { font-size: 0.88rem; line-height: 1.85; margin-top: 6px; background: var(--gray-light); border-radius: 10px; padding: 10px; }
  .hist { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.85rem; }

  /* ===== LOGIN ===== */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .card { width: 100%; max-width: 380px; text-align: center; }
  #login .logo { font-size: 2.6rem; }
  #login h1 { font-size: 1.15rem; margin: 6px 0 2px; }
  #login input {
    width: 100%; padding: 13px; border: 2px solid var(--line); border-radius: 12px; font-size: 1rem; margin: 16px 0 10px;
  }
  #login input:focus { outline: none; border-color: var(--main); }
  .login-error { color: var(--ng); font-size: 0.82rem; margin-top: 8px; display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: white;
    padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 0.92; }
  a.link { color: var(--main); font-weight: bold; text-decoration: none; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="card">
    <div class="logo">🤝</div>
    <h1>介護SSW 試験対策</h1>
    <div class="sub">Persiapan Ujian SSW Kaigo (Perawat Lansia)</div>
    <input type="password" id="pw" placeholder="パスワード / Kata sandi" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn" onclick="doLogin()">ログイン / Masuk</button>
    <div class="login-error" id="loginError">❌ パスワードが違います / Kata sandi salah</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header>
    <div class="header-inner">
      <div class="header-title" onclick="go('home')">🤝 介護SSW 試験対策<small>Persiapan Ujian SSW Kaigo</small></div>
      <div class="toggles">
        <button class="tg" id="tgFuri" onclick="toggleSet('furi')">ふりがな</button>
        <button class="tg" id="tgIdn" onclick="toggleSet('idn')">ID</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// 問題データ：介護の基本／こころとからだのしくみ／コミュニケーション技術（オリジナル問題）
// 書き方：漢字《よみ》 でふりがな。本番と同じく4択で、a は正解の番号（0〜3）。
window.QB = window.QB || [];
QB.push(
// ===== 介護の基本 =====
{id:'kh01',c:'kihon',t:'mc',
 q:'自立支援《じりつしえん》の考《かんが》え方《かた》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang paling tepat sebagai pemikiran dukungan kemandirian.',
 o:['できることは本人《ほんにん》にしてもらい、できないところを手伝《てつだ》う','時間《じかん》がかかるので、全部《ぜんぶ》介護職《かいごしょく》がする','本人《ほんにん》ができないことも、一人《ひとり》でするように言《い》う','家族《かぞく》の希望《きぼう》だけで、手伝《てつだ》う内容《ないよう》を決《き》める'],
 oi:['Hal yang bisa dilakukan, dilakukan oleh orang itu sendiri; bagian yang tidak bisa dibantu','Karena memakan waktu, semuanya dilakukan oleh perawat','Menyuruh melakukan sendiri walaupun tidak bisa','Menentukan bantuan hanya berdasarkan keinginan keluarga'],
 a:0,
 e:'自立支援《じりつしえん》は、残《のこ》っている力《ちから》（残存機能《ざんぞんきのう》）を活《い》かすこと。全部《ぜんぶ》手伝《てつだ》うと、できることもできなくなる。',
 ei:'Dukungan kemandirian berarti memanfaatkan kemampuan yang masih ada. Jika semua dibantu, hal yang tadinya bisa pun menjadi tidak bisa.'},
{id:'kh02',c:'kihon',t:'mc',
 q:'利用者《りようしゃ》の尊厳《そんげん》を守《まも》る対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu tindakan yang paling tepat untuk menjaga martabat pengguna layanan.',
 o:['名字《みょうじ》に「さん」をつけて呼《よ》ぶ','子《こ》どもに話《はな》すように話《はな》す','トイレのドアを開《あ》けたまま介助《かいじょ》する','本人《ほんにん》の前《まえ》で、ほかの職員《しょくいん》と本人《ほんにん》の失敗《しっぱい》を話《はな》す'],
 oi:['Memanggil dengan nama keluarga ditambah "-san"','Berbicara seperti kepada anak kecil','Membantu di toilet dengan pintu terbuka','Membicarakan kegagalan orang itu dengan staf lain di depannya'],
 a:0,
 e:'利用者《りようしゃ》は人生《じんせい》の先輩《せんぱい》。子《こ》ども扱《あつか》いしない、プライバシーを守《まも》る、恥《は》ずかしい思《おも》いをさせないことが大切《たいせつ》。',
 ei:'Pengguna layanan adalah senior dalam kehidupan. Penting untuk tidak memperlakukan seperti anak, menjaga privasi, dan tidak mempermalukan.'},
{id:'kh03',c:'kihon',t:'mc',
 q:'個人情報《こじんじょうほう》の取《と》り扱《あつか》いとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara penanganan informasi pribadi yang paling tepat.',
 o:['記録《きろく》は決《き》められた場所《ばしょ》に保管《ほかん》する','利用者《りようしゃ》のことを、家《いえ》で家族《かぞく》に話《はな》す','利用者《りようしゃ》の写真《しゃしん》をSNSにのせる','記録《きろく》を家《いえ》に持《も》って帰《かえ》って書《か》く'],
 oi:['Menyimpan catatan di tempat yang ditentukan','Menceritakan tentang pengguna kepada keluarga di rumah','Mengunggah foto pengguna ke media sosial','Membawa pulang catatan untuk ditulis di rumah'],
 a:0,
 e:'仕事《しごと》で知《し》った利用者《りようしゃ》の情報《じょうほう》は、外《そと》で話《はな》してはいけない（守秘義務《しゅひぎむ》）。仕事《しごと》をやめた後《あと》も同《おな》じ。',
 ei:'Informasi pengguna yang diketahui saat bekerja tidak boleh diceritakan di luar (kewajiban menjaga rahasia). Ini berlaku juga setelah berhenti bekerja.'},
{id:'kh04',c:'kihon',t:'mc',
 q:'身体拘束《しんたいこうそく》にあたるものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang termasuk pengekangan fisik.',
 o:['ベッドのまわりを柵《さく》で囲《かこ》んで、自分《じぶん》で降《お》りられないようにする','転《ころ》ばないように、廊下《ろうか》に手《て》すりをつける','ベッドを低《ひく》くする','歩《ある》くときに、そばで見守《みまも》る'],
 oi:['Mengelilingi tempat tidur dengan pagar agar tidak bisa turun sendiri','Memasang pegangan di lorong agar tidak jatuh','Merendahkan tempat tidur','Mengawasi di dekatnya saat berjalan'],
 a:0,
 e:'自分《じぶん》で降《お》りられないように柵《さく》で囲《かこ》むことは身体拘束《しんたいこうそく》。身体拘束《しんたいこうそく》は原則《げんそく》禁止《きんし》。手《て》すり・低《ひく》いベッド・見守《みまも》りは安全《あんぜん》のための工夫《くふう》。',
 ei:'Mengelilingi tempat tidur dengan pagar agar tidak bisa turun adalah pengekangan fisik, yang pada prinsipnya dilarang. Pegangan, tempat tidur rendah, dan pengawasan adalah upaya keselamatan.'},
{id:'kh05',c:'kihon',t:'mc',
 q:'やむを得《え》ず身体拘束《しんたいこうそく》をするときの3つの条件《じょうけん》として、正《ただ》しいものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang benar sebagai 3 syarat ketika terpaksa melakukan pengekangan fisik.',
 o:['切迫性《せっぱくせい》・非代替性《ひだいたいせい》・一時性《いちじせい》','安全性《あんぜんせい》・快適性《かいてきせい》・経済性《けいざいせい》','家族《かぞく》の希望《きぼう》・医師《いし》の希望《きぼう》・職員《しょくいん》の希望《きぼう》','夜間《やかん》・休日《きゅうじつ》・人手不足《ひとでぶそく》'],
 oi:['Kedaruratan, tidak ada alternatif, sementara','Keamanan, kenyamanan, ekonomi','Keinginan keluarga, dokter, dan staf','Malam hari, hari libur, kekurangan staf'],
 a:0,
 e:'切迫性《せっぱくせい》（命《いのち》などに危険《きけん》がせまっている）、非代替性《ひだいたいせい》（ほかの方法《ほうほう》がない）、一時性《いちじせい》（一時的《いちじてき》）の3つすべてが必要《ひつよう》。人手不足《ひとでぶそく》は理由《りゆう》にならない。',
 ei:'Ketiganya harus terpenuhi: kedaruratan (bahaya mendesak bagi nyawa dll.), tidak ada cara lain, dan bersifat sementara. Kekurangan staf bukan alasan.'},
{id:'kh06',c:'kihon',t:'mc',
 q:'ICF（国際生活機能分類《こくさいせいかつきのうぶんるい》）の「参加《さんか》」にあたるものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang termasuk "partisipasi" dalam ICF.',
 o:['地域《ちいき》のお祭《まつ》りに出《で》る','ひざの関節《かんせつ》が動《うご》く','一人《ひとり》で歩《ある》く','家《いえ》に手《て》すりがある'],
 oi:['Ikut festival di lingkungan','Sendi lutut bisa bergerak','Berjalan sendiri','Di rumah ada pegangan'],
 a:0,
 e:'ICFでは、心身機能《しんしんきのう》（関節《かんせつ》が動《うご》く）、活動《かつどう》（歩《ある》く）、参加《さんか》（地域《ちいき》や家庭《かてい》での役割《やくわり》・行事《ぎょうじ》）、環境因子《かんきょういんし》（手《て》すり）などで考《かんが》える。',
 ei:'Dalam ICF dilihat dari fungsi tubuh (sendi bergerak), aktivitas (berjalan), partisipasi (peran/kegiatan di masyarakat atau keluarga), faktor lingkungan (pegangan), dll.'},
{id:'kh07',c:'kihon',t:'mc',
 q:'QOLの意味《いみ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu arti QOL yang paling tepat.',
 o:['生活《せいかつ》の質《しつ》','日常生活動作《にちじょうせいかつどうさ》','介護保険《かいごほけん》の点数《てんすう》','病気《びょうき》の名前《なまえ》'],
 oi:['Kualitas hidup','Aktivitas kehidupan sehari-hari','Poin asuransi perawatan','Nama penyakit'],
 a:0,
 e:'QOL（Quality of Life）＝生活《せいかつ》の質《しつ》。その人《ひと》らしく満足《まんぞく》して暮《く》らせることを大切《たいせつ》にする。日常生活動作《にちじょうせいかつどうさ》はADL。',
 ei:'QOL = kualitas hidup, menekankan hidup puas sesuai dirinya. Aktivitas kehidupan sehari-hari adalah ADL.'},
{id:'kh08',c:'kihon',t:'mc',
 q:'ノーマライゼーションの考《かんが》え方《かた》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 oi:['Penyandang disabilitas hidup biasa di masyarakat sama seperti orang lain','Penyandang disabilitas hanya tinggal di fasilitas','Lansia sebaiknya tidak keluar rumah','Membuat kota khusus penyandang disabilitas'],
 a:0,
 e:'ノーマライゼーションは、障害《しょうがい》の有無《うむ》に関係《かんけい》なく、地域《ちいき》で普通《ふつう》の生活《せいかつ》を送《おく》れる社会《しゃかい》をめざす考《かんが》え方《かた》。',
 ei:'Normalisasi adalah pemikiran yang bertujuan agar semua orang, dengan atau tanpa disabilitas, bisa hidup normal di masyarakat.'},
{id:'kh09',c:'kihon',t:'mc',

 qi:'Dalam sistem asuransi perawatan Jepang, mulai usia berapa orang membayar premi (peserta asuransi)?',
 o:['40歳《さい》以上《いじょう》','20歳《さい》以上《いじょう》','60歳《さい》以上《いじょう》','75歳《さい》以上《いじょう》'],
 oi:['40 tahun ke atas','20 tahun ke atas','60 tahun ke atas','75 tahun ke atas'],
 a:0,

{id:'kh10',c:'kihon',t:'mc',

 oi:['7 tingkat: perlu dukungan 1–2 dan perlu perawatan 1–5','3 tingkat: perlu perawatan 1–3','5 tingkat: perlu dukungan 1–5','10 tingkat: perlu perawatan 1–10'],

 ei:'Ada 7 tingkat: perlu dukungan 1–2 dan perlu perawatan 1–5. Semakin besar angkanya, semakin banyak perawatan yang dibutuhkan.'},
{id:'kh11',c:'kihon',t:'mc',
 q:'ケアプラン（居宅《きょたく》サービス計画《けいかく》）を作《つく》る人《ひと》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Siapa yang paling tepat sebagai pembuat rencana perawatan (care plan)?',

 a:0,

{id:'kh12',c:'kihon',t:'mc',
 q:'介護過程《かいごかてい》の順番《じゅんばん》として、正《ただ》しいものを1つ選《えら》びなさい。',
 qi:'Pilih urutan proses perawatan yang benar.',
 o:['アセスメント → 計画《けいかく》 → 実施《じっし》 → 評価《ひょうか》','計画《けいかく》 → 評価《ひょうか》 → アセスメント → 実施《じっし》','実施《じっし》 → 計画《けいかく》 → アセスメント → 評価《ひょうか》','評価《ひょうか》 → 実施《じっし》 → 計画《けいかく》 → アセスメント'],
 oi:['Asesmen → rencana → pelaksanaan → evaluasi','Rencana → evaluasi → asesmen → pelaksanaan','Pelaksanaan → rencana → asesmen → evaluasi','Evaluasi → pelaksanaan → rencana → asesmen'],
 a:0,
 e:'まず情報《じょうほう》を集《あつ》めて分析《ぶんせき》（アセスメント）し、計画《けいかく》を立《た》て、実施《じっし》して、評価《ひょうか》する。評価《ひょうか》の結果《けっか》で計画《けいかく》を見直《みなお》す。',
 ei:'Pertama mengumpulkan dan menganalisis informasi (asesmen), membuat rencana, melaksanakan, lalu mengevaluasi. Rencana ditinjau ulang berdasarkan hasil evaluasi.'},
{id:'kh13',c:'kihon',t:'mc',
 q:'歩《ある》く訓練《くんれん》など、立《た》つ・歩《ある》くといった基本的《きほんてき》な動作《どうさ》のリハビリを担当《たんとう》する専門職《せんもんしょく》はどれか。',
 qi:'Tenaga profesional mana yang menangani rehabilitasi gerakan dasar seperti berdiri dan berjalan?',
 o:['理学療法士《りがくりょうほうし》','栄養士《えいようし》','薬剤師《やくざいし》','歯科医師《しかいし》'],
 oi:['Fisioterapis','Ahli gizi','Apoteker','Dokter gigi'],
 a:0,
 e:'理学療法士《りがくりょうほうし》（PT）は立《た》つ・歩《ある》くなどの基本動作《きほんどうさ》。作業療法士《さぎょうりょうほうし》（OT）は食事《しょくじ》・着替《きが》えなど生活《せいかつ》の動作《どうさ》。言語聴覚士《げんごちょうかくし》（ST）は話《はな》す・飲《の》み込《こ》む。',
 ei:'Fisioterapis (PT) menangani gerakan dasar seperti berdiri dan berjalan. Terapis okupasi (OT) menangani aktivitas sehari-hari seperti makan dan berganti baju. Terapis wicara (ST) menangani berbicara dan menelan.'},
{id:'kh14',c:'kihon',t:'mc',
 q:'守秘義務《しゅひぎむ》について、正《ただ》しいものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang benar tentang kewajiban menjaga rahasia.',
 o:['仕事《しごと》をやめた後《あと》も守《まも》らなければならない','仕事《しごと》をやめたら、話《はな》してもよい','家族《かぞく》には、何《なん》でも話《はな》してよい','休《やす》みの日《ひ》は、話《はな》してもよい'],
 oi:['Harus dijaga meskipun sudah berhenti bekerja','Boleh diceritakan setelah berhenti bekerja','Boleh menceritakan apa saja kepada keluarga','Boleh diceritakan pada hari libur'],

 ei:'Rahasia yang diketahui saat bekerja tidak boleh diceritakan, baik setelah berhenti bekerja, pada hari libur, maupun kepada keluarga sendiri.'},
{id:'kh15',c:'kihon',t:'mc',
 q:'介護職《かいごしょく》が利用者《りようしゃ》に食事《しょくじ》を与《あた》えず、放置《ほうち》した。これはどの虐待《ぎゃくたい》にあたるか。',
 qi:'Perawat tidak memberi makan dan menelantarkan pengguna. Ini termasuk kekerasan jenis apa?',
 o:['介護等放棄《かいごとうほうき》（ネグレクト）','経済的虐待《けいざいてきぎゃくたい》','性的虐待《せいてきぎゃくたい》','身体的虐待《しんたいてきぎゃくたい》'],
 oi:['Penelantaran (neglect)','Kekerasan ekonomi','Kekerasan seksual','Kekerasan fisik'],
 a:0,
 e:'必要《ひつよう》な食事《しょくじ》・介護《かいご》をしないで放置《ほうち》することはネグレクト（介護等放棄《かいごとうほうき》）。高齢者虐待《こうれいしゃぎゃくたい》には、身体的《しんたいてき》・心理的《しんりてき》・性的《せいてき》・経済的《けいざいてき》・ネグレクトの5つがある。',
 ei:'Tidak memberi makan atau perawatan yang dibutuhkan disebut penelantaran (neglect). Ada 5 jenis kekerasan terhadap lansia: fisik, psikologis, seksual, ekonomi, dan penelantaran.'},
{id:'kh16',c:'kihon',t:'mc',
 q:'経済的虐待《けいざいてきぎゃくたい》にあたるものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang termasuk kekerasan ekonomi.',
 o:['本人《ほんにん》の年金《ねんきん》を、家族《かぞく》が勝手《かって》に使《つか》う','大声《おおごえ》でどなる','長時間《ちょうじかん》おむつを替《か》えない','たたく'],
 oi:['Keluarga memakai uang pensiun orang itu tanpa izin','Membentak dengan suara keras','Lama tidak mengganti popok','Memukul'],
 a:0,
 e:'本人《ほんにん》のお金《かね》や財産《ざいさん》を勝手《かって》に使《つか》うことは経済的虐待《けいざいてきぎゃくたい》。どなる＝心理的《しんりてき》、おむつを替《か》えない＝ネグレクト、たたく＝身体的《しんたいてき》虐待《ぎゃくたい》。',
 ei:'Memakai uang atau harta orang itu tanpa izin adalah kekerasan ekonomi. Membentak = psikologis, tidak mengganti popok = penelantaran, memukul = fisik.'},
{id:'kh17',c:'kihon',t:'mc',
 q:'施設《しせつ》で、利用者《りようしゃ》への虐待《ぎゃくたい》と思《おも》われることを見《み》つけた。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Di fasilitas, Anda menemukan hal yang tampaknya kekerasan terhadap pengguna. Pilih satu tindakan yang paling tepat.',
 o:['市町村《しちょうそん》に通報《つうほう》する（施設《しせつ》の上司《じょうし》にも報告《ほうこく》する）','だれにも言《い》わない','本人《ほんにん》が何《なに》も言《い》わないので、そのままにする','SNSに書《か》く'],
 oi:['Melapor ke pemerintah kota (dan juga melapor ke atasan di fasilitas)','Tidak memberi tahu siapa pun','Dibiarkan karena orang itu tidak mengatakan apa-apa','Menulis di media sosial'],
 a:0,
 e:'介護施設《かいごしせつ》の職員《しょくいん》が虐待《ぎゃくたい》と思《おも》われることを見《み》つけたときは、市町村《しちょうそん》に通報《つうほう》する義務《ぎむ》がある。',
 ei:'Staf fasilitas perawatan yang menemukan dugaan kekerasan wajib melaporkannya ke pemerintah kota.'},
{id:'kh18',c:'kihon',t:'mc',
 q:'ヒヤリハット報告《ほうこく》の目的《もくてき》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu tujuan laporan hiyari-hatto (nyaris celaka) yang paling tepat.',
 o:['事故《じこ》が起《お》きないように、原因《げんいん》と対策《たいさく》をみんなで考《かんが》える','失敗《しっぱい》した人《ひと》をしかる','給料《きゅうりょう》を減《へ》らす','家族《かぞく》にあやまる'],
 oi:['Bersama-sama memikirkan penyebab dan pencegahan agar kecelakaan tidak terjadi','Memarahi orang yang gagal','Memotong gaji','Meminta maaf kepada keluarga'],
 a:0,
 e:'ヒヤリハットは「事故《じこ》にはならなかったが、ヒヤッとしたこと」。報告《ほうこく》して共有《きょうゆう》し、大《おお》きな事故《じこ》を防《ふせ》ぐ。人《ひと》を責《せ》めるためではない。',
 ei:'Hiyari-hatto adalah "kejadian yang nyaris celaka tetapi tidak menjadi kecelakaan". Dilaporkan dan dibagikan untuk mencegah kecelakaan besar, bukan untuk menyalahkan orang.'},
{id:'kh19',c:'kihon',t:'mc',
 q:'標準予防策《ひょうじゅんよぼうさく》（スタンダードプリコーション）の考《かんが》え方《かた》として、正《ただ》しいものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang benar tentang tindakan pencegahan standar (standard precaution).',
 o:['すべての人《ひと》の血液《けつえき》・体液《たいえき》・排泄物《はいせつぶつ》は、感染《かんせん》の可能性《かのうせい》があるものとして扱《あつか》う','感染症《かんせんしょう》の人《ひと》だけ手袋《てぶくろ》をする','元気《げんき》な人《ひと》の排泄物《はいせつぶつ》は、素手《すで》でさわってよい','手袋《てぶくろ》をしたら、手洗《てあら》いはしなくてよい'],
 oi:['Darah, cairan tubuh, dan kotoran semua orang dianggap berpotensi menular','Hanya memakai sarung tangan untuk orang yang terinfeksi','Kotoran orang yang sehat boleh disentuh tanpa sarung tangan','Jika memakai sarung tangan, tidak perlu cuci tangan'],
 a:0,
 e:'だれが感染《かんせん》しているかわからないので、全員《ぜんいん》の血液《けつえき》・体液《たいえき》・排泄物《はいせつぶつ》などに同《おな》じ予防《よぼう》をする。手袋《てぶくろ》を外《はず》した後《あと》も手洗《てあら》いをする。',
 ei:'Karena tidak diketahui siapa yang terinfeksi, pencegahan yang sama dilakukan terhadap darah, cairan tubuh, dan kotoran semua orang. Setelah melepas sarung tangan pun tetap cuci tangan.'},
{id:'kh20',c:'kihon',t:'mc',
 q:'嘔吐物《おうとぶつ》の片付《かたづ》けで、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang paling tepat dalam membersihkan muntahan.',
 o:['手袋《てぶくろ》・マスク・エプロンをつけて、次亜塩素酸《じあえんそさん》ナトリウムで消毒《しょうどく》する','素手《すで》でティッシュを使《つか》って取《と》る','乾《かわ》くまでそのままにしておく','水《みず》で流《なが》すだけにする'],
 oi:['Memakai sarung tangan, masker, dan celemek, lalu disinfeksi dengan natrium hipoklorit','Mengambil dengan tisu tanpa sarung tangan','Dibiarkan sampai kering','Hanya disiram dengan air'],
 a:0,
 e:'嘔吐物《おうとぶつ》にはノロウイルスなどがいることがある。ノロウイルスにはアルコールが効《き》きにくいので、次亜塩素酸《じあえんそさん》ナトリウムを使《つか》う。乾《かわ》くとウイルスが空気中《くうきちゅう》に広《ひろ》がる。',
 ei:'Muntahan bisa mengandung norovirus. Alkohol kurang efektif terhadap norovirus, jadi gunakan natrium hipoklorit. Jika mengering, virus menyebar di udara.'},
{id:'kh21',c:'kihon',t:'mc',
 q:'手洗《てあら》いのタイミングとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu waktu cuci tangan yang paling tepat.',
 o:['ケアの前《まえ》と後《あと》','仕事《しごと》の始《はじ》めだけ','手《て》が汚《よご》れて見《み》えるときだけ','一日《いちにち》に1回《かい》'],
 oi:['Sebelum dan sesudah perawatan','Hanya saat mulai bekerja','Hanya saat tangan terlihat kotor','Sekali sehari'],
 a:0,
 e:'手洗《てあら》いは感染予防《かんせんよぼう》の基本《きほん》。「1つのケアの前《まえ》と後《あと》」に行《おこな》う。見《み》た目《め》がきれいでも、菌《きん》やウイルスはついている。',
 ei:'Cuci tangan adalah dasar pencegahan infeksi, dilakukan "sebelum dan sesudah setiap perawatan". Walaupun terlihat bersih, kuman dan virus bisa menempel.'},
{id:'kh22',c:'kihon',t:'mc',
 q:'意思《いし》をことばで伝《つた》えることが難《むずか》しい利用者《りようしゃ》への対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu tindakan paling tepat bagi pengguna yang sulit menyampaikan keinginannya dengan kata-kata.',

 oi:['Memahami perasaannya dari ekspresi wajah dan gerak-gerik','Perawat memutuskan tanpa bertanya','Memutuskan hanya dengan pendapat keluarga','Menunggu sampai bisa berbicara'],
 a:0,
 e:'ことばで伝《つた》えられなくても、本人《ほんにん》の思《おも》いはある。表情《ひょうじょう》・しぐさ・これまでの生活《せいかつ》から思《おも》いを考《かんが》え、自己決定《じこけってい》を支《ささ》える。',
 ei:'Walaupun tidak bisa menyampaikan dengan kata-kata, orang itu tetap punya keinginan. Pikirkan keinginannya dari ekspresi, gerak-gerik, dan riwayat hidupnya, lalu dukung pengambilan keputusannya sendiri.'},
{id:'kh23',c:'kihon',t:'mc',
 q:'特別養護老人《とくべつようごろうじん》ホームに新《あたら》しく入所《にゅうしょ》できる人《ひと》は、原則《げんそく》として要介護《ようかいご》いくつ以上《いじょう》か。',
 qi:'Pada prinsipnya, orang dengan tingkat perlu perawatan berapa ke atas yang bisa baru masuk ke panti lansia khusus (tokuyou)?',

 oi:['Perlu perawatan 3 ke atas','Perlu dukungan 1 ke atas','Perlu perawatan 1 ke atas','Hanya perlu perawatan 5'],
 a:0,
 e:'特別養護老人《とくべつようごろうじん》ホーム（特養《とくよう》）は、原則《げんそく》として要介護《ようかいご》3以上《いじょう》の人《ひと》が入所《にゅうしょ》する。',
 ei:'Panti lansia khusus (tokuyou) pada prinsipnya untuk orang dengan tingkat perlu perawatan 3 ke atas.'},
{id:'kh24',c:'kihon',t:'mc',
 q:'介護職《かいごしょく》として、最《もっと》も適切《てきせつ》な態度《たいど》を1つ選《えら》びなさい。',
 qi:'Pilih satu sikap yang paling tepat sebagai perawat.',
 o:['利用者《りようしゃ》の生活習慣《せいかつしゅうかん》や好《この》みを大切《たいせつ》にする','職員《しょくいん》の都合《つごう》で、起《お》きる時間《じかん》を全員《ぜんいん》同《おな》じにする','好《す》きな利用者《りようしゃ》だけ、ていねいに介護《かいご》する','利用者《りようしゃ》の宗教《しゅうきょう》を否定《ひてい》する'],
 oi:['Menghargai kebiasaan hidup dan kesukaan pengguna','Menyamakan jam bangun semua orang demi kemudahan staf','Hanya merawat dengan baik pengguna yang disukai','Menolak agama pengguna'],
 a:0,
 e:'その人《ひと》らしい生活《せいかつ》を支《ささ》えるのが介護《かいご》（個別《こべつ》ケア）。職員《しょくいん》の都合《つごう》を優先《ゆうせん》しない。だれにも公平《こうへい》に接《せっ》する。',
 ei:'Perawatan adalah mendukung kehidupan sesuai pribadi masing-masing (perawatan individual). Jangan mengutamakan kemudahan staf, dan bersikap adil kepada semua orang.'},

{id:'kk01',c:'kokoro',t:'mc',

{id:'kk02',c:'kokoro',t:'mc',

 qi:'Pilih satu alasan paling tepat mengapa lansia mudah mengalami dehidrasi.',

{id:'kk03',c:'kokoro',t:'mc',
 q:'脱水《だっすい》のサインとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 a:0,
 e:'脱水《だっすい》では、口《くち》や皮膚《ひふ》のかわき、尿量《にょうりょう》の減少《げんしょう》、ぼんやりする、などが見《み》られる。気《き》づいたら看護職《かんごしょく》に報告《ほうこく》する。',
 ei:'Pada dehidrasi terlihat mulut dan kulit kering, urine berkurang, tampak lesu, dll. Jika menyadarinya, laporkan ke perawat (kangoshoku).'},
{id:'kk04',c:'kokoro',t:'mc',
 q:'食《た》べ物《もの》が口《くち》から胃《い》へ行《い》く順番《じゅんばん》として、正《ただ》しいものを1つ選《えら》びなさい。',
 qi:'Pilih urutan yang benar makanan berjalan dari mulut ke lambung.',
 o:['口《くち》 → 咽頭《いんとう》 → 食道《しょくどう》 → 胃《い》','口《くち》 → 気管《きかん》 → 食道《しょくどう》 → 胃《い》','口《くち》 → 食道《しょくどう》 → 咽頭《いんとう》 → 胃《い》','口《くち》 → 肺《はい》 → 食道《しょくどう》 → 胃《い》'],

 a:0,

 ei:'Makanan berjalan dari mulut → faring (tenggorokan) → kerongkongan → lambung. Jika masuk ke trakea, itu disebut aspirasi (goen).'},
{id:'kk05',c:'kokoro',t:'mc',
 q:'便秘《べんぴ》の予防《よぼう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara pencegahan sembelit yang paling tepat.',

 oi:['Minum cukup air, makan serat, dan menggerakkan tubuh','Mengurangi minum','Berbaring di tempat tidur sepanjang hari','Menahan walaupun ingin buang air besar'],
 a:0,
 e:'便秘《べんぴ》予防《よぼう》には、水分《すいぶん》・食物繊維《しょくもつせんい》・適度《てきど》な運動《うんどう》・決《き》まった時間《じかん》のトイレが大切《たいせつ》。便意《べんい》をがまんすると便秘《べんぴ》になりやすい。',

{id:'kk06',c:'kokoro',t:'mc',
 q:'あお向《む》け（仰臥位《ぎょうがい》）で寝《ね》ているとき、褥瘡《じょくそう》が最《もっと》もできやすい場所《ばしょ》はどこか。',

 oi:['Daerah tulang sakrum (sekitar tulang bokong)','Perut','Bagian depan lutut','Telapak tangan'],
 a:0,
 e:'あお向《む》けでは、骨《ほね》が出《で》ている仙骨部《せんこつぶ》・かかと・肩甲骨《けんこうこつ》・後頭部《こうとうぶ》に褥瘡《じょくそう》ができやすい。',

{id:'kk07',c:'kokoro',t:'mc',
 q:'認知症《にんちしょう》の中核症状《ちゅうかくしょうじょう》にあたるものを1つ選《えら》びなさい。',

 o:['記憶障害《きおくしょうがい》（新《あたら》しいことを覚《おぼ》えられない）','大声《おおごえ》を出《だ》す','歩《ある》き回《まわ》る','「物《もの》を盗《と》られた」と言《い》う'],
 oi:['Gangguan memori (tidak bisa mengingat hal baru)','Berteriak','Berjalan ke sana kemari','Mengatakan "barang saya dicuri"'],
 a:0,
 e:'中核症状《ちゅうかくしょうじょう》は脳《のう》の障害《しょうがい》で直接《ちょくせつ》起《お》こる症状《しょうじょう》（記憶障害《きおくしょうがい》・見当識障害《けんとうしきしょうがい》など）。大声《おおごえ》・歩《ある》き回《まわ》る・物盗《ものと》られ妄想《もうそう》はBPSD（行動《こうどう》・心理症状《しんりしょうじょう》）。',
 ei:'Gejala inti terjadi langsung akibat gangguan otak (gangguan memori, disorientasi, dll.). Berteriak, berjalan ke sana kemari, dan delusi barang dicuri adalah BPSD (gejala perilaku dan psikologis).'},
{id:'kk08',c:'kokoro',t:'mc',

 qi:'Pilih satu contoh disorientasi yang paling tepat.',

 oi:['Tidak tahu tanggal hari ini atau tempat sekarang berada','Tidak bisa membaca karena hurufnya kecil','Pendengaran kurang','Tidak bisa makan karena sakit gigi'],
 a:0,

{id:'kk09',c:'kokoro',t:'mc',

{id:'kk10',c:'kokoro',t:'mc',
 q:'「実際《じっさい》にはいない子《こ》どもが見《み》える」などの幻視《げんし》が特徴的《とくちょうてき》な認知症《にんちしょう》はどれか。',

{id:'kk11',c:'kokoro',t:'mc',

 oi:['Demensia vaskular','Demensia Alzheimer','Demensia badan Lewy','Demensia usia muda'],
 a:0,
 e:'血管性認知症《けっかんせいにんちしょう》は脳梗塞《のうこうそく》・脳出血《のうしゅっけつ》が原因《げんいん》。できることとできないことの差《さ》がはっきりしていることが多《おお》い。',

{id:'kk12',c:'kokoro',t:'mc',
 q:'マズローの欲求階層説《よっきゅうかいそうせつ》で、最《もっと》も基本的《きほんてき》な（いちばん下《した》の）欲求《よっきゅう》はどれか。',

 e:'下《した》から、生理的欲求《せいりてきよっきゅう》→安全《あんぜん》→所属《しょぞく》と愛《あい》→承認《しょうにん》→自己実現《じこじつげん》の5段階《だんかい》。',
 ei:'Dari bawah: fisiologis → rasa aman → rasa memiliki dan kasih sayang → penghargaan → aktualisasi diri, total 5 tingkat.'},
{id:'kk13',c:'kokoro',t:'mc',

 qi:'Pilih satu gejala paling tepat yang terjadi karena lama berbaring di tempat tidur (sindrom disuse).',

 a:0,
 e:'体《からだ》を使《つか》わないと、筋力低下《きんりょくていか》・関節《かんせつ》の拘縮《こうしゅく》・褥瘡《じょくそう》・意欲《いよく》の低下《ていか》などが起《お》こる。できるだけ体《からだ》を動《うご》かすことが予防《よぼう》になる。',
 ei:'Jika tubuh tidak digunakan, terjadi penurunan kekuatan otot, kekakuan sendi, luka tekan, menurunnya semangat, dll. Menggerakkan tubuh sebisa mungkin adalah pencegahannya.'},
{id:'kk14',c:'kokoro',t:'mc',
 q:'成人《せいじん》の安静時《あんせいじ》の脈拍《みゃくはく》の正常値《せいじょうち》（1分間《ぷんかん》）として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu nilai normal denyut nadi orang dewasa saat istirahat (per menit) yang paling tepat.',
 o:['60〜100回《かい》','20〜40回《かい》','120〜160回《かい》','200回以上《かいいじょう》'],
 oi:['60–100 kali','20–40 kali','120–160 kali','200 kali lebih'],
 a:0,
 e:'成人《せいじん》の脈拍《みゃくはく》はおよそ1分間《ぷんかん》に60〜100回《かい》。いつもと違《ちが》うときは看護職《かんごしょく》に報告《ほうこく》する。',
 ei:'Denyut nadi orang dewasa sekitar 60–100 kali per menit. Jika berbeda dari biasanya, laporkan ke perawat (kangoshoku).'},
{id:'kk15',c:'kokoro',t:'mc',
 q:'寝《ね》ている状態《じょうたい》から急《きゅう》に起《お》き上《あ》がると、めまいやふらつきが起《お》こることがある。これを何《なん》というか。',
 qi:'Jika tiba-tiba bangun dari posisi berbaring, bisa terjadi pusing atau sempoyongan. Ini disebut apa?',
 o:['起立性低血圧《きりつせいていけつあつ》','高血圧《こうけつあつ》','脱水《だっすい》','発熱《はつねつ》'],
 oi:['Hipotensi ortostatik','Hipertensi','Dehidrasi','Demam'],
 a:0,
 e:'急《きゅう》に起《お》きると血圧《けつあつ》が下《さ》がり、ふらつく（起立性低血圧《きりつせいていけつあつ》）。ゆっくり起《お》き上《あ》がり、少《すこ》し座《すわ》ってから立《た》つ。',
 ei:'Jika bangun tiba-tiba, tekanan darah turun dan menjadi sempoyongan (hipotensi ortostatik). Bangun perlahan, duduk sebentar, baru berdiri.'},
{id:'kk16',c:'kokoro',t:'mc',
 q:'高齢者《こうれいしゃ》の睡眠《すいみん》の特徴《とくちょう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu ciri tidur lansia yang paling tepat.',
 o:['眠《ねむ》りが浅《あさ》く、夜中《よなか》に目《め》が覚《さ》めやすい','若《わか》いときより長《なが》く深《ふか》く眠《ねむ》る','一度《いちど》寝《ね》ると朝《あさ》まで絶対《ぜったい》に起《お》きない','昼《ひる》に眠《ねむ》くなることはない'],
 oi:['Tidur dangkal dan mudah terbangun tengah malam','Tidur lebih lama dan lebih dalam daripada saat muda','Sekali tidur pasti tidak bangun sampai pagi','Tidak pernah mengantuk di siang hari'],
 a:0,
 e:'高齢者《こうれいしゃ》は眠《ねむ》りが浅《あさ》く、夜中《よなか》や朝早《あさはや》くに目《め》が覚《さ》めやすい。昼間《ひるま》に体《からだ》を動《うご》かすと、夜《よる》眠《ねむ》りやすくなる。',
 ei:'Lansia tidurnya dangkal dan mudah terbangun tengah malam atau pagi-pagi sekali. Bergerak di siang hari membantu tidur di malam hari.'},
{id:'kk17',c:'kokoro',t:'mc',
 q:'骨粗鬆症《こつそしょうしょう》の高齢者《こうれいしゃ》が転《ころ》んだとき、特《とく》に骨折《こっせつ》しやすい場所《ばしょ》はどこか。',
 qi:'Ketika lansia dengan osteoporosis jatuh, bagian mana yang terutama mudah patah?',
 o:['太《ふと》ももの付《つ》け根《ね》（大腿骨《だいたいこつ》）','耳《みみ》','指《ゆび》のつめ','鼻《はな》'],
 oi:['Pangkal paha (tulang femur)','Telinga','Kuku jari','Hidung'],
 a:0,
 e:'骨粗鬆症《こつそしょうしょう》では骨《ほね》がもろくなり、転倒《てんとう》で太《ふと》ももの付《つ》け根《ね》・背骨《せぼね》・手首《てくび》などが骨折《こっせつ》しやすい。太《ふと》ももの骨折《こっせつ》は寝《ね》たきりの原因《げんいん》になる。',
 ei:'Pada osteoporosis tulang menjadi rapuh, sehingga saat jatuh mudah patah di pangkal paha, tulang belakang, pergelangan tangan, dll. Patah pangkal paha bisa menyebabkan terbaring terus.'},
{id:'kk18',c:'kokoro',t:'mc',
 q:'呼吸《こきゅう》に関係《かんけい》する器官《きかん》として、正《ただ》しい組《く》み合《あ》わせを1つ選《えら》びなさい。',
 qi:'Pilih satu kombinasi organ pernapasan yang benar.',
 o:['鼻《はな》・気管《きかん》・肺《はい》','胃《い》・腸《ちょう》・肝臓《かんぞう》','心臓《しんぞう》・腎臓《じんぞう》・膀胱《ぼうこう》','食道《しょくどう》・胃《い》・大腸《だいちょう》'],
 oi:['Hidung, trakea, paru-paru','Lambung, usus, hati','Jantung, ginjal, kandung kemih','Kerongkongan, lambung, usus besar'],
 a:0,
 e:'空気《くうき》は鼻《はな》・口《くち》→咽頭《いんとう》→気管《きかん》→肺《はい》へ入《はい》る。胃《い》・腸《ちょう》は消化器《しょうかき》、腎臓《じんぞう》・膀胱《ぼうこう》は尿《にょう》をつくる・ためる器官《きかん》。',
 ei:'Udara masuk melalui hidung/mulut → faring → trakea → paru-paru. Lambung dan usus adalah organ pencernaan; ginjal dan kandung kemih adalah organ pembuat dan penampung urine.'},
{id:'kk19',c:'kokoro',t:'mc',
 q:'高齢者《こうれいしゃ》の体温《たいおん》について、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang paling tepat tentang suhu tubuh lansia.',
 o:['暑《あつ》さ・寒《さむ》さを感《かん》じにくく、熱中症《ねっちゅうしょう》になりやすい','暑《あつ》さ・寒《さむ》さを若《わか》い人《ひと》より強《つよ》く感《かん》じる','体温《たいおん》は若《わか》い人《ひと》よりいつも高《たか》い','熱中症《ねっちゅうしょう》にはならない'],
 oi:['Kurang merasakan panas dan dingin sehingga mudah terkena sengatan panas','Merasakan panas dan dingin lebih kuat daripada orang muda','Suhu tubuh selalu lebih tinggi daripada orang muda','Tidak bisa terkena sengatan panas'],
 a:0,
 e:'高齢者《こうれいしゃ》は暑《あつ》さ・寒《さむ》さを感《かん》じにくく、体温調節《たいおんちょうせつ》も弱《よわ》くなる。部屋《へや》の温度《おんど》や服装《ふくそう》に気《き》をつける。',
 ei:'Lansia kurang merasakan panas dan dingin, dan pengaturan suhu tubuhnya melemah. Perhatikan suhu ruangan dan pakaian.'},
{id:'kk20',c:'kokoro',t:'mc',
 q:'認知症《にんちしょう》の人《ひと》が同《おな》じことを何度《なんど》も聞《き》くときの対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu tindakan paling tepat ketika penderita demensia menanyakan hal yang sama berulang kali.',
 o:['初《はじ》めて聞《き》かれたように、ていねいに答《こた》える','「さっき言《い》いましたよ」と強《つよ》く言《い》う','聞《き》こえないふりをする','忘《わす》れないように紙《かみ》に100回《かい》書《か》かせる'],
 oi:['Menjawab dengan sopan seolah baru pertama kali ditanya','Berkata dengan keras "tadi sudah saya bilang"','Pura-pura tidak mendengar','Menyuruh menulis 100 kali di kertas agar tidak lupa'],
 a:0,
 e:'本人《ほんにん》は聞《き》いたことを忘《わす》れている。否定《ひてい》したり、しかったりすると不安《ふあん》になる。毎回《まいかい》ていねいに答《こた》える。',
 ei:'Orang itu lupa bahwa ia sudah bertanya. Menyangkal atau memarahi membuatnya cemas. Jawablah dengan sopan setiap kali.'},
{id:'kk21',c:'kokoro',t:'mc',
 q:'誤嚥性肺炎《ごえんせいはいえん》の予防《よぼう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara pencegahan pneumonia aspirasi yang paling tepat.',
 o:['口腔《こうくう》ケアで口《くち》の中《なか》を清潔《せいけつ》にする','食事《しょくじ》のあとすぐ横《よこ》になる','寝《ね》たままの姿勢《しせい》で食《た》べる','水分《すいぶん》をとらない'],
 oi:['Menjaga kebersihan mulut dengan perawatan mulut','Langsung berbaring setelah makan','Makan dalam posisi berbaring','Tidak minum'],
 a:0,
 e:'口《くち》の中《なか》の細菌《さいきん》が肺《はい》に入《はい》ると肺炎《はいえん》になる。口腔《こうくう》ケア・正《ただ》しい姿勢《しせい》での食事《しょくじ》・食後《しょくご》しばらく座《すわ》っていることが予防《よぼう》になる。',
 ei:'Jika bakteri di mulut masuk ke paru-paru, terjadi pneumonia. Perawatan mulut, makan dengan posisi yang benar, dan tetap duduk sebentar setelah makan adalah pencegahannya.'},

{id:'cm01',c:'comm',t:'mc',
 q:'利用者《りようしゃ》と話《はな》すときの姿勢《しせい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu sikap paling tepat saat berbicara dengan pengguna.',

{id:'cm02',c:'comm',t:'mc',
 q:'傾聴《けいちょう》の説明《せつめい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu penjelasan mendengarkan secara aktif (keichou) yang paling tepat.',
 o:['相手《あいて》の話《はなし》を、気持《きも》ちも含《ふく》めて心《こころ》を込《こ》めて聴《き》く','自分《じぶん》の意見《いけん》をたくさん話《はな》す','話《はなし》の途中《とちゅう》で、答《こた》えを決《き》めて伝《つた》える','相手《あいて》の話《はなし》が間違《まちが》っていたら、すぐに直《なお》す'],
 oi:['Mendengarkan dengan sepenuh hati, termasuk perasaan lawan bicara','Banyak menyampaikan pendapat sendiri','Memutuskan dan menyampaikan jawaban di tengah pembicaraan','Langsung mengoreksi jika lawan bicara salah'],
 a:0,
 e:'傾聴《けいちょう》は、話《はなし》をさえぎらず、うなずきやあいづちをしながら、相手《あいて》の気持《きも》ちに寄《よ》り添《そ》って聴《き》くこと。',
 ei:'Mendengarkan aktif adalah mendengarkan tanpa memotong, sambil mengangguk dan memberi tanggapan, dengan memahami perasaan lawan bicara.'},
{id:'cm03',c:'comm',t:'mc',
 q:'利用者《りようしゃ》が「足《あし》が痛《いた》くて、散歩《さんぽ》に行《い》けなくなった」と言《い》った。共感的《きょうかんてき》な返事《へんじ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pengguna berkata, "Kaki saya sakit, jadi tidak bisa jalan-jalan lagi." Pilih satu jawaban empatik yang paling tepat.',
 o:['「散歩《さんぽ》ができなくて、つらいですね」','「がんばって歩《ある》きましょう」','「みんな同《おな》じですよ」','「年《とし》だから、しかたないですね」'],
 oi:['"Sedih ya, tidak bisa jalan-jalan."','"Ayo berusaha berjalan."','"Semua orang juga sama."','"Karena sudah tua, tidak bisa apa-apa."'],
 a:0,
 e:'共感《きょうかん》は、相手《あいて》の気持《きも》ちを理解《りかい》し、ことばで返《かえ》すこと。励《はげ》ましや決《き》めつけは、気持《きも》ちを受《う》け止《と》めていない。',
 ei:'Empati adalah memahami perasaan lawan bicara dan mengungkapkannya kembali dengan kata-kata. Memberi semangat atau menghakimi berarti tidak menerima perasaannya.'},
{id:'cm04',c:'comm',t:'mc',
 q:'開《ひら》かれた質問《しつもん》（オープンクエスチョン）はどれか。',

 o:['「今日《きょう》はどんな一日《いちにち》でしたか」','「お茶《ちゃ》を飲《の》みますか」','「寒《さむ》いですか」','「トイレに行《い》きますか」'],
 oi:['"Bagaimana hari Anda hari ini?"','"Mau minum teh?"','"Apakah dingin?"','"Mau ke toilet?"'],
 a:0,
 e:'開《ひら》かれた質問《しつもん》は自由《じゆう》に答《こた》えられる質問《しつもん》で、気持《きも》ちや考《かんが》えを引《ひ》き出《だ》せる。「はい・いいえ」で答《こた》えるのは閉《と》じた質問《しつもん》。',
 ei:'Pertanyaan terbuka bisa dijawab dengan bebas dan bisa menggali perasaan serta pikiran. Pertanyaan yang dijawab "ya/tidak" adalah pertanyaan tertutup.'},
{id:'cm05',c:'comm',t:'mc',
 q:'耳《みみ》が聞《き》こえにくい高齢者《こうれいしゃ》と話《はな》すときの方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara paling tepat saat berbicara dengan lansia yang sulit mendengar.',
 o:['正面《しょうめん》から、ゆっくり、はっきり話《はな》す','後《うし》ろから大声《おおごえ》で話《はな》す','高《たか》い声《こえ》で早口《はやくち》で話《はな》す','口《くち》をあまり動《うご》かさずに話《はな》す'],
 oi:['Berbicara dari depan dengan pelan dan jelas','Berbicara keras dari belakang','Berbicara cepat dengan suara tinggi','Berbicara tanpa banyak menggerakkan mulut'],
 a:0,
 e:'正面《しょうめん》から口《くち》の動《うご》きや表情《ひょうじょう》を見《み》せ、低《ひく》めの声《こえ》で、ゆっくりはっきり話《はな》す。大声《おおごえ》を出《だ》しすぎると、かえって聞《き》き取《と》りにくい。',
 ei:'Tunjukkan gerakan mulut dan ekspresi dari depan, berbicara dengan suara agak rendah, pelan, dan jelas. Suara terlalu keras justru sulit ditangkap.'},
{id:'cm06',c:'comm',t:'mc',
 q:'目《め》が見《み》えにくい利用者《りようしゃ》への対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu tindakan paling tepat bagi pengguna yang sulit melihat.',
 o:['声《こえ》をかけてから体《からだ》にふれる','何《なに》も言《い》わずに手《て》を引《ひ》く','「あれ」「これ」で場所《ばしょ》を伝《つた》える','物《もの》の置《お》き場所《ばしょ》を毎日《まいにち》変《か》える'],
 oi:['Menyapa dulu sebelum menyentuh tubuhnya','Menarik tangannya tanpa berkata apa-apa','Menyebut tempat dengan "itu" dan "ini"','Mengubah tempat barang setiap hari'],
 a:0,
 e:'急《きゅう》にさわると驚《おどろ》く。まず名前《なまえ》を呼《よ》んで声《こえ》をかける。場所《ばしょ》は「右手《みぎて》の前《まえ》にお茶《ちゃ》があります」など具体的《ぐたいてき》に伝《つた》える。物《もの》の場所《ばしょ》は変《か》えない。',
 ei:'Jika disentuh tiba-tiba, akan kaget. Panggil namanya dulu. Sampaikan tempat dengan konkret, misalnya "teh ada di depan tangan kanan Anda". Jangan mengubah tempat barang.'},
{id:'cm07',c:'comm',t:'mc',
 q:'失語症《しつごしょう》で、ことばがうまく出《で》ない利用者《りようしゃ》への質問《しつもん》の方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara bertanya paling tepat kepada pengguna dengan afasia yang sulit mengeluarkan kata-kata.',
 o:['「はい」「いいえ」で答《こた》えられる質問《しつもん》をする','長《なが》い文《ぶん》で一度《いちど》にたくさん聞《き》く','答《こた》えが出《で》るまで、急《いそ》がせる','わからないときは、聞《き》くのをやめる'],
 oi:['Bertanya dengan pertanyaan yang bisa dijawab "ya" atau "tidak"','Bertanya banyak sekaligus dengan kalimat panjang','Mendesak sampai keluar jawabannya','Berhenti bertanya jika tidak mengerti'],
 a:0,
 e:'失語症《しつごしょう》の人《ひと》には、短《みじか》い文《ぶん》で、「はい・いいえ」で答《こた》えられる閉《と》じた質問《しつもん》や、絵《え》・文字《もじ》・ジェスチャーを使《つか》う。',

 q:'目《め》が見《み》えない人《ひと》の歩行《ほこう》を誘導《ゆうどう》するときの方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 oi:['Perawat berdiri setengah langkah di depan dan pengguna memegang sedikit di atas siku perawat','Mendorong punggung dari belakang','Menarik tangan pengguna dengan kuat','Menyuruh pengguna berjalan sendiri di depan'],
 a:0,
 e:'介護者《かいごしゃ》が半歩前《はんぽまえ》に立《た》ち、ひじの少《すこ》し上《うえ》を持《も》ってもらって歩《ある》く。段差《だんさ》や曲《ま》がり角《かど》は、ことばで前《まえ》もって伝《つた》える。',
 ei:'Perawat berdiri setengah langkah di depan dan pengguna memegang sedikit di atas siku. Beri tahu lebih dulu dengan kata-kata jika ada undakan atau belokan.'},

{id:'sk10',c:'seikatsu',t:'mc',
 q:'いすに座《すわ》って食事《しょくじ》をするときの姿勢《しせい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 o:['深《ふか》く座《すわ》り、足《あし》の裏《うら》を床《ゆか》につけ、少《すこ》し前《まえ》かがみになる','浅《あさ》く座《すわ》り、背中《せなか》を後《うし》ろに倒《たお》す','あごを上《あ》げて、上《うえ》を向《む》く','足《あし》をぶらぶらさせる'],

 a:0,

{id:'sk11',c:'seikatsu',t:'mc',
 q:'片麻痺《かたまひ》の人《ひと》の食事介助《しょくじかいじょ》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu bantuan makan yang paling tepat bagi orang dengan hemiplegia.',

 oi:['Memasukkan makanan dari sudut mulut sisi sehat','Memasukkan makanan dari sudut mulut sisi lumpuh','Memasukkan banyak sekaligus ke mulut','Memasukkan suapan berikutnya sebelum menelan'],
 a:0,
 e:'健側《けんそく》から入《い》れると、かんだり飲《の》み込《こ》んだりしやすい。患側《かんそく》の口《くち》の中《なか》に食《た》べ物《もの》が残《のこ》りやすいので、食後《しょくご》に確認《かくにん》する。',

{id:'sk12',c:'seikatsu',t:'mc',
 q:'飲《の》み込《こ》む力《ちから》が弱《よわ》い人《ひと》が、最《もっと》もむせやすいものはどれか。',
 qi:'Bagi orang yang kemampuan menelannya lemah, apa yang paling mudah membuat tersedak?',

 oi:['Cairan encer seperti air dan teh','Jeli','Sup yang dikentalkan','Bubur nasi'],
 a:0,
 e:'さらさらした液体《えきたい》は、のどを速《はや》く流《なが》れるので誤嚥《ごえん》しやすい。とろみをつけると、ゆっくり流《なが》れて飲《の》み込《こ》みやすい。',
 ei:'Cairan encer mengalir cepat di tenggorokan sehingga mudah terjadi aspirasi. Jika dikentalkan, mengalir lebih lambat dan lebih mudah ditelan.'},
{id:'sk13',c:'seikatsu',t:'mc',
 q:'食事介助《しょくじかいじょ》の進《すす》め方《かた》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 oi:['Memastikan sudah menelan sebelum memberi suapan berikutnya','Terus memasukkan agar cepat selesai','Menyuapi dari atas sambil berdiri','Menyuapi diam tanpa berbicara'],
 a:0,
 e:'のどぼとけが動《うご》いたか見《み》て、飲《の》み込《こ》みを確認《かくにん》してから次《つぎ》へ。介護者《かいごしゃ》は座《すわ》って目線《めせん》を合《あ》わせる。立《た》って上《うえ》から入《い》れると、あごが上《あ》がって誤嚥《ごえん》しやすい。',
 ei:'Lihat apakah jakun bergerak untuk memastikan sudah menelan, lalu lanjutkan. Perawat duduk dan menyamakan tinggi mata. Jika menyuapi dari atas sambil berdiri, dagu terangkat dan mudah terjadi aspirasi.'},
{id:'sk14',c:'seikatsu',t:'mc',
 q:'ベッドの上《うえ》で食事《しょくじ》をするときの姿勢《しせい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu posisi paling tepat saat makan di atas tempat tidur.',

 oi:['Menegakkan tubuh bagian atas dan sedikit menarik dagu','Makan sambil berbaring telentang','Makan sambil tengkurap','Menengadahkan kepala ke belakang'],
 a:0,
 e:'ベッドの背《せ》を上《あ》げて上半身《じょうはんしん》を起《お》こし、あごを少《すこ》し引《ひ》くと誤嚥《ごえん》を防《ふせ》げる。食後《しょくご》もしばらくは上半身《じょうはんしん》を起《お》こしておく。',
 ei:'Naikkan sandaran tempat tidur untuk menegakkan tubuh bagian atas dan sedikit tarik dagu agar mencegah aspirasi. Setelah makan pun tetap tegak sebentar.'},

{id:'sk15',c:'seikatsu',t:'mc',

 qi:'Pilih satu suhu air mandi berendam yang paling tepat.',
 o:['40℃前後《ぜんご》','30℃前後《ぜんご》','45℃以上《いじょう》','50℃以上《いじょう》'],

 a:0,
 e:'お湯《ゆ》は40℃前後《ぜんご》（38〜41℃くらい）が目安《めやす》。熱《あつ》すぎると血圧《けつあつ》が急《きゅう》に変《か》わり危険《きけん》。必《かなら》ず湯温《ゆおん》を確認《かくにん》する。',
 ei:'Patokan suhu air sekitar 40°C (sekitar 38–41°C). Jika terlalu panas, tekanan darah berubah tiba-tiba dan berbahaya. Selalu periksa suhu air.'},
{id:'sk16',c:'seikatsu',t:'mc',
 q:'入浴介助《にゅうよくかいじょ》で、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang paling tepat dalam bantuan mandi.',

 oi:['Memeriksa kondisi tubuh sebelum mandi dan memberi minum setelah mandi','Mandi tepat setelah makan','Berendam dalam waktu lama','Membiarkan ruang ganti tetap dingin'],
 a:0,
 e:'入浴《にゅうよく》前《まえ》に体調《たいちょう》（顔色《かおいろ》・体温《たいおん》など）を確認《かくにん》する。食後《しょくご》すぐや空腹時《くうふくじ》は避《さ》ける。入浴《にゅうよく》は汗《あせ》で水分《すいぶん》が失《うしな》われるので、後《あと》で水分補給《すいぶんほきゅう》をする。',

{id:'sk17',c:'seikatsu',t:'mc',
 q:'ヒートショックを防《ふせ》ぐ方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara mencegah heat shock yang paling tepat.',
 o:['脱衣室《だついしつ》や浴室《よくしつ》を前《まえ》もって温《あたた》めておく','お湯《ゆ》を熱《あつ》くする','冬《ふゆ》は窓《まど》を開《あ》けて入浴《にゅうよく》する','入浴《にゅうよく》の前《まえ》にお酒《さけ》を飲《の》む'],
 oi:['Menghangatkan ruang ganti dan kamar mandi lebih dulu','Membuat air lebih panas','Mandi dengan jendela terbuka di musim dingin','Minum alkohol sebelum mandi'],
 a:0,
 e:'ヒートショックは急《きゅう》な温度差《おんどさ》で血圧《けつあつ》が大《おお》きく変《か》わること。脱衣室《だついしつ》・浴室《よくしつ》を温《あたた》め、温度差《おんどさ》を小《ちい》さくする。',
 ei:'Heat shock adalah perubahan besar tekanan darah akibat perbedaan suhu yang tiba-tiba. Hangatkan ruang ganti dan kamar mandi untuk memperkecil perbedaan suhu.'},
{id:'sk18',c:'seikatsu',t:'mc',
 q:'片麻痺《かたまひ》の人《ひと》が浴槽《よくそう》に入《はい》るときの方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 o:['健側《けんそく》の足《あし》から入《はい》る','患側《かんそく》の足《あし》から入《はい》る','頭《あたま》から入《はい》る','立《た》ったまま両足《りょうあし》で飛《と》び込《こ》む'],

 e:'健側《けんそく》は温度《おんど》を感《かん》じられるので、健側《けんそく》の足《あし》でお湯《ゆ》の温度《おんど》を確《たし》かめながら入《はい》る。浴槽《よくそう》のふちに座《すわ》ってから入《はい》ると安全《あんぜん》。',
 ei:'Sisi sehat bisa merasakan suhu, jadi masuk sambil memeriksa suhu air dengan kaki sisi sehat. Lebih aman jika duduk di tepi bak mandi dulu sebelum masuk.'},
{id:'sk19',c:'seikatsu',t:'mc',

 qi:'Pilih satu cara menyeka tubuh (seishiki) yang paling tepat.',
 o:['手足《てあし》は、指先《ゆびさき》から体《からだ》の中心《ちゅうしん》に向《む》かってふく','冷《つめ》たい水《みず》でふく','部屋《へや》の窓《まど》を開《あ》けたままふく','全身《ぜんしん》を一度《いちど》に出《だ》してふく'],
 oi:['Tangan dan kaki diseka dari ujung jari ke arah tengah tubuh','Menyeka dengan air dingin','Menyeka dengan jendela kamar terbuka','Membuka seluruh tubuh sekaligus lalu menyeka'],
 a:0,
 e:'手足《てあし》は末梢《まっしょう》（指先《ゆびさき》）から中枢《ちゅうすう》（体《からだ》の中心《ちゅうしん》）へふくと、血液《けつえき》の流《なが》れがよくなる。部屋《へや》を温《あたた》め、ふく所《ところ》だけ出《だ》し、ほかはタオルでおおう。',
 ei:'Menyeka tangan dan kaki dari ujung (jari) ke pusat (tengah tubuh) melancarkan aliran darah. Hangatkan ruangan, buka hanya bagian yang diseka, dan tutup bagian lain dengan handuk.'},
{id:'sk20',c:'seikatsu',t:'mc',
 q:'爪《つめ》を切《き》るのに最《もっと》も適《てき》したタイミングはどれか。',

 oi:['Setelah mandi, saat kuku lunak','Di kamar gelap tepat sebelum tidur','Saat makan','Saat kuku kering dan keras'],

{id:'sk21',c:'seikatsu',t:'mc',
 q:'女性《じょせい》の陰部《いんぶ》をふくときの方向《ほうこう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',

 oi:['Dari depan ke belakang','Dari belakang ke depan','Dari arah mana saja boleh','Dengan gerakan melingkar'],
 a:0,
 e:'後《うし》ろ（肛門《こうもん》）から前《まえ》へふくと、大腸菌《だいちょうきん》が尿道《にょうどう》に入《はい》り、尿路感染症《にょうろかんせんしょう》の原因《げんいん》になる。前《まえ》から後《うし》ろへふく。',
 ei:'Jika menyeka dari belakang (anus) ke depan, bakteri usus bisa masuk ke saluran kemih dan menyebabkan infeksi saluran kemih. Seka dari depan ke belakang.'},

{id:'sk22',c:'seikatsu',t:'mc',

 qi:'Di mana posisi toilet portabel yang paling tepat di samping tempat tidur orang dengan hemiplegia?',

 ei:'Jika diletakkan di sisi sehat, pengguna lebih mudah pindah sendiri dengan tangan dan kaki sisi sehat. Sama seperti kursi roda.'},
{id:'sk23',c:'seikatsu',t:'mc',
 q:'排泄介助《はいせつかいじょ》で最《もっと》も大切《たいせつ》にすることとして、適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu hal paling penting dalam bantuan buang air.',

 e:'排泄《はいせつ》は恥《は》ずかしさを感《かん》じやすい。プライバシーを守《まも》り、できることは本人《ほんにん》にしてもらう。安易《あんい》におむつを使《つか》うと、自立《じりつ》をさまたげる。',
 ei:'Buang air mudah menimbulkan rasa malu. Jaga privasinya dan biarkan ia melakukan hal yang bisa dilakukan sendiri. Memakai popok dengan mudah menghambat kemandirian.'},
{id:'sk24',c:'seikatsu',t:'mc',
 q:'便秘《べんぴ》のときのおなかのマッサージの方向《ほうこう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu arah pijatan perut yang paling tepat saat sembelit.',
 o:['「の」の字《じ》をかくように、時計回《とけいまわ》りに','時計《とけい》と反対回《はんたいまわ》りに','上《うえ》から下《した》へ強《つよ》くたたく','左右《さゆう》に強《つよ》く押《お》す'],
 oi:['Searah jarum jam seperti menulis huruf "の"','Berlawanan arah jarum jam','Memukul kuat dari atas ke bawah','Menekan kuat ke kiri dan kanan'],
 a:0,
 e:'大腸《だいちょう》は右下《みぎした》→上《うえ》→左《ひだり》→左下《ひだりした》と通《とお》るので、おへその周《まわ》りを「の」の字《じ》（時計回《とけいまわ》り）にやさしくマッサージする。',
 ei:'Usus besar berjalan dari kanan bawah → atas → kiri → kiri bawah, jadi pijat lembut di sekitar pusar seperti huruf "の" (searah jarum jam).'},
// ===== 生活支援技術：着替え・口腔ケア・睡眠ほか =====
{id:'sk25',c:'seikatsu',t:'mc',
 q:'右片麻痺《みぎかたまひ》の人《ひと》が上着《うわぎ》を着《き》るとき、最初《さいしょ》にそでを通《とお》すのはどちらか。',
 qi:'Saat orang dengan hemiplegia kanan memakai baju atas, lengan mana yang dimasukkan lebih dulu?',
 o:['右腕《みぎうで》（麻痺《まひ》がある側《がわ》）','左腕《ひだりうで》（麻痺《まひ》がない側《がわ》）','どちらでもよい','頭《あたま》から先《さき》にかぶるだけ'],
 oi:['Lengan kanan (sisi lumpuh)','Lengan kiri (sisi sehat)','Mana saja boleh','Hanya memasukkan kepala lebih dulu'],
 a:0,
 e:'脱健着患《だっけんちゃっかん》：着《き》るときは患側《かんそく》（麻痺側《まひそく》）から、脱《ぬ》ぐときは健側《けんそく》から。右片麻痺《みぎかたまひ》なら、着《き》るときは右腕《みぎうで》から。',
 ei:'Prinsip "lepas dari sisi sehat, pakai dari sisi lumpuh": saat memakai mulai dari sisi lumpuh, saat melepas mulai dari sisi sehat. Untuk hemiplegia kanan, saat memakai mulai dari lengan kanan.'},
{id:'sk26',c:'seikatsu',t:'mc',
 q:'左片麻痺《ひだりかたまひ》の人《ひと》が上着《うわぎ》を脱《ぬ》ぐとき、最初《さいしょ》に脱《ぬ》ぐのはどちらか。',
 qi:'Saat orang dengan hemiplegia kiri melepas baju atas, lengan mana yang dilepas lebih dulu?',
 o:['右腕《みぎうで》（麻痺《まひ》がない側《がわ》）','左腕《ひだりうで》（麻痺《まひ》がある側《がわ》）','どちらでもよい','両腕《りょううで》を同時《どうじ》に'],
 oi:['Lengan kanan (sisi sehat)','Lengan kiri (sisi lumpuh)','Mana saja boleh','Kedua lengan bersamaan'],
 a:0,
 e:'脱《ぬ》ぐときは健側《けんそく》から。左片麻痺《ひだりかたまひ》なら健側《けんそく》は右《みぎ》なので、右腕《みぎうで》から脱《ぬ》ぐ。健側《けんそく》を先《さき》に抜《ぬ》くと、患側《かんそく》に無理《むり》な力《ちから》がかからない。',
 ei:'Saat melepas mulai dari sisi sehat. Untuk hemiplegia kiri, sisi sehat adalah kanan, jadi lepas dari lengan kanan. Dengan melepas sisi sehat dulu, sisi lumpuh tidak terbebani.'},
{id:'sk27',c:'seikatsu',t:'mc',
 q:'高齢者《こうれいしゃ》の服《ふく》を選《えら》ぶときのポイントとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu hal paling tepat saat memilih pakaian untuk lansia.',
 o:['伸《の》び縮《ちぢ》みし、ゆったりして着《き》やすい服《ふく》','体《からだ》にぴったりした固《かた》い服《ふく》','小《ちい》さいボタンがたくさんある服《ふく》','季節《きせつ》に関係《かんけい》なく厚《あつ》い服《ふく》'],
 oi:['Pakaian yang elastis, longgar, dan mudah dipakai','Pakaian ketat dan kaku','Pakaian dengan banyak kancing kecil','Pakaian tebal tanpa memandang musim'],
 a:0,
 e:'伸縮性《しんしゅくせい》があり、ゆったりした服《ふく》は着脱《ちゃくだつ》しやすい。本人《ほんにん》の好《この》みや季節《きせつ》も大切《たいせつ》にし、できれば本人《ほんにん》に選《えら》んでもらう。',
 ei:'Pakaian yang elastis dan longgar mudah dipakai dan dilepas. Perhatikan juga kesukaan dan musim, dan sebisa mungkin biarkan pengguna memilih sendiri.'},
{id:'sk28',c:'seikatsu',t:'mc',
 q:'入《い》れ歯《ば》（義歯《ぎし》）の手入《てい》れの方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu cara merawat gigi palsu yang paling tepat.',
 o:['外《はず》して、流水《りゅうすい》でブラシを使《つか》って洗《あら》う','熱湯《ねっとう》につけて消毒《しょうどく》する','歯《は》みがき粉《こ》で強《つよ》くこする','つけたまま洗《あら》わない'],
 oi:['Dilepas lalu dicuci dengan sikat di bawah air mengalir','Direndam air mendidih untuk disinfeksi','Digosok kuat dengan pasta gigi','Tidak dicuci dan tetap dipakai'],
 a:0,
 e:'義歯《ぎし》は外《はず》して、流水《りゅうすい》で義歯用《ぎしよう》ブラシを使《つか》って洗《あら》う。熱湯《ねっとう》は変形《へんけい》の原因《げんいん》。夜《よる》は外《はず》して、水《みず》か洗浄剤《せんじょうざい》に入《い》れて保管《ほかん》する。',
 ei:'Gigi palsu dilepas dan dicuci dengan sikat khusus di bawah air mengalir. Air mendidih menyebabkan perubahan bentuk. Pada malam hari dilepas dan disimpan dalam air atau cairan pembersih.'},
{id:'sk29',c:'seikatsu',t:'mc',
 q:'口腔《こうくう》ケアの目的《もくてき》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu tujuan perawatan mulut yang paling tepat.',
 o:['誤嚥性肺炎《ごえんせいはいえん》を予防《よぼう》する','体重《たいじゅう》を減《へ》らす','視力《しりょく》をよくする','血圧《けつあつ》を上《あ》げる'],
 oi:['Mencegah pneumonia aspirasi','Menurunkan berat badan','Memperbaiki penglihatan','Menaikkan tekanan darah'],
 a:0,
 e:'口腔《こうくう》ケアは、口《くち》の中《なか》の細菌《さいきん》を減《へ》らして誤嚥性肺炎《ごえんせいはいえん》を防《ふせ》ぐ。むし歯《ば》・口臭《こうしゅう》の予防《よぼう》や、食欲《しょくよく》が出《で》る効果《こうか》もある。',
 ei:'Perawatan mulut mengurangi bakteri di mulut untuk mencegah pneumonia aspirasi. Juga mencegah gigi berlubang dan bau mulut, serta meningkatkan nafsu makan.'},
{id:'sk30',c:'seikatsu',t:'mc',
 q:'夜《よる》よく眠《ねむ》れるようにするための支援《しえん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu dukungan paling tepat agar bisa tidur nyenyak di malam hari.',
 o:['昼間《ひるま》に体《からだ》を動《うご》かしたり、活動《かつどう》したりする','寝《ね》る前《まえ》にコーヒーを飲《の》む','昼間《ひるま》もずっとベッドで寝《ね》ている','夜《よる》、部屋《へや》を明《あか》るくする'],
 oi:['Bergerak dan beraktivitas di siang hari','Minum kopi sebelum tidur','Terus berbaring di tempat tidur pada siang hari','Membuat kamar terang di malam hari'],
 a:0,
 e:'昼間《ひるま》に活動《かつどう》すると夜《よる》眠《ねむ》りやすい。寝《ね》る前《まえ》のカフェイン（コーヒー・お茶《ちゃ》）は避《さ》ける。夜《よる》は部屋《へや》を暗《くら》く静《しず》かにする。',
 ei:'Beraktivitas di siang hari membantu tidur malam. Hindari kafein (kopi, teh) sebelum tidur. Pada malam hari buat kamar gelap dan tenang.'},
{id:'sk31',c:'seikatsu',t:'mc',
 q:'片麻痺《かたまひ》の人《ひと》を横向《よこむ》き（側臥位《そくがい》）にするときの注意《ちゅうい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu hal paling tepat yang perlu diperhatikan saat memiringkan orang dengan hemiplegia (posisi miring).',
 o:['麻痺側《まひそく》を下《した》にしない','麻痺側《まひそく》を下《した》にして長時間《ちょうじかん》寝《ね》かせる','声《こえ》をかけずに急《きゅう》に向《む》きを変《か》える','腕《うで》を体《からだ》の下《した》にはさむ'],
 oi:['Tidak menempatkan sisi lumpuh di bawah','Membiarkan berbaring lama dengan sisi lumpuh di bawah','Mengubah posisi tiba-tiba tanpa menyapa','Menjepit lengan di bawah tubuh'],
 a:0,
 e:'麻痺側《まひそく》は痛《いた》みを感《かん》じにくく、下《した》にすると圧迫《あっぱく》されて傷《きず》や褥瘡《じょくそう》になりやすい。体位変換《たいいへんかん》の前《まえ》には必《かなら》ず声《こえ》をかける。',
 ei:'Sisi lumpuh kurang merasakan sakit; jika di bawah, akan tertekan dan mudah terluka atau terkena luka tekan. Selalu sapa sebelum mengubah posisi.'},
{id:'sk32',c:'seikatsu',t:'mc',
 q:'車《くるま》いすに座《すわ》るときの姿勢《しせい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu posisi duduk di kursi roda yang paling tepat.',
 o:['深《ふか》く腰《こし》かけ、足《あし》をフットサポートにのせる','浅《あさ》く腰《こし》かけて、背中《せなか》を丸《まる》める','足《あし》を床《ゆか》に引《ひ》きずる','横《よこ》に大《おお》きく傾《かたむ》いて座《すわ》る'],
 oi:['Duduk dalam dan meletakkan kaki di sandaran kaki','Duduk dangkal dan membungkukkan punggung','Menyeret kaki di lantai','Duduk dengan sangat miring ke samping'],
 a:0,
 e:'深《ふか》く腰《こし》かけ、足《あし》をフットサポートにのせて移動《いどう》する。浅《あさ》く座《すわ》ると、ずり落《お》ちたり、おしりに褥瘡《じょくそう》ができたりする。',
 ei:'Duduk dalam dan letakkan kaki di sandaran kaki saat bergerak. Jika duduk dangkal, bisa merosot atau terkena luka tekan di bokong.'},
{id:'sk33',c:'seikatsu',t:'mc',
 q:'洗髪《せんぱつ》でシャワーのお湯《ゆ》をかけるとき、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih satu yang paling tepat saat menyiram air shower ketika mencuci rambut.',
 o:['介護者《かいごしゃ》が先《さき》に温度《おんど》を確《たし》かめてから、声《こえ》をかけてかける','何《なに》も言《い》わずに頭《あたま》からかける','熱《あつ》いお湯《ゆ》を一気《いっき》にかける','冷《つめ》たい水《みず》から始《はじ》める'],
 oi:['Perawat memeriksa suhu lebih dulu, lalu menyiram sambil memberi tahu','Menyiram dari kepala tanpa berkata apa-apa','Menyiram air panas sekaligus','Mulai dengan air dingin'],
 a:0,
 e:'まず介護者《かいごしゃ》の手《て》で温度《おんど》を確認《かくにん》し、本人《ほんにん》にも確認《かくにん》してもらう。「お湯《ゆ》をかけますね」と声《こえ》をかけ、耳《みみ》にお湯《ゆ》が入《はい》らないようにする。',
 ei:'Pertama periksa suhu dengan tangan perawat, lalu minta pengguna juga memeriksanya. Beri tahu "saya siram airnya ya" dan jaga agar air tidak masuk ke telinga.'},

{id:'jg01',c:'jitsugi',t:'mc',
 q:'Aさんは右片麻痺《みぎかたまひ》がある。ベッドに座《すわ》っているAさんが車《くるま》いすに移《うつ》る。車《くるま》いすをどこに置《お》くのが最《もっと》も適切《てきせつ》か。',
 qi:'Tuan A mengalami hemiplegia kanan. Tuan A yang duduk di tempat tidur akan pindah ke kursi roda. Di mana kursi roda paling tepat diletakkan?',
 o:['Aさんの左側《ひだりがわ》に、斜《なな》めに置《お》く','Aさんの右側《みぎがわ》に、斜《なな》めに置《お》く','Aさんの正面《しょうめん》の遠《とお》い所《ところ》に置《お》く','Aさんの後《うし》ろに置《お》く'],
 oi:['Di sisi kiri Tuan A, miring','Di sisi kanan Tuan A, miring','Jauh di depan Tuan A','Di belakang Tuan A'],
 a:0,
 e:'右片麻痺《みぎかたまひ》なので、健側《けんそく》は左《ひだり》。車《くるま》いすは健側《けんそく》（左側《ひだりがわ》）に斜《なな》めに置《お》き、ブレーキをかける。',
 ei:'Karena hemiplegia kanan, sisi sehat adalah kiri. Letakkan kursi roda miring di sisi sehat (kiri) dan pasang remnya.'},
{id:'jg02',c:'jitsugi',t:'mc',
 q:'Bさん（右片麻痺《みぎかたまひ》）が杖《つえ》をついて廊下《ろうか》を歩《ある》く。介護者《かいごしゃ》が立《た》つ位置《いち》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Nyonya B (hemiplegia kanan) berjalan di lorong dengan tongkat. Pilih satu posisi berdiri perawat yang paling tepat.',
 o:['Bさんの右斜《みぎなな》め後《うし》ろ','Bさんの左斜《ひだりなな》め前《まえ》','Bさんの真正面《ましょうめん》','Bさんから3m離《はな》れた後《うし》ろ'],
 oi:['Serong kanan belakang Nyonya B','Serong kiri depan Nyonya B','Tepat di depan Nyonya B','3 m di belakang Nyonya B'],
 a:0,
 e:'転《ころ》びやすいのは麻痺側《まひそく》（右《みぎ》）。介護者《かいごしゃ》は患側《かんそく》の斜《なな》め後《うし》ろに立《た》ち、すぐ支《ささ》えられるようにする。',
 ei:'Sisi yang mudah jatuh adalah sisi lumpuh (kanan). Perawat berdiri serong belakang di sisi lumpuh agar bisa segera menopang.'},
{id:'jg03',c:'jitsugi',t:'mc',
 q:'食事中《しょくじちゅう》、Cさんが急《きゅう》に激《はげ》しくむせはじめた。最初《さいしょ》の対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Saat makan, Tuan C tiba-tiba tersedak hebat. Pilih satu tindakan pertama yang paling tepat.',
 o:['食事《しょくじ》を止《と》め、前《まえ》かがみにして咳《せき》をしてもらう','すぐに水《みず》をたくさん飲《の》ませる','あお向《む》けに寝《ね》かせる','そのまま食事《しょくじ》を続《つづ》ける'],
 oi:['Menghentikan makan, membungkukkan tubuhnya ke depan, dan memintanya batuk','Segera memberi banyak air minum','Membaringkannya telentang','Melanjutkan makan seperti biasa'],
 a:0,
 e:'むせたら食事《しょくじ》を中止《ちゅうし》し、前《まえ》かがみの姿勢《しせい》で咳《せき》を出《だ》してもらう（咳《せき》は異物《いぶつ》を出《だ》す力《ちから》）。水《みず》を飲《の》ませるとさらに誤嚥《ごえん》する危険《きけん》がある。息《いき》ができない様子《ようす》なら、すぐに応援《おうえん》を呼《よ》ぶ。',
 ei:'Jika tersedak, hentikan makan dan minta batuk dalam posisi membungkuk ke depan (batuk adalah kekuatan untuk mengeluarkan benda asing). Memberi air berisiko menyebabkan aspirasi lagi. Jika tampak tidak bisa bernapas, segera panggil bantuan.'},
{id:'jg04',c:'jitsugi',t:'mc',
 q:'入浴中《にゅうよくちゅう》、Dさんの顔色《かおいろ》が悪《わる》くなり、「気分《きぶん》が悪《わる》い」と言《い》った。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Saat mandi, wajah Nyonya D menjadi pucat dan ia berkata "saya merasa tidak enak badan". Pilih satu tindakan yang paling tepat.',
 o:['浴槽《よくそう》から出《で》てもらい、横《よこ》にして、看護職《かんごしょく》に連絡《れんらく》する','もう少《すこ》しお湯《ゆ》につかってもらう','お湯《ゆ》を熱《あつ》くする','一人《ひとり》にして、ほかの仕事《しごと》に行《い》く'],
 oi:['Mengeluarkannya dari bak mandi, membaringkannya, dan menghubungi perawat (kangoshoku)','Memintanya berendam sedikit lebih lama','Membuat air lebih panas','Meninggalkannya sendirian dan pergi ke pekerjaan lain'],
 a:0,
 e:'お湯《ゆ》から出《で》てもらい、安全《あんぜん》な場所《ばしょ》で横《よこ》にし、体《からだ》を冷《ひ》やさないようにタオルをかける。すぐに看護職《かんごしょく》に連絡《れんらく》し、そばを離《はな》れない。',
 ei:'Keluarkan dari air, baringkan di tempat yang aman, dan tutup dengan handuk agar tidak kedinginan. Segera hubungi perawat (kangoshoku) dan jangan meninggalkannya.'},
{id:'jg05',c:'jitsugi',t:'mc',
 q:'部屋《へや》に入《はい》ると、Eさんが床《ゆか》に倒《たお》れていた。最初《さいしょ》の対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Saat masuk kamar, Tuan E tergeletak di lantai. Pilih satu tindakan pertama yang paling tepat.',
 o:['声《こえ》をかけて意識《いしき》を確認《かくにん》し、むやみに動《うご》かさずに応援《おうえん》を呼《よ》ぶ','すぐに一人《ひとり》で抱《かか》えてベッドに戻《もど》す','起《お》き上《あ》がるまで待《ま》つ','あとで記録《きろく》だけ書《か》く'],
 oi:['Menyapa dan memeriksa kesadarannya, tidak sembarangan memindahkan, lalu memanggil bantuan','Segera mengangkatnya sendirian ke tempat tidur','Menunggu sampai ia bangun','Nanti hanya menulis catatan'],
 a:0,
 e:'骨折《こっせつ》や頭《あたま》のけががあるかもしれない。まず意識《いしき》を確認《かくにん》し、無理《むり》に動《うご》かさず、看護職《かんごしょく》・上司《じょうし》を呼《よ》ぶ。',
 ei:'Mungkin ada patah tulang atau cedera kepala. Pertama periksa kesadaran, jangan memindahkan secara paksa, dan panggil perawat (kangoshoku) atau atasan.'},
{id:'jg06',c:'jitsugi',t:'mc',
 q:'夜中《よなか》、認知症《にんちしょう》のFさんが「家《いえ》に帰《かえ》ります」と言《い》って廊下《ろうか》を歩《ある》いている。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Tengah malam, Nyonya F yang mengalami demensia berjalan di lorong sambil berkata "saya mau pulang". Pilih satu tindakan yang paling tepat.',
 o:['否定《ひてい》せずに話《はなし》を聴《き》き、いっしょに歩《ある》いて気持《きも》ちが落《お》ち着《つ》くのを待《ま》つ','「ここがあなたの家《いえ》です」と強《つよ》く言《い》う','部屋《へや》にかぎをかける','聞《き》こえないふりをする'],
 oi:['Mendengarkan tanpa menyangkal, berjalan bersama, dan menunggu perasaannya tenang','Berkata dengan keras "di sinilah rumah Anda"','Mengunci kamar','Pura-pura tidak mendengar'],
 a:0,
 e:'「帰《かえ》りたい」には理由《りゆう》や不安《ふあん》がある。否定《ひてい》せず気持《きも》ちを受《う》け止《と》め、付《つ》き添《そ》う。かぎをかけて閉《と》じ込《こ》めるのは身体拘束《しんたいこうそく》にあたる。',
 ei:'"Ingin pulang" memiliki alasan atau kecemasan. Terima perasaannya tanpa menyangkal dan dampingi. Mengunci di dalam kamar termasuk pengekangan fisik.'},
{id:'jg07',c:'jitsugi',t:'mc',
 q:'認知症《にんちしょう》のGさんが「財布《さいふ》を盗《と》られた」と言《い》っている。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Tuan G yang mengalami demensia berkata "dompet saya dicuri". Pilih satu tindakan yang paling tepat.',
 o:['「それは大変《たいへん》ですね。いっしょに探《さが》しましょう」と言《い》う','「だれも盗《と》っていません」と否定《ひてい》する','「また忘《わす》れたんですか」と言《い》う','ほかの利用者《りようしゃ》を疑《うたが》う'],
 oi:['Berkata "Wah, gawat ya. Mari kita cari bersama"','Menyangkal "tidak ada yang mencuri"','Berkata "lupa lagi ya?"','Mencurigai pengguna lain'],
 a:0,
 e:'物盗《ものと》られ妄想《もうそう》はBPSDの一《ひと》つ。否定《ひてい》すると不安《ふあん》や怒《いか》りが強《つよ》くなる。気持《きも》ちを受《う》け止《と》めて、いっしょに探《さが》す。見《み》つかったら、本人《ほんにん》が見《み》つけられるようにすると良《よ》い。',
 ei:'Delusi barang dicuri adalah salah satu BPSD. Menyangkal membuat kecemasan dan kemarahan semakin kuat. Terima perasaannya dan cari bersama. Jika ditemukan, sebaiknya biarkan ia sendiri yang menemukannya.'},
{id:'jg08',c:'jitsugi',t:'mc',
 q:'Hさんがベッドの上《うえ》で嘔吐《おうと》した。最初《さいしょ》にする対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Nyonya H muntah di atas tempat tidur. Pilih satu tindakan pertama yang paling tepat.',
 o:['顔《かお》を横《よこ》に向《む》けて、吐《は》いた物《もの》がのどにつまらないようにする','あお向《む》けのまま、上《うえ》を向《む》かせる','すぐに食事《しょくじ》をすすめる','部屋《へや》を出《で》て、片付《かたづ》けの道具《どうぐ》を探《さが》しに行《い》く'],
 oi:['Memiringkan wajahnya agar muntahan tidak tersangkut di tenggorokan','Tetap telentang dan menengadahkan wajah','Segera menawarkan makanan','Keluar kamar untuk mencari alat bersih-bersih'],
 a:0,
 e:'吐《は》いた物《もの》で窒息《ちっそく》や誤嚥《ごえん》をしないよう、顔《かお》を横《よこ》に向《む》ける。そばを離《はな》れず、ナースコールなどで応援《おうえん》と看護職《かんごしょく》を呼《よ》ぶ。',
 ei:'Miringkan wajahnya agar tidak tersedak atau terjadi aspirasi karena muntahan. Jangan meninggalkannya; panggil bantuan dan perawat (kangoshoku) dengan nurse call dll.'},
{id:'jg09',c:'jitsugi',t:'mc',
 q:'朝《あさ》、Iさんの体温《たいおん》をはかると38.2℃だった。いつもは36.3℃ぐらいである。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Pagi hari, suhu tubuh Tuan I diukur 38,2°C. Biasanya sekitar 36,3°C. Pilih satu tindakan yang paling tepat.',
 o:['すぐに看護職《かんごしょく》に報告《ほうこく》する','予定《よてい》どおり入浴《にゅうよく》してもらう','自分《じぶん》の判断《はんだん》で薬《くすり》を飲《の》ませる','明日《あした》まで様子《ようす》を見《み》て、だれにも言《い》わない'],
 oi:['Segera melapor ke perawat (kangoshoku)','Tetap mandi sesuai jadwal','Memberi obat atas keputusan sendiri','Menunggu sampai besok tanpa memberi tahu siapa pun'],
 a:0,
 e:'いつもと違《ちが》う体温《たいおん》（発熱《はつねつ》）は、すぐに看護職《かんごしょく》に報告《ほうこく》する。介護職《かいごしょく》が自分《じぶん》の判断《はんだん》で薬《くすり》を飲《の》ませてはいけない。',
 ei:'Suhu tubuh yang berbeda dari biasanya (demam) harus segera dilaporkan ke perawat (kangoshoku). Perawat (kaigoshoku) tidak boleh memberi obat atas keputusan sendiri.'},
{id:'jg10',c:'jitsugi',t:'mc',
 q:'Jさんが熱《あつ》いお茶《ちゃ》を手《て》にこぼして、やけどをした。最初《さいしょ》の対応《たいおう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Nyonya J menumpahkan teh panas ke tangannya dan terluka bakar. Pilih satu tindakan pertama yang paling tepat.',
 o:['すぐに流水《りゅうすい》で冷《ひ》やし、看護職《かんごしょく》に連絡《れんらく》する','油《あぶら》やみそをぬる','そのままにして様子《ようす》を見《み》る','温《あたた》かいタオルで包《つつ》む'],
 oi:['Segera mendinginkan dengan air mengalir dan menghubungi perawat (kangoshoku)','Mengoleskan minyak atau miso','Membiarkan dan mengamati','Membungkus dengan handuk hangat'],
 a:0,
 e:'やけどは、すぐに流水《りゅうすい》で十分《じゅうぶん》に冷《ひ》やす。油《あぶら》などをぬってはいけない。看護職《かんごしょく》に連絡《れんらく》し、記録《きろく》・報告《ほうこく》する。',
 ei:'Luka bakar segera didinginkan dengan air mengalir secukupnya. Jangan mengoleskan minyak dll. Hubungi perawat (kangoshoku), lalu catat dan laporkan.'},
{id:'jg11',c:'jitsugi',t:'mc',
 q:'Kさんに渡《わた》す薬《くすり》を、間違《まちが》えてLさんに渡《わた》してしまったことに気《き》づいた。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Anda sadar telah salah memberikan obat untuk Tuan K kepada Tuan L. Pilih satu tindakan yang paling tepat.',
 o:['すぐに看護職《かんごしょく》と上司《じょうし》に報告《ほうこく》する','だれにも言《い》わずに様子《ようす》を見《み》る','Lさんに吐《は》かせる','Kさんには薬《くすり》を飲《の》まなかったことにする'],
 oi:['Segera melapor ke perawat (kangoshoku) dan atasan','Mengamati tanpa memberi tahu siapa pun','Membuat Tuan L memuntahkannya','Menganggap Tuan K tidak minum obat'],
 a:0,
 e:'誤薬《ごやく》は命《いのち》にかかわることがある。隠《かく》さず、すぐに看護職《かんごしょく》・上司《じょうし》に報告《ほうこく》し、指示《しじ》に従《したが》う。あとで事故報告《じこほうこく》を書《か》き、再発防止《さいはつぼうし》を考《かんが》える。',
 ei:'Kesalahan obat bisa membahayakan nyawa. Jangan disembunyikan; segera laporkan ke perawat (kangoshoku) dan atasan, lalu ikuti instruksinya. Setelah itu tulis laporan kecelakaan dan pikirkan pencegahan agar tidak terulang.'},
{id:'jg12',c:'jitsugi',t:'mc',
 q:'Mさんが「今日《きょう》はお風呂《ふろ》に入《はい》りたくない」と言《い》っている。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Tuan M berkata "hari ini saya tidak mau mandi". Pilih satu tindakan yang paling tepat.',
 o:['理由《りゆう》を聴《き》き、無理《むり》に入《はい》らせない','予定《よてい》なので、無理《むり》に浴室《よくしつ》に連《つ》れて行《い》く','「入《はい》らないと、ご飯《はん》がありません」と言《い》う','何《なに》も聞《き》かずに、今週《こんしゅう》はもう入《はい》らないことにする'],
 oi:['Mendengarkan alasannya dan tidak memaksa mandi','Memaksa membawanya ke kamar mandi karena sudah jadwal','Berkata "kalau tidak mandi, tidak dapat makan"','Tanpa bertanya, memutuskan minggu ini tidak mandi lagi'],

 e:'本人《ほんにん》の意思《いし》を尊重《そんちょう》する。体調《たいちょう》が悪《わる》い・寒《さむ》い・恥《は》ずかしいなど、理由《りゆう》を聴《き》いて対応《たいおう》を考《かんが》える（時間《じかん》を変《か》える、清拭《せいしき》にするなど）。',
 ei:'Hargai keinginannya. Dengarkan alasannya, seperti kurang sehat, dingin, atau malu, lalu pikirkan tindakan (mengubah waktu, menggantinya dengan menyeka badan, dll.).'},
{id:'jg13',c:'jitsugi',t:'mc',
 q:'Nさんをベッドから車《くるま》いすに移乗《いじょう》する前《まえ》に、ベッドの高《たか》さを調整《ちょうせい》する。最《もっと》も適切《てきせつ》な高《たか》さを1つ選《えら》びなさい。',

 ei:'Jika telapak kaki menapak kuat di lantai, kaki bisa bertenaga saat berdiri sehingga pindah dengan aman.'},
{id:'jg14',c:'jitsugi',t:'mc',
 q:'Oさんは視覚障害《しかくしょうがい》がある。食事《しょくじ》のとき、おかずの場所《ばしょ》を伝《つた》える方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Tuan O mengalami gangguan penglihatan. Saat makan, pilih satu cara paling tepat untuk memberi tahu letak lauk.',

 a:0,

{id:'jg15',c:'jitsugi',t:'mc',
 q:'Pさんのおむつを交換《こうかん》するとき、最初《さいしょ》にすることとして、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Saat mengganti popok Nyonya P, pilih satu hal pertama yang paling tepat.',

 e:'ケアの前《まえ》には必《かなら》ず声《こえ》かけと説明《せつめい》をして同意《どうい》を得《え》る。カーテンを閉《し》め、肌《はだ》をなるべく出《だ》さないなどプライバシーを守《まも》る。',

 o:['Qさんは、体操《たいそう》を見《み》に行《い》く','Qさんは、体操《たいそう》をしない。部屋《へや》にいる','体操《たいそう》は午前《ごぜん》2時《じ》からだ','Qさんは、一人《ひとり》で体操《たいそう》に行《い》く'], oi:['Tuan Q pergi untuk menonton senam','Tuan Q tidak ikut senam dan tetap di kamar','Senam mulai jam 2 pagi','Tuan Q pergi senam sendirian'], a:0,

{id:'kw07',c:'kaiwa',t:'mc',
 p:'介護職《かいごしょく》：Rさん、お茶《ちゃ》とコーヒー、どちらがいいですか。\nRさん：コーヒーがいいけど、夜《よる》眠《ねむ》れなくなるから……。\n介護職《かいごしょく》：では、温《あたた》かいほうじ茶《ちゃ》はいかがですか。\nRさん：いいですね。それにします。',
 pi:'Perawat: Tuan R, mau teh atau kopi?\nTuan R: Kopi enak, tapi nanti malam tidak bisa tidur...\nPerawat: Kalau begitu, bagaimana dengan teh houjicha hangat?\nTuan R: Boleh. Saya pilih itu.',
 q:'Rさんは何《なに》を飲《の》みますか。', qi:'Apa yang akan diminum Tuan R?',
 o:['温《あたた》かいほうじ茶《ちゃ》','コーヒー','冷《つめ》たいお茶《ちゃ》','水《みず》'], oi:['Teh houjicha hangat','Kopi','Teh dingin','Air putih'], a:0,
 e:'Rさんはコーヒーをやめて、介護職《かいごしょく》がすすめた温《あたた》かいほうじ茶《ちゃ》に「それにします」と言《い》った。',
 ei:'Tuan R tidak jadi minum kopi dan berkata "saya pilih itu" untuk teh houjicha hangat yang ditawarkan perawat.'},
{id:'kw08',c:'kaiwa',t:'mc',
 p:'Sさんの娘《むすめ》：母《はは》の様子《ようす》はどうですか。\n介護職《かいごしょく》：お元気《げんき》ですよ。昨日《きのう》は歌《うた》の会《かい》に出《で》て、楽《たの》しそうでした。ただ、最近《さいきん》少《すこ》し食欲《しょくよく》が落《お》ちています。\nSさんの娘《むすめ》：そうですか。母《はは》は甘《あま》いものが好《す》きなので、今度《こんど》持《も》って来《き》てもいいですか。\n介護職《かいごしょく》：看護師《かんごし》に確認《かくにん》してから、お返事《へんじ》しますね。',
 pi:'Putri Nyonya S: Bagaimana keadaan ibu saya?\nPerawat: Beliau sehat. Kemarin ikut acara bernyanyi dan tampak senang. Hanya saja, akhir-akhir ini nafsu makannya agak menurun.\nPutri Nyonya S: Begitu ya. Ibu suka makanan manis, bolehkah lain kali saya bawakan?\nPerawat: Saya akan memastikan dulu ke perawat (kangoshi), lalu memberi jawaban, ya.',
 q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
 o:['介護職《かいごしょく》は、看護師《かんごし》に確認《かくにん》してから返事《へんじ》をする','Sさんは、最近《さいきん》よく食《た》べている','介護職《かいごしょく》は、甘《あま》いものを持《も》って来《き》てもいいとすぐ答《こた》えた','Sさんは、歌《うた》の会《かい》に出《で》なかった'], oi:['Perawat akan menjawab setelah memastikan ke perawat (kangoshi)','Akhir-akhir ini Nyonya S banyak makan','Perawat langsung menjawab boleh membawa makanan manis','Nyonya S tidak ikut acara bernyanyi'], a:0,
 e:'介護職《かいごしょく》は「看護師《かんごし》に確認《かくにん》してから、お返事《へんじ》しますね」と言《い》った。自分《じぶん》だけで判断《はんだん》しないことも大切《たいせつ》。',
 ei:'Perawat berkata "saya akan memastikan dulu ke perawat, lalu memberi jawaban". Penting juga untuk tidak memutuskan sendiri.'},
