// ---------- セッション作成 ----------
function makeSession(mode, qs, title, limitMin) {
  return {
    mode, title, finished: false,
    items: qs.map(q => ({ q, order: q.t === 'tf' ? [0, 1] : shuffle(q.o.map((_, i) => i)), pick: null, done: false })),
    idx: 0, startedAt: Date.now(), limit: limitMin ? limitMin * 60 * 1000 : 0,
  };
}
function startPractice() {
  let pool = QUESTIONS.filter(q => srcOk(q, SETUP.src) && (SETUP.cat === 'all' || q.c === SETUP.cat));
  if (!pool.length) { toast('この条件の問題はありません'); return; }
  pool = shuffle(pool);
  if (SETUP.prio) {
    const key = q => { const r = DB.srs[q.id]; return r ? (r.box <= 1 ? 1 : r.box + 1) : 0; }; // 未学習→苦手→その他
    pool.sort((a, b) => key(a) - key(b));
  }
  const n = SETUP.n || pool.length;
  const qs = shuffle(pool.slice(0, n));
  S = makeSession('practice', qs, SETUP.cat === 'all' ? 'すべて' : plain(CATS[SETUP.cat].ja));
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}
function startReview() {
  const qs = dueList().slice(0, 30);
  if (!qs.length) return;
  S = makeSession('review', shuffle(qs), '復習');
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}
function startMock(type) {
  const M = MOCKS[type];
  const total = Object.values(M.plan).reduce((a, b) => a + b, 0);
  if (!confirm(`${plain(M.ja)}の模擬試験をはじめます。\n${total}問・${M.minutes}分（合格 ${M.pass}%）。答えと解説は最後に表示されます。\n\nMulai simulasi ${M.id}? (${total} soal, ${M.minutes} menit)`)) return;
  // 本番と同じ順番：分野ごとにまとめて出題
  const qs = [];
  Object.entries(M.plan).forEach(([c, n]) => qs.push(...shuffle(QUESTIONS.filter(q => q.c === c)).slice(0, n)));
  S = makeSession('mock', qs, '模擬試験（' + M.short + '）', M.minutes);
  S.mockType = type;
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); startTimer();
}

// ---------- タイマー ----------
function startTimer() {
  endTimer();
  timerId = setInterval(() => {
    if (!S || S.mode !== 'mock') return endTimer();
    const left = S.limit - (Date.now() - S.startedAt);
    const el = document.getElementById('timer');
    if (el) { el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 5 * 60 * 1000); }
    if (left <= 0) { endTimer(); toast('時間です / Waktu habis'); finish(); }
  }, 1000);
}
function endTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function fmtTime(ms) { ms = Math.max(0, ms); const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000); return m + ':' + String(s).padStart(2, '0'); }

// ---------- 解答画面 ----------
function viewQuiz() {
  if (!S) return viewHome();
  const it = S.items[S.idx], q = it.q, total = S.items.length;
  const isMock = S.mode === 'mock';
  const showFb = !isMock && it.done;
  const typeLabel = (q.t === 'tf' ? '○×' : q.t === 'listen' ? '🎧 聴解' : (q.o.length + '択')) + (q.src === 'pdf' ? '・PDF' : '');

  let head = `
  <div class="qbar">
    <button class="close" onclick="go('home')">✕ ${R('やめる')}</button>
    <div><b>${S.idx + 1}</b> / ${total}</div>
    ${isMock ? `<div class="timer" id="timer">⏱ ${fmtTime(S.limit - (Date.now() - S.startedAt))}</div>` : `<div class="sub">${esc(S.title)}</div>`}
  </div>
  <div class="progress"><i style="width:${(S.idx + (it.done ? 1 : 0)) / total * 100}%"></i></div>`;

  let listen = '';
  if (q.t === 'listen') {
    listen = `
    ${!HAS_TTS || (HAS_TTS && speechSynthesis.getVoices().length && !jaVoice) ? `<div class="warn">⚠️ ${R('この端末《たんまつ》では日本語《にほんご》の音声《おんせい》が使《つか》えない可能性《かのうせい》があります。')}</div>` : ''}
    <div class="listen">
      <button class="main" onclick="speak(S.items[S.idx].q.s, 0.9)">▶ ${R('聞《き》く')}</button>
      <button onclick="speak(S.items[S.idx].q.s, 0.65)">🐢 ${R('ゆっくり')}</button>
    </div>`;
  }

  let opts;
  if (q.t === 'tf') {
    const lab = [['○', '正《ただ》しい', 'Benar'], ['×', 'まちがい', 'Salah']];
    opts = `<div class="tf">${[0, 1].map(i => {
      const cls = optClass(it, i, showFb, isMock);
      return `<button class="opt ${cls}" ${showFb ? 'disabled' : ''} onclick="pick(${i})">
        <span class="mark">${lab[i][0]}</span><span class="lbl">${R(lab[i][1])}<small>${lab[i][2]}</small></span></button>`;
    }).join('')}</div>`;
  } else {
    opts = `<div class="opts">${it.order.map((oi, pos) => {
      const cls = optClass(it, oi, showFb, isMock);
      return `<button class="opt ${cls}" ${showFb ? 'disabled' : ''} onclick="pick(${oi})">
        <span class="no">${NUMS[pos]}</span><span>${R(q.o[oi])}${ID(q.oi && q.oi[oi])}</span></button>`;
    }).join('')}</div>`;
  }

  let fb = '';
  if (showFb) {
    const ok = it.pick === q.a;
    const ansText = q.t === 'tf' ? (q.a === 0 ? '○ 正《ただ》しい' : '× まちがい') : q.o[q.a];
    fb = `
    <div class="fb ${ok ? 'ok' : 'ng'}">
      <div class="res">${ok ? '⭕ ' + R('正解《せいかい》！') + ' Jawaban benar!' : '❌ ' + R('不正解《ふせいかい》') + ' Jawaban salah'}</div>
      ${ok ? '' : `<div class="ans">${R('正解《せいかい》')}：${R(ansText)}</div>`}
      ${explain(q)}
      ${q.t === 'listen' ? scriptBox(q) : ''}
    </div>`;
  }

  let foot;
  if (isMock) {
    const unans = S.items.filter(x => x.pick === null).length;
    const last = S.idx === total - 1;
    foot = `
    <div class="qfoot">
      <button class="btn sec" ${S.idx === 0 ? 'disabled' : ''} onclick="move(-1)">← ${R('前《まえ》')}</button>
      ${last ? `<button class="btn" onclick="submitMock()">${R('提出《ていしゅつ》する')}</button>`
             : `<button class="btn" onclick="move(1)">${R('次《つぎ》')} →</button>`}
    </div>
    <div class="unans">${R('未回答《みかいとう》')}：${unans}問 / Belum dijawab</div>
    <div class="grid">${S.items.map((x, i) =>
      `<button class="${x.pick !== null ? 'done' : ''} ${i === S.idx ? 'cur' : ''}" onclick="jump(${i})">${i + 1}</button>`).join('')}</div>`;
  } else {
    foot = `<div class="qfoot"><button class="btn" ${it.done ? '' : 'disabled'} onclick="next()">
      ${S.idx === total - 1 ? R('結果《けっか》を見《み》る') : R('次《つぎ》へ') + ' →'}</button></div>`;
  }

  return `${head}
  <div class="card">
    <span class="badge">${CATS[q.c].ic} ${catName(q.c)}</span><span class="qtype">${typeLabel}</span>
    ${listen}
    ${q.p ? `<div class="passage">${R(q.p)}</div>${ID(q.pi)}` : ''}
    <div class="qtext">${R(q.q)}</div>${ID(q.qi)}
    ${opts}
    ${fb}
  </div>
  ${foot}`;
}
function scriptBox(q) {
  return `<div class="script">🎧 ${R(q.s)}<button onclick="speak(QMAP['${q.id}'].s,0.9)">▶</button>${ID(q.si)}</div>`;
}
function optClass(it, i, showFb, isMock) {
  if (showFb) {
    if (i === it.q.a) return 'ok';
    if (i === it.pick) return 'ng';
    return '';
  }
  return it.pick === i ? 'sel' : '';
}
function pick(i) {
  if (Date.now() - shownAt < 350) return;   // 画面が変わった直後の誤タップを無視
  const it = S.items[S.idx];
  if (S.mode === 'mock') { it.pick = i; render(); return; }
  if (it.done) return;
  it.pick = i; it.done = true;
  record(it.q, i === it.q.a);
  render();
  const fb = document.querySelector('.fb');
  if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function next() {
  stopSpeak();
  if (S.idx < S.items.length - 1) { S.idx++; render(); window.scrollTo(0, 0); autoPlay(); }
  else finish();
}
function move(d) { stopSpeak(); S.idx = Math.max(0, Math.min(S.items.length - 1, S.idx + d)); render(); window.scrollTo(0, 0); autoPlay(); }
function jump(i) { stopSpeak(); S.idx = i; render(); window.scrollTo(0, 0); autoPlay(); }
function autoPlay() {
  const it = S && S.items[S.idx];
  if (it && it.q.t === 'listen' && !it.done && it.pick === null) setTimeout(() => speak(it.q.s, 0.9), 400);
}
function submitMock() {
  const unans = S.items.filter(x => x.pick === null).length;
  const msg = unans ? `未回答が ${unans}問 あります。提出しますか？\n(Masih ada ${unans} soal belum dijawab. Kumpulkan?)` : '提出しますか？ (Kumpulkan?)';
  if (confirm(msg)) finish();
}

// ---------- 結果 ----------
function finish() {
  endTimer(); stopSpeak();
  if (S.mode === 'mock') S.items.forEach(it => { it.done = true; record(it.q, it.pick === it.q.a); });
  S.finished = true;
  const items = S.items.filter(it => it.done);
  const correct = items.filter(it => it.pick === it.q.a).length;
  const byCat = {};
  items.forEach(it => {
    const b = byCat[it.q.c] = byCat[it.q.c] || { ok: 0, n: 0 };
    b.n++; if (it.pick === it.q.a) b.ok++;
  });
  const pct = items.length ? Math.round(correct / items.length * 100) : 0;
  RESULT = { mode: S.mode, mockType: S.mockType, title: S.title, correct, total: items.length, pct, byCat,
             wrong: items.filter(it => it.pick !== it.q.a), used: Date.now() - S.startedAt };
  if (S.mode === 'mock') {
    DB.hist.push({ d: Date.now(), type: S.mockType, pct, correct, total: items.length });
    if (DB.hist.length > 30) DB.hist.shift();
    save();
  }
  S = null; VIEW = 'result'; render(); window.scrollTo(0, 0);
}
function viewResult() {
  const r = RESULT; if (!r) return viewHome();
  const isMock = r.mode === 'mock';
  const M = MOCKS[r.mockType] || MOCKS.skill;
  const bars = Object.keys(CATS).filter(c => r.byCat[c]).map(c => {
    const b = r.byCat[c], p = Math.round(b.ok / b.n * 100);
    return `<div class="bar-row"><span>${CATS[c].ic} ${catName(c)}</span>
      <div class="bar"><i class="${p >= 80 ? 'good' : p < PASS_LINE ? 'weak' : ''}" style="width:${p}%"></i></div>
      <span class="pct">${b.ok}/${b.n}</span></div>`;
  }).join('');
  const wrong = r.wrong.map(it => {
    const q = it.q;
    const your = it.pick === null ? '（未回答《みかいとう》）' : q.t === 'tf' ? (it.pick === 0 ? '○' : '×') : q.o[it.pick];
    const ans = q.t === 'tf' ? (q.a === 0 ? '○ 正《ただ》しい' : '× まちがい') : q.o[q.a];
    return `<details class="wrong"><summary>${CATS[q.c].ic} ${R(q.q)}</summary>
      <div class="body">
        ${q.p ? `<div class="passage">${R(q.p)}</div>` : ''}
        <div>❌ ${R('あなたの答《こた》え')}：${R(your)}</div>
        <div><b>⭕ ${R('正解《せいかい》')}：${R(ans)}</b></div>
        ${explain(q)}
        ${q.t === 'listen' ? `<div class="mt">🎧 ${R(q.s)} <button class="chip" style="padding:2px 10px" onclick="speak(QMAP['${q.id}'].s,0.9)">▶</button></div>${ID(q.si)}` : ''}
      </div></details>`;
  }).join('');
  return `
  <div class="card">
    <div class="score">
      <div class="sub">${isMock ? R('模擬試験《もぎしけん》の結果《けっか》') : R('練習《れんしゅう》の結果《けっか》')} / Hasil</div>
      <div class="big">${r.pct}<small>%</small></div>
      <div>${r.correct} / ${r.total} ${R('問《もん》正解《せいかい》')}</div>
      ${isMock ? `<div class="pass ${r.pct >= M.pass ? 'y' : 'n'}">${r.pct >= M.pass ? '🎉 ' + R('合格《ごうかく》ライン') + ' (' + M.pass + '%)' : '💪 ' + R('あと少《すこ》し') + ' (' + R('合格《ごうかく》') + ' ' + M.pass + '%)'}</div>
                 <div class="sub mt">${R(M.ja)}　${R('時間《じかん》')}：${fmtTime(r.used)} / ${M.minutes}:00</div>
                 <div class="sub">※${R('本番《ほんばん》は難《むずか》しさで点数《てんすう》が調整《ちょうせい》されることがあります')}</div>` : ''}
    </div>
  </div>
  ${bars ? `<div class="card"><h2>${R('分野別《ぶんやべつ》')} <span class="sub">Per bidang</span></h2>${bars}</div>` : ''}
  ${r.wrong.length ? `
  <button class="btn" onclick="retryWrong()">${R('まちがえた問題《もんだい》をもう一度《いちど》')}（${r.wrong.length}問）<small>Ulangi soal yang salah</small></button>
  <div class="card mt"><h2>${R('まちがえた問題《もんだい》と解説《かいせつ》')} <span class="sub">Pembahasan</span></h2>${wrong}</div>`
  : `<div class="card" style="text-align:center">🎉 ${R('全問《ぜんもん》正解《せいかい》です！')} Semua benar!</div>`}
  <button class="btn sec mt" onclick="go('home')" style="margin-bottom:24px">🏠 ${R('ホームへ')}</button>`;
}
function retryWrong() {
  const qs = RESULT.wrong.map(it => it.q);
  S = makeSession('practice', shuffle(qs), 'もう一度');
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}

// ---------- 成績 ----------
function viewStats() {
  const bars = Object.keys(CATS).map(c => {
    const s = catStats(c);
    const p = s.pct;
    return `<div class="bar-row"><span>${CATS[c].ic} ${catName(c)}</span>
      <div class="bar"><i class="${p === null ? '' : p >= 80 ? 'good' : p < PASS_LINE ? 'weak' : ''}" style="width:${p || 0}%"></i></div>
      <span class="pct">${p === null ? '-' : p + '%'}</span></div>
      <div class="sub" style="margin:-4px 0 6px 0;padding-left:2px">${R('解《と》いた')} ${s.seen}/${s.total}・${R('覚《おぼ》えた')} ${s.mastered}</div>`;
  }).join('');
  const hist = DB.hist.slice().reverse().slice(0, 10).map(h =>
    `<div class="hist"><span>${new Date(h.d).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
     <span>${(MOCKS[h.type] || MOCKS.skill).short}　${h.correct}/${h.total}</span><b style="color:${h.pct >= (MOCKS[h.type] || MOCKS.skill).pass ? 'var(--ok)' : 'var(--ng)'}">${h.pct}%</b></div>`).join('');
  return `
  <div class="card"><h2>${R('分野別《ぶんやべつ》の正答率《せいとうりつ》')} <span class="sub">Persentase benar</span></h2>${bars}
    <div class="sub mt">🟩 80%${R("以上《いじょう》")}　🟧 ${PASS_LINE}〜79%　🟥 ${PASS_LINE}%${R('未満《みまん》')}（${R('苦手《にがて》')}）</div></div>
  <div class="card"><h2>${R('模擬試験《もぎしけん》の記録《きろく》')} <span class="sub">Riwayat ujian simulasi</span></h2>
    ${hist || `<div class="sub">${R('まだありません')}</div>`}</div>
  <button class="btn sec" onclick="go('home')">← ${R('もどる')}</button>
  <button class="btn ghost mt" style="margin-bottom:24px" onclick="resetAll()">🗑 ${R('記録《きろく》をリセット')}</button>`;
}
function resetAll() {
  if (!confirm('すべての学習記録を消しますか？\n(Hapus semua catatan belajar?)')) return;
  DB.srs = {}; DB.hist = []; save(); toast('リセットしました'); render();
}

// ---------- キーボード（PC用） ----------
document.addEventListener('keydown', e => {
  if (VIEW !== 'quiz' || !S || e.target.tagName === 'INPUT') return;
  const it = S.items[S.idx];
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    if (it.q.t === 'tf') { if (n <= 2) pick(n - 1); }
    else if (it.order[n - 1] !== undefined) pick(it.order[n - 1]);
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    if (S.mode === 'mock') { if (S.idx < S.items.length - 1) move(1); }
    else if (it.done) next();
  } else if (e.key === 'ArrowLeft' && S.mode === 'mock') move(-1);
});

// =====================================================================
//  ログイン
// =====================================================================
function doLogin() {
  if (checkPassword(document.getElementById('pw').value)) {
    lsSet('kaigo_auth', '2');
    showApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateToggles(); render();
}
if (lsGet('kaigo_auth') === '2') showApp();
</script>
</body>
