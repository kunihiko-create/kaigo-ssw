  T({id:'pk01',c:'bunsho',
   p:'名前《なまえ》　佐藤《さとう》さん\n見《み》る　右目《みぎめ》はよく見《み》えますが、左目《ひだりめ》は見《み》えにくいです。\n聞《き》く　左耳《ひだりみみ》が少《すこ》し聞《き》こえにくいですが、大《おお》きい声《こえ》で話《はな》せば、聞《き》くことができます。\n話《はな》す　問題《もんだい》なく話《はな》すことができます。',
   pi:'Nama: Tuan Sato\nMelihat: mata kanan bisa melihat dengan baik, tetapi mata kiri sulit melihat.\nMendengar: telinga kiri agak sulit mendengar, tetapi jika diajak bicara dengan suara keras, bisa mendengar.\nBerbicara: bisa berbicara tanpa masalah.',
   q:'文《ぶん》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi tulisan.',
   o:['佐藤《さとう》さんは、左耳《ひだりみみ》が聞《き》こえにくいです','佐藤《さとう》さんは、右目《みぎめ》も左目《ひだりめ》も見《み》えにくいです','佐藤《さとう》さんは、左耳《ひだりみみ》も右耳《みぎみみ》もよく聞《き》こえます','佐藤《さとう》さんは、話《はな》すことができません'],
   oi:['Telinga kiri Tuan Sato sulit mendengar','Mata kanan dan kiri Tuan Sato sulit melihat','Telinga kiri dan kanan Tuan Sato mendengar dengan baik','Tuan Sato tidak bisa berbicara'],
   e:'「聞《き》く」の欄《らん》に「左耳《ひだりみみ》が少《すこ》し聞《き》こえにくい」とある。右目《みぎめ》はよく見《み》える。話《はな》すことは問題《もんだい》ない。',
   ei:'Di kolom "mendengar" tertulis "telinga kiri agak sulit mendengar". Mata kanan melihat dengan baik. Berbicara tidak bermasalah.'});
  T({id:'pk02',c:'bunsho',
   p:'鈴木《すずき》さんは、胸《むね》が痛《いた》くて入院《にゅういん》していましたが、退院《たいいん》しました。静《しず》かにしているときは問題《もんだい》がありません。お風呂《ふろ》に入《はい》っているとき、胸《むね》が苦《くる》しいことがあります。入浴《にゅうよく》は、介護《かいご》と見守《みまも》りが必要《ひつよう》です。',
   pi:'Tuan Suzuki dirawat di rumah sakit karena sakit dada, tetapi sudah keluar. Saat tenang tidak ada masalah. Saat mandi berendam, kadang dadanya terasa sesak. Untuk mandi, perlu bantuan dan pengawasan.',
   q:'文《ぶん》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi tulisan.',
   o:['鈴木《すずき》さんは、手伝《てつだ》ってもらって入浴《にゅうよく》しています','鈴木《すずき》さんは、いつも胸《むね》が痛《いた》いです','鈴木《すずき》さんは、今《いま》、入院《にゅういん》しています','鈴木《すずき》さんは、お風呂《ふろ》に一人《ひとり》で入《はい》ることができます'],
   oi:['Tuan Suzuki mandi dengan dibantu','Dada Tuan Suzuki selalu sakit','Tuan Suzuki sekarang dirawat di rumah sakit','Tuan Suzuki bisa mandi sendiri'],
   e:'「入浴《にゅうよく》は、介護《かいご》と見守《みまも》りが必要《ひつよう》」＝手伝《てつだ》ってもらって入浴《にゅうよく》している。もう退院《たいいん》している。静《しず》かなときは問題《もんだい》ない。',
   ei:'"Untuk mandi perlu bantuan dan pengawasan" = mandi dengan dibantu. Ia sudah keluar dari rumah sakit. Saat tenang tidak ada masalah.'});
  T({id:'pk04',c:'bunsho',
   p:'佐藤《さとう》さんは、トイレに行《い》って排泄《はいせつ》していますが、夜《よる》はポータブルトイレを使《つか》っています。排泄《はいせつ》は介護《かいご》が必要《ひつよう》です。失禁《しっきん》はありません。',
   pi:'Tuan Sato buang air dengan pergi ke toilet, tetapi pada malam hari memakai toilet portabel. Untuk buang air perlu bantuan. Tidak ada inkontinensia (mengompol).',
   q:'佐藤《さとう》さんの排泄《はいせつ》について、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar tentang buang air Tuan Sato.',
   o:['夜《よる》、ポータブルトイレで排泄《はいせつ》しています','いつもトイレへ行《い》って排泄《はいせつ》しています','自立《じりつ》しています','失禁《しっきん》があります'],
   oi:['Malam hari buang air di toilet portabel','Selalu buang air dengan pergi ke toilet','Mandiri','Mengalami inkontinensia'],
   e:'「夜《よる》はポータブルトイレを使《つか》っています」とある。介護《かいご》が必要《ひつよう》なので自立《じりつ》ではない。失禁《しっきん》はない。',
   ei:'Tertulis "malam hari memakai toilet portabel". Karena perlu bantuan, ia tidak mandiri. Tidak ada inkontinensia.'});
  T({id:'pk05',c:'bunsho',
   p:'【面会《めんかい》についてのお願《ねが》い】\n11月《がつ》になりました。これから寒《さむ》くなって、インフルエンザが流行《りゅうこう》します。ノロウイルスも多《おお》くなります。\n熱《ねつ》、せき、吐《は》き気《け》などの症状《しょうじょう》がある人《ひと》は、面会《めんかい》ができません。玄関《げんかん》の入《い》り口《ぐち》にアルコール消毒液《しょうどくえき》が置《お》いてありますので、使《つか》ってください。',
   pi:'[Permohonan terkait kunjungan]\nSudah bulan November. Mulai sekarang cuaca makin dingin dan influenza mewabah. Norovirus juga bertambah.\nOrang yang memiliki gejala seperti demam, batuk, atau mual tidak bisa berkunjung. Di pintu masuk tersedia cairan disinfektan alkohol, silakan digunakan.',
   q:'文《ぶん》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi tulisan.',
   o:['熱《ねつ》、せき、吐《は》き気《け》の症状《しょうじょう》があるときは、面会《めんかい》できません','インフルエンザが流行《りゅうこう》しているので、だれも面会《めんかい》できません','ノロウイルスが多《おお》いので、面会《めんかい》できません','玄関《げんかん》にアルコール消毒液《しょうどくえき》がないときは、面会《めんかい》できません'],
   oi:['Jika ada gejala demam, batuk, atau mual, tidak bisa berkunjung','Karena influenza mewabah, tidak ada yang bisa berkunjung','Karena banyak norovirus, tidak bisa berkunjung','Jika di pintu masuk tidak ada disinfektan alkohol, tidak bisa berkunjung'],
   e:'「熱《ねつ》、せき、吐《は》き気《け》などの症状《しょうじょう》がある人《ひと》は、面会《めんかい》ができません」とある。症状《しょうじょう》がなければ面会《めんかい》できる。',
   ei:'Tertulis "orang dengan gejala demam, batuk, mual, dll. tidak bisa berkunjung". Jika tidak ada gejala, bisa berkunjung.'});
  T({id:'pk06',c:'bunsho',
   p:'入浴《にゅうよく》の前《まえ》に、必《かなら》ず利用者《りようしゃ》の体調《たいちょう》を確認《かくにん》します。そして、トイレに行《い》ってもらいましょう。食事《しょくじ》の後《あと》すぐに入浴《にゅうよく》しないようにします。脱衣室《だついしつ》や浴室《よくしつ》の温度《おんど》にも注意《ちゅうい》しましょう。入浴《にゅうよく》の後《あと》で水分補給《すいぶんほきゅう》を忘《わす》れないでください。',
   pi:'Sebelum mandi, selalu periksa kondisi tubuh pengguna. Lalu, mintalah ia ke toilet. Jangan mandi tepat setelah makan. Perhatikan juga suhu ruang ganti dan kamar mandi. Setelah mandi, jangan lupa memberi minum.',
   q:'文《ぶん》の内容《ないよう》と同《おな》じものはどれですか。', qi:'Manakah yang sama dengan isi tulisan?',
   o:['脱衣室《だついしつ》と浴室《よくしつ》の温度《おんど》に気《き》をつけなければなりません','入浴《にゅうよく》の前《まえ》に、利用者《りようしゃ》に「おなかがすいていますか」と聞《き》きます','入浴《にゅうよく》の後《あと》で、利用者《りようしゃ》にトイレに行《い》ってもらいます','入浴《にゅうよく》の後《あと》で、利用者《りようしゃ》にすぐに食《た》べ物《もの》を食《た》べてもらいます'],
   oi:['Harus memperhatikan suhu ruang ganti dan kamar mandi','Sebelum mandi, bertanya kepada pengguna "apakah Anda lapar?"','Setelah mandi, meminta pengguna ke toilet','Setelah mandi, langsung meminta pengguna makan'],
   e:'「脱衣室《だついしつ》や浴室《よくしつ》の温度《おんど》にも注意《ちゅうい》しましょう」とある。トイレは入浴《にゅうよく》の前《まえ》。入浴後《にゅうよくご》は水分補給《すいぶんほきゅう》。',
   ei:'Tertulis "perhatikan juga suhu ruang ganti dan kamar mandi". Toilet sebelum mandi. Setelah mandi beri minum.'});
  T({id:'pk07',c:'bunsho',
   p:'介護《かいご》する前《まえ》には、必《かなら》ず声《こえ》かけをしましょう。例《たと》えば、車《くるま》いすを押《お》す前《まえ》に、利用者《りようしゃ》さんに押《お》すことを伝《つた》えましょう。利用者《りようしゃ》さんの安全《あんぜん》、安心《あんしん》をいつも考《かんが》えて介護《かいご》しましょう。',
   pi:'Sebelum merawat, selalu sapa terlebih dahulu. Misalnya, sebelum mendorong kursi roda, beri tahu pengguna bahwa Anda akan mendorong. Selalu rawat dengan memikirkan keamanan dan rasa tenang pengguna.',
   q:'車《くるま》いすを押《お》す前《まえ》に何《なん》と言《い》いますか。いちばんいいものを選《えら》んでください。', qi:'Apa yang dikatakan sebelum mendorong kursi roda? Pilih yang terbaik.',
   o:['「車《くるま》いすを押《お》しますね」','「車《くるま》いすのブレーキをかけますよ」','「危《あぶ》ないですよ」','「介護《かいご》しますよ」'],
   oi:['"Saya dorong kursi rodanya, ya."','"Saya pasang rem kursi roda, ya."','"Berbahaya, lho."','"Saya rawat, ya."'],
   e:'文《ぶん》に「車《くるま》いすを押《お》す前《まえ》に、押《お》すことを伝《つた》えましょう」とある。これから何《なに》をするか具体的《ぐたいてき》に伝《つた》える。',
   ei:'Tulisan berkata "sebelum mendorong kursi roda, beri tahu bahwa Anda akan mendorong". Sampaikan secara konkret apa yang akan dilakukan.'});
  T({id:'pk10',c:'bunsho',
   p:'【夏祭《なつまつ》り】\n日時《にちじ》　7月《がつ》7日（土曜日《どようび》）13:00〜15:40\n場所《ばしょ》　2階《かい》ホール\n参加者《さんかしゃ》　利用者《りようしゃ》20人、ご家族《かぞく》15人、職員《しょくいん》（介護職《かいごしょく》5人、看護職《かんごしょく》1人、調理員《ちょうりいん》1人）\n担当者《たんとうしゃ》\n・介護職《かいごしょく》、看護職《かんごしょく》：ホールの準備《じゅんび》をします\n・調理員《ちょうりいん》：飲《の》み物《もの》の準備《じゅんび》をします\n・介護職《かいごしょく》：家族《かぞく》をホールに案内《あんない》します\n・介護職《かいごしょく》：利用者《りようしゃ》をホールに誘導《ゆうどう》します',
   pi:'[Festival musim panas]\nWaktu: 7 Juli (Sabtu) 13:00–15:40\nTempat: aula lantai 2\nPeserta: 20 pengguna, 15 keluarga, staf (5 perawat kaigo, 1 perawat kango, 1 juru masak)\nPenanggung jawab:\n- Perawat kaigo & kango: menyiapkan aula\n- Juru masak: menyiapkan minuman\n- Perawat kaigo: mengantar keluarga ke aula\n- Perawat kaigo: membimbing pengguna ke aula',
   q:'次《つぎ》の中《なか》から、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar di antara berikut.',
   o:['介護職《かいごしょく》が家族《かぞく》をホールに案内《あんない》します','夏祭《なつまつ》りは、午前《ごぜん》に行《おこな》います','夏祭《なつまつ》りには、利用者《りようしゃ》だけが参加《さんか》します','看護職《かんごしょく》が利用者《りようしゃ》をホールに誘導《ゆうどう》します'],
   oi:['Perawat kaigo mengantar keluarga ke aula','Festival diadakan pagi hari','Hanya pengguna yang ikut festival','Perawat kango membimbing pengguna ke aula'],
   e:'担当者《たんとうしゃ》の欄《らん》に「介護職《かいごしょく》：家族《かぞく》をホールに案内《あんない》します」とある。時間《じかん》は午後《ごご》。家族《かぞく》・職員《しょくいん》も参加《さんか》。利用者《りようしゃ》を誘導《ゆうどう》するのは介護職《かいごしょく》。',
   ei:'Di kolom penanggung jawab tertulis "perawat kaigo: mengantar keluarga ke aula". Waktunya siang. Keluarga dan staf juga ikut. Yang membimbing pengguna adalah perawat kaigo.'});
  T({id:'pk34',c:'bunsho',
   p:'利用者《りようしゃ》　中村律子《なかむらりつこ》様　　性別《せいべつ》　女《おんな》\n食事《しょくじ》　自分《じぶん》で飲《の》んだり、食《た》べたりできる。お茶《ちゃ》などの飲《の》み物《もの》は、熱《あつ》いと飲《の》めない。\n注意事項《ちゅういじこう》　飲《の》み物《もの》を出《だ》すとき、温度《おんど》に注意《ちゅうい》する。',
   pi:'Pengguna: Nyonya Ritsuko Nakamura   Jenis kelamin: perempuan\nMakan: bisa minum dan makan sendiri. Minuman seperti teh tidak bisa diminum jika panas.\nPerhatian: saat menyajikan minuman, perhatikan suhunya.',
   q:'あなたは利用者《りようしゃ》の中村《なかむら》さんについて、情報《じょうほう》を読《よ》みました。どうしますか。', qi:'Anda sudah membaca informasi tentang Nyonya Nakamura. Apa yang Anda lakukan?',
   o:['熱《あつ》い飲《の》み物《もの》は、温度《おんど》を下《さ》げてから出《だ》す','熱《あつ》い飲《の》み物《もの》は、温度《おんど》を下《さ》げないで出《だ》す','飲《の》み物《もの》は、温度《おんど》を気《き》にしないで出《だ》す','飲《の》み物《もの》はまったく飲《の》めないので、出《だ》さない'],
   oi:['Minuman panas disajikan setelah suhunya diturunkan','Minuman panas disajikan tanpa diturunkan suhunya','Minuman disajikan tanpa memedulikan suhu','Tidak menyajikan minuman karena sama sekali tidak bisa minum'],
   e:'「熱《あつ》いと飲《の》めない」「温度《おんど》に注意《ちゅうい》する」とある。冷《さ》ましてから出《だ》す。',
   ei:'Tertulis "tidak bisa diminum jika panas" dan "perhatikan suhunya". Sajikan setelah didinginkan.'});
  T({id:'pk35',c:'bunsho',
   p:'【ご家族《かぞく》のみなさまへ】\n6月《がつ》になりました。これから食中毒《しょくちゅうどく》が多《おお》くなります。\n6月《がつ》1日から8月《がつ》31日まで、施設《しせつ》に食品《しょくひん》を持《も》って来《こ》ないようにしてください。玄関《げんかん》に消毒液《しょうどくえき》が置《お》いてあります。施設《しせつ》に入《はい》るとき、手《て》を消毒《しょうどく》してください。',
   pi:'[Kepada seluruh keluarga]\nSudah bulan Juni. Mulai sekarang keracunan makanan akan bertambah.\nDari 1 Juni sampai 31 Agustus, mohon jangan membawa makanan ke fasilitas. Di pintu masuk tersedia cairan disinfektan. Saat masuk fasilitas, mohon disinfeksi tangan.',
   q:'次《つぎ》の中《なか》から、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar di antara berikut.',
   o:['9月《がつ》から、食品《しょくひん》を持《も》って来《く》ることができます','6月《がつ》になると、食中毒《しょくちゅうどく》になります','6月《がつ》、7月《がつ》、8月《がつ》は、食品《しょくひん》を持《も》って来《く》ることができます','玄関《げんかん》で消毒《しょうどく》すれば、食品《しょくひん》を持《も》って来《く》ることができます'],
   oi:['Mulai September, boleh membawa makanan','Jika sudah Juni, pasti keracunan makanan','Pada Juni, Juli, Agustus boleh membawa makanan','Jika disinfeksi di pintu masuk, boleh membawa makanan'],
   e:'食品《しょくひん》を持《も》って来《こ》られないのは6月《がつ》1日〜8月《がつ》31日。だから9月《がつ》からは持《も》って来《く》ることができる。',
   ei:'Makanan tidak boleh dibawa dari 1 Juni sampai 31 Agustus. Jadi mulai September boleh membawa.'});
  T({id:'pk37',c:'bunsho',
   p:'名前《なまえ》　佐藤《さとう》さん\n家族《かぞく》　娘《むすめ》さんが一人《ひとり》と息子《むすこ》さんが一人《ひとり》います。\n娘《むすめ》さんの家《いえ》は施設《しせつ》の近《ちか》くにあります。娘《むすめ》さんは働《はたら》いています。土曜日《どようび》と日曜日《にちようび》だけ、面会《めんかい》に来《く》ることができます。\n息子《むすこ》さんは、ほかの県《けん》に住《す》んでいます。仕事《しごと》が忙《いそが》しいので、あまり面会《めんかい》に来《く》ることができません。',
   pi:'Nama: Tuan Sato\nKeluarga: punya satu putri dan satu putra.\nRumah putrinya dekat fasilitas. Putrinya bekerja. Ia hanya bisa berkunjung pada hari Sabtu dan Minggu.\nPutranya tinggal di prefektur lain. Karena pekerjaannya sibuk, ia jarang bisa berkunjung.',
   q:'次《つぎ》の中《なか》から、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar di antara berikut.',
   o:['佐藤《さとう》さんの息子《むすこ》さんは働《はたら》いています','佐藤《さとう》さんの娘《むすめ》さんの家《いえ》は、施設《しせつ》から遠《とお》いです','佐藤《さとう》さんの娘《むすめ》さんは、月曜日《げつようび》に面会《めんかい》に来《き》ます','佐藤《さとう》さんの息子《むすこ》さんは、よく面会《めんかい》に来《き》ます'],

   e:'息子《むすこ》さんは「仕事《しごと》が忙《いそが》しい」＝働《はたら》いている。娘《むすめ》さんの家《いえ》は近《ちか》く、面会《めんかい》は土日《どにち》だけ。息子《むすこ》さんはあまり来《こ》ない。',
   ei:'Putranya "sibuk bekerja" = bekerja. Rumah putrinya dekat dan ia hanya berkunjung Sabtu-Minggu. Putranya jarang datang.'});
  T({id:'pk39',c:'bunsho',
   p:'【夜勤《やきん》（17:00〜10:00）】\n17:00　出勤《しゅっきん》\n18:00　食事介護《しょくじかいご》・服薬介護《ふくやくかいご》、申《もう》し送《おく》り（日勤《にっきん》→夜勤《やきん》）\n20:00　就寝介護《しゅうしんかいご》（洗面《せんめん》・口腔《こうくう》ケア・着替《きが》え）\n23:00　巡視《じゅんし》（2時間《じかん》に1回《かい》）\n6:00　起床介護《きしょうかいご》（洗面《せんめん》・口腔《こうくう》ケア・着替《きが》え）\n8:00　食事介護《しょくじかいご》・服薬介護《ふくやくかいご》\n9:00　朝《あさ》のミーティング\n9:30　記録《きろく》\n10:00　退勤《たいきん》',

   q:'文《ぶん》の内容《ないよう》で、正《ただ》しいものを1つ選《えら》んでください。', qi:'Pilih satu yang benar sesuai isi tulisan.',
   o:['起床介護《きしょうかいご》で、利用者《りようしゃ》の洗面《せんめん》や歯《は》みがきを手伝《てつだ》います','出勤《しゅっきん》して、まず就寝介護《しゅうしんかいご》をします','巡視《じゅんし》は1回《かい》だけします','朝《あさ》の食事介護《しょくじかいご》の前《まえ》に、ミーティングがあります'],
   oi:['Pada bantuan bangun pagi, membantu cuci muka dan sikat gigi pengguna','Setelah masuk kerja, pertama melakukan bantuan persiapan tidur','Patroli hanya dilakukan sekali','Sebelum bantuan sarapan ada rapat'],
   e:'6:00の起床介護《きしょうかいご》に「洗面《せんめん》・口腔《こうくう》ケア」とある。出勤後《しゅっきんご》まず食事介護《しょくじかいご》。巡視《じゅんし》は2時間《じかん》に1回《かい》。ミーティングは朝食《ちょうしょく》の後《あと》。',
   ei:'Pada bantuan bangun jam 6:00 tertulis "cuci muka, perawatan mulut". Setelah masuk kerja, pertama bantuan makan. Patroli sekali setiap 2 jam. Rapat setelah sarapan.'});
  T({id:'pk40',c:'bunsho',
   p:'名前《なまえ》　鈴木《すずき》さん\n移動《いどう》　車《くるま》いすで移動《いどう》しています\n排泄《はいせつ》　少《すこ》し介護《かいご》が必要《ひつよう》です\n食事《しょくじ》　自立《じりつ》しています\n入浴《にゅうよく》　少《すこ》し介護《かいご》が必要《ひつよう》です',
   pi:'Nama: Tuan Suzuki\nMobilitas: bergerak dengan kursi roda\nBuang air: perlu sedikit bantuan\nMakan: mandiri\nMandi: perlu sedikit bantuan',

   o:['鈴木《すずき》さんは、自分《じぶん》でご飯《はん》を食《た》べることができます','鈴木《すずき》さんは、自分《じぶん》で歩《ある》いて移動《いどう》することができます','鈴木《すずき》さんは、自分《じぶん》でトイレへ行《い》くことができます','鈴木《すずき》さんは、自分《じぶん》でお風呂《ふろ》に入《はい》ることができます'],
   oi:['Tuan Suzuki bisa makan sendiri','Tuan Suzuki bisa berjalan sendiri','Tuan Suzuki bisa ke toilet sendiri','Tuan Suzuki bisa mandi sendiri'],
   e:'食事《しょくじ》は「自立《じりつ》」＝自分《じぶん》でできる。移動《いどう》は車《くるま》いす。排泄《はいせつ》と入浴《にゅうよく》は介護《かいご》が必要《ひつよう》。',
   ei:'Makan "mandiri" = bisa sendiri. Mobilitas dengan kursi roda. Buang air dan mandi perlu bantuan.'});
  T({id:'pk61',c:'bunsho',
   p:'【ご家族《かぞく》のみなさまへ】\n11月《がつ》は、施設《しせつ》の駐車場《ちゅうしゃじょう》が工事中《こうじちゅう》です。\n11月《がつ》1日から30日まで、施設《しせつ》に車《くるま》で来《こ》ないでください。ご不便《ふべん》をおかけして申《もう》し訳《わけ》ございません。12月《がつ》からは、車《くるま》で来《く》ることができます。',
   pi:'[Kepada seluruh keluarga]\nPada bulan November, tempat parkir fasilitas sedang dalam perbaikan.\nDari 1 sampai 30 November, mohon jangan datang ke fasilitas dengan mobil. Mohon maaf atas ketidaknyamanannya. Mulai Desember, boleh datang dengan mobil.',
   q:'次《つぎ》の中《なか》から、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar di antara berikut.',
   o:['11月《がつ》は、施設《しせつ》の駐車場《ちゅうしゃじょう》が使《つか》えません','11月《がつ》は、自分《じぶん》の車《くるま》で来《く》ることができます','11月《がつ》から、自分《じぶん》の車《くるま》で来《く》ることができます','12月《がつ》から、施設《しせつ》の駐車場《ちゅうしゃじょう》が使《つか》えなくなります'],
   oi:['Pada bulan November, tempat parkir fasilitas tidak bisa dipakai','Pada bulan November, boleh datang dengan mobil sendiri','Mulai November, boleh datang dengan mobil sendiri','Mulai Desember, tempat parkir fasilitas tidak bisa dipakai'],
   e:'11月《がつ》は工事中《こうじちゅう》で、車《くるま》で来《こ》られない＝駐車場《ちゅうしゃじょう》が使《つか》えない。12月《がつ》からは車《くるま》で来《く》ることができる。',
   ei:'Pada November sedang perbaikan dan tidak bisa datang dengan mobil = tempat parkir tidak bisa dipakai. Mulai Desember bisa datang dengan mobil.'});
  T({id:'pk77',c:'bunsho',
   p:'名前《なまえ》　木村《きむら》さん\n家族《かぞく》　娘《むすめ》さんが一人《ひとり》と息子《むすこ》さんが一人《ひとり》います。\n娘《むすめ》さんの家《いえ》は施設《しせつ》の近《ちか》くにあります。娘《むすめ》さんは主婦《しゅふ》です。平日《へいじつ》に、週《しゅう》2回《かい》面会《めんかい》に来《き》ます。ふつうは月曜日《げつようび》と金曜日《きんようび》です。\n息子《むすこ》さんは、ほかの県《けん》に住《す》んでいます。仕事《しごと》が忙《いそが》しいので、あまり面会《めんかい》に来《く》ることができません。',
   pi:'Nama: Tuan Kimura\nKeluarga: punya satu putri dan satu putra.\nRumah putrinya dekat fasilitas. Putrinya ibu rumah tangga. Ia berkunjung 2 kali seminggu pada hari kerja, biasanya Senin dan Jumat.\nPutranya tinggal di prefektur lain. Karena pekerjaannya sibuk, ia jarang bisa berkunjung.',
   q:'次《つぎ》の中《なか》から、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar di antara berikut.',
   o:['木村《きむら》さんの娘《むすめ》さんは、月曜日《げつようび》に面会《めんかい》に来《き》ます','木村《きむら》さんの娘《むすめ》さんの家《いえ》は、施設《しせつ》から遠《とお》いです','木村《きむら》さんの息子《むすこ》さんには、奥《おく》さんがいます','木村《きむら》さんの息子《むすこ》さんは、よく面会《めんかい》に来《き》ます'],
   oi:['Putri Tuan Kimura berkunjung hari Senin','Rumah putri Tuan Kimura jauh dari fasilitas','Putra Tuan Kimura punya istri','Putra Tuan Kimura sering berkunjung'],
   e:'娘《むすめ》さんは「ふつうは月曜日《げつようび》と金曜日《きんようび》」に来《く》る。家《いえ》は近《ちか》い。息子《むすこ》さんの奥《おく》さんのことは書《か》いていない。',

  T({id:'pk83',c:'bunsho',

   oi:['Perlu bantuan','Kadang-kadang buang air dengan pergi ke toilet','Mandiri','Buang air di toilet portabel'],

   ei:'Tertulis "untuk buang air perlu bantuan". Ia selalu pergi ke toilet. Tidak ingin memakai toilet portabel.'});
  T({id:'pk85',c:'bunsho',
   p:'利用者《りようしゃ》　中村伸介《なかむらしんすけ》様　　性別《せいべつ》　男《おとこ》\n食事《しょくじ》　自分《じぶん》で飲《の》んだり、食《た》べたりできる。温《あたた》かい牛乳《ぎゅうにゅう》が好《この》み。\n注意事項《ちゅういじこう》　寝《ね》る前《まえ》に、必《かなら》ず牛乳《ぎゅうにゅう》を飲《の》んでもらうこと。',
   pi:'Pengguna: Tuan Shinsuke Nakamura   Jenis kelamin: laki-laki\nMakan: bisa minum dan makan sendiri. Suka susu hangat.\nPerhatian: sebelum tidur, pastikan ia minum susu.',
   q:'あなたは利用者《りようしゃ》の中村《なかむら》さんについて、情報《じょうほう》を読《よ》みました。どうしますか。', qi:'Anda sudah membaca informasi tentang Tuan Nakamura. Apa yang Anda lakukan?',
   o:['中村《なかむら》さんが寝《ね》る前《まえ》に、牛乳《ぎゅうにゅう》を飲《の》んでもらう','中村《なかむら》さんが食事《しょくじ》をするときに、牛乳《ぎゅうにゅう》を飲《の》んでもらう','中村《なかむら》さんが食《た》べた後《あと》すぐに、牛乳《ぎゅうにゅう》を飲《の》んでもらう','中村《なかむら》さんが牛乳《ぎゅうにゅう》を飲《の》んだ後《あと》、寝《ね》かせない'],
   oi:['Memberi susu sebelum Tuan Nakamura tidur','Memberi susu saat Tuan Nakamura makan','Memberi susu tepat setelah Tuan Nakamura makan','Tidak membiarkan Tuan Nakamura tidur setelah minum susu'],
   e:'注意事項《ちゅういじこう》に「寝《ね》る前《まえ》に、必《かなら》ず牛乳《ぎゅうにゅう》を飲《の》んでもらう」とある。',
   ei:'Di kolom perhatian tertulis "sebelum tidur, pastikan ia minum susu".'});
  T({id:'pk96',c:'bunsho',
   p:'名前《なまえ》　中村《なかむら》さん\n家族《かぞく》　娘《むすめ》さんが二人《ふたり》と息子《むすこ》さんが一人《ひとり》います。\n上《うえ》の娘《むすめ》さんの家《いえ》は施設《しせつ》の近《ちか》くにあります。よく面会《めんかい》に来《き》ます。下《した》の娘《むすめ》さんは北海道《ほっかいどう》に住《す》んでいて、あまり面会《めんかい》できません。\n息子《むすこ》さんは、ほかの県《けん》に住《す》んでいます。仕事《しごと》が忙《いそが》しいので、あまり面会《めんかい》に来《く》ることができません。',
   pi:'Nama: Nyonya Nakamura\nKeluarga: punya dua putri dan satu putra.\nRumah putri sulung dekat fasilitas. Ia sering berkunjung. Putri bungsu tinggal di Hokkaido dan jarang bisa berkunjung.\nPutranya tinggal di prefektur lain. Karena pekerjaannya sibuk, ia jarang bisa berkunjung.',
   q:'次《つぎ》の中《なか》から、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar di antara berikut.',
   o:['中村《なかむら》さんの下《した》の娘《むすめ》さんと息子《むすこ》さんは、施設《しせつ》から遠《とお》い所《ところ》に住《す》んでいます','中村《なかむら》さんの上《うえ》の娘《むすめ》さんの家《いえ》は、施設《しせつ》から遠《とお》いです','中村《なかむら》さんの息子《むすこ》さんは、よく来《き》ます','中村《なかむら》さんの上《うえ》の娘《むすめ》さんと息子《むすこ》さんは、あまり来《き》ません'],
   oi:['Putri bungsu dan putra Nyonya Nakamura tinggal jauh dari fasilitas','Rumah putri sulung Nyonya Nakamura jauh dari fasilitas','Putra Nyonya Nakamura sering datang','Putri sulung dan putra Nyonya Nakamura jarang datang'],
   e:'下《した》の娘《むすめ》さんは北海道《ほっかいどう》、息子《むすこ》さんはほかの県《けん》＝どちらも遠《とお》い。上《うえ》の娘《むすめ》さんは近《ちか》くに住《す》んで、よく来《く》る。',
   ei:'Putri bungsu di Hokkaido, putra di prefektur lain = keduanya jauh. Putri sulung tinggal dekat dan sering datang.'});

  // ===== 介護の会話・声かけ =====
  T({id:'pk03',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さんは、あまり食《た》べていませんね。\n佐藤《さとう》さん：おいしくないんです。\n介護職《かいごしょく》：そうですか。佐藤《さとう》さんは料理《りょうり》が上手《じょうず》でしたね。明日《あした》の昼《ひる》ご飯《はん》をいっしょに作《つく》りましょうか。\n佐藤《さとう》さん：うれしい。私《わたし》は野菜《やさい》の煮物《にもの》がとても上手《じょうず》です。焼《や》き魚《ざかな》も作《つく》りましょう。\n介護職《かいごしょく》：そうですね。私《わたし》も楽《たの》しみです。',
   pi:'Perawat: Tuan Sato tidak banyak makan, ya.\nTuan Sato: Tidak enak.\nPerawat: Begitu ya. Tuan Sato pandai memasak, kan. Bagaimana kalau besok kita masak makan siang bersama?\nTuan Sato: Senangnya. Saya sangat pandai membuat sayur rebus. Kita buat ikan bakar juga.\nPerawat: Baik. Saya juga menantikannya.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['あしたの昼《ひる》ご飯《はん》は、野菜《やさい》の煮物《にもの》を作《つく》ります','あしたの昼《ひる》ご飯《はん》は、佐藤《さとう》さんが一人《ひとり》で作《つく》ります','あしたの昼《ひる》ご飯《はん》は、魚《さかな》の煮付《につ》けを作《つく》ります','あしたの昼《ひる》ご飯《はん》は、介護職《かいごしょく》が作《つく》ります'],
   oi:['Besok makan siang membuat sayur rebus','Besok makan siang dibuat Tuan Sato sendiri','Besok makan siang membuat ikan rebus','Besok makan siang dibuat oleh perawat'],
   e:'佐藤《さとう》さんが「野菜《やさい》の煮物《にもの》がとても上手《じょうず》」と言《い》い、介護職《かいごしょく》も「そうですね」と言《い》った。いっしょに作《つく》る。魚《さかな》は煮付《につ》けではなく焼《や》き魚《ざかな》。',
   ei:'Tuan Sato berkata "sangat pandai membuat sayur rebus" dan perawat menjawab "baik". Mereka memasak bersama. Ikannya bukan ikan rebus, tetapi ikan bakar.'});
  T({id:'pk08',c:'kaiwa',
   p:'介護職《かいごしょく》：鈴木《すずき》さん、右足《みぎあし》はどうですか。\n鈴木《すずき》さん：もう、あまり痛《いた》くないよ。\n介護職《かいごしょく》：そうですか。じゃ、少《すこ》し歩《ある》く練習《れんしゅう》をしましょう。杖《つえ》をどうぞ。\n鈴木《すずき》さん：ありがとう。\n介護職《かいごしょく》：私《わたし》が声《こえ》をかけますから、ゆっくり歩《ある》きましょう。はじめに杖《つえ》を前《まえ》に出《だ》して、次《つぎ》に右足《みぎあし》、そして左足《ひだりあし》ですよ。\n鈴木《すずき》さん：杖《つえ》、右《みぎ》、左《ひだり》だね。',
   pi:'Perawat: Tuan Suzuki, bagaimana kaki kanan Anda?\nTuan Suzuki: Sudah tidak terlalu sakit.\nPerawat: Begitu ya. Kalau begitu, mari latihan berjalan sedikit. Silakan tongkatnya.\nTuan Suzuki: Terima kasih.\nPerawat: Saya akan memberi aba-aba, jadi mari berjalan pelan-pelan. Pertama majukan tongkat, lalu kaki kanan, kemudian kaki kiri.\nTuan Suzuki: Tongkat, kanan, kiri, ya.',
   q:'鈴木《すずき》さんは何《なに》をしましたか。', qi:'Apa yang dilakukan Tuan Suzuki?',
   o:['鈴木《すずき》さんは、歩《ある》く練習《れんしゅう》をしました','鈴木《すずき》さんは、自分《じぶん》でトイレに行《い》きました','鈴木《すずき》さんは、自分《じぶん》で車《くるま》いすに乗《の》りました','鈴木《すずき》さんは、自分《じぶん》でくつをはきました'],
   oi:['Tuan Suzuki berlatih berjalan','Tuan Suzuki pergi ke toilet sendiri','Tuan Suzuki naik kursi roda sendiri','Tuan Suzuki memakai sepatu sendiri'],
   e:'介護職《かいごしょく》が「歩《ある》く練習《れんしゅう》をしましょう」と言《い》い、杖《つえ》を使《つか》って歩《ある》いた。',
   ei:'Perawat berkata "mari latihan berjalan" dan Tuan Suzuki berjalan dengan tongkat.'});
  T({id:'pk09',c:'kaiwa',
   p:'介護職《かいごしょく》：鈴木《すずき》さん、おかえりなさい。散歩《さんぽ》はどうでしたか。\n鈴木《すずき》さん：うん。外《そと》は涼《すず》しくて気持《きも》ちがよかったよ。\n介護職《かいごしょく》：それはよかったですね。これから昼《ひる》ご飯《はん》ですから、トイレに行《い》きませんか。\n鈴木《すずき》さん：今《いま》はまだ行《い》きたくないよ。\n介護職《かいごしょく》：そうですか。でも、食事《しょくじ》の前《まえ》に行《い》けば安心《あんしん》ですよ。\n鈴木《すずき》さん：そうか。じゃ、行《い》っておこう。',
   pi:'Perawat: Tuan Suzuki, selamat datang kembali. Bagaimana jalan-jalannya?\nTuan Suzuki: Ya. Di luar sejuk dan menyenangkan.\nPerawat: Syukurlah. Sebentar lagi makan siang, mau ke toilet dulu?\nTuan Suzuki: Sekarang belum ingin.\nPerawat: Begitu ya. Tapi kalau pergi sebelum makan, lebih tenang lho.\nTuan Suzuki: Oh begitu. Kalau begitu, saya pergi dulu.',
   q:'鈴木《すずき》さんは、このあとすぐ何《なに》をしますか。', qi:'Apa yang akan segera dilakukan Tuan Suzuki setelah ini?',
   o:['トイレに行《い》きます','手《て》を洗《あら》います','ご飯《はん》を食《た》べます','散歩《さんぽ》に行《い》きます'],
   oi:['Pergi ke toilet','Mencuci tangan','Makan','Pergi jalan-jalan'],
   e:'最後《さいご》に鈴木《すずき》さんが「じゃ、行《い》っておこう」と言《い》った＝トイレに行《い》く。',
   ei:'Terakhir Tuan Suzuki berkata "kalau begitu, saya pergi dulu" = pergi ke toilet.'});
  T({id:'pk11',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、体調《たいちょう》はどうですか。\n佐藤《さとう》さん：悪《わる》くないです。\n介護職《かいごしょく》：これから歩《ある》く練習《れんしゅう》をしましょうか。\n佐藤《さとう》さん：そうですね。\n介護職《かいごしょく》：杖《つえ》と歩行器《ほこうき》と、どちらを持《も》って来《き》ましょうか。\n佐藤《さとう》さん：杖《つえ》のほうがいいです。\n介護職《かいごしょく》：わかりました。今《いま》、杖《つえ》を持《も》って来《き》ますから、手《て》すりにつかまってお待《ま》ちくださいね。',
   pi:'Perawat: Tuan Sato, bagaimana kondisi Anda?\nTuan Sato: Tidak buruk.\nPerawat: Bagaimana kalau sekarang latihan berjalan?\nTuan Sato: Baiklah.\nPerawat: Mau saya bawakan tongkat atau walker?\nTuan Sato: Tongkat saja.\nPerawat: Baik. Saya ambilkan tongkatnya sekarang, mohon tunggu sambil berpegangan pada pegangan, ya.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、杖《つえ》で歩《ある》く練習《れんしゅう》をします','佐藤《さとう》さんは、体調《たいちょう》がとても良《よ》いので、歩《ある》く練習《れんしゅう》をします','佐藤《さとう》さんは、歩行器《ほこうき》で歩《ある》く練習《れんしゅう》をします','佐藤《さとう》さんは、手《て》すりにつかまって歩《ある》く練習《れんしゅう》をします'],
   oi:['Tuan Sato berlatih berjalan dengan tongkat','Tuan Sato berlatih berjalan karena kondisinya sangat baik','Tuan Sato berlatih berjalan dengan walker','Tuan Sato berlatih berjalan sambil berpegangan pada pegangan'],
   e:'佐藤《さとう》さんは「杖《つえ》のほうがいい」と言《い》った。体調《たいちょう》は「悪《わる》くない」（とても良《よ》いではない）。手《て》すりは待《ま》つ間《あいだ》につかまるだけ。',
   ei:'Tuan Sato berkata "tongkat saja". Kondisinya "tidak buruk" (bukan sangat baik). Pegangan hanya dipegang saat menunggu.'});
  T({id:'pk12',c:'kaiwa',
   p:'鈴木《すずき》さん：トイレに行《い》きたいんだけど。\n介護職《かいごしょく》：わかりました。いっしょに行《い》きましょう。ベッドから起《お》き上《あ》がれますか。\n鈴木《すずき》さん：ゆっくりやってみるよ。\n介護職《かいごしょく》：あ、できましたね。くつをはきましょう。お手伝《てつだ》いしましょうか。\n鈴木《すずき》さん：お願《ねが》い。\n介護職《かいごしょく》：私《わたし》につかまってください。車《くるま》いすに乗《の》りましょう。',
   pi:'Tuan Suzuki: Saya ingin ke toilet.\nPerawat: Baik. Mari pergi bersama. Bisa bangun dari tempat tidur?\nTuan Suzuki: Saya coba pelan-pelan.\nPerawat: Wah, bisa ya. Mari pakai sepatu. Mau saya bantu?\nTuan Suzuki: Tolong.\nPerawat: Silakan berpegangan pada saya. Mari naik kursi roda.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['鈴木《すずき》さんは、自分《じぶん》で起《お》き上《あ》がりました','鈴木《すずき》さんは、自分《じぶん》でトイレに行《い》きました','鈴木《すずき》さんは、自分《じぶん》で車《くるま》いすに乗《の》りました','鈴木《すずき》さんは、自分《じぶん》でくつをはきました'],
   oi:['Tuan Suzuki bangun sendiri','Tuan Suzuki pergi ke toilet sendiri','Tuan Suzuki naik kursi roda sendiri','Tuan Suzuki memakai sepatu sendiri'],
   e:'介護職《かいごしょく》が「あ、できましたね」と言《い》った＝自分《じぶん》で起《お》き上《あ》がった。くつと車《くるま》いすは手伝《てつだ》ってもらった。',
   ei:'Perawat berkata "wah, bisa ya" = ia bangun sendiri. Sepatu dan kursi roda dibantu.'});
  T({id:'pk13',c:'kaiwa',
   p:'介護職《かいごしょく》：あまり食《た》べていませんね。\n佐藤《さとう》さん：右手《みぎて》が少《すこ》し痛《いた》くて、はしがうまく持《も》てません。\n介護職《かいごしょく》：右手《みぎて》が痛《いた》いんですね。お手伝《てつだ》いしましょうか。\n佐藤《さとう》さん：大丈夫《だいじょうぶ》です。スプーンで食《た》べます。持《も》って来《き》てください。\n介護職《かいごしょく》：わかりました。スプーンを持《も》って来《き》ますね。',
   pi:'Perawat: Anda tidak banyak makan, ya.\nTuan Sato: Tangan kanan saya agak sakit, jadi tidak bisa memegang sumpit dengan baik.\nPerawat: Tangan kanan Anda sakit, ya. Mau saya bantu?\nTuan Sato: Tidak apa-apa. Saya makan dengan sendok. Tolong bawakan.\nPerawat: Baik. Saya bawakan sendoknya, ya.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、自分《じぶん》でご飯《はん》を食《た》べます','佐藤《さとう》さんは、ご飯《はん》を全部《ぜんぶ》食《た》べました','佐藤《さとう》さんは、左手《ひだりて》ではしを持《も》ちます','佐藤《さとう》さんは、介護職《かいごしょく》に手伝《てつだ》ってもらって、ご飯《はん》を食《た》べます'],
   oi:['Tuan Sato makan sendiri','Tuan Sato makan semuanya','Tuan Sato memegang sumpit dengan tangan kiri','Tuan Sato makan dengan dibantu perawat'],
   e:'佐藤《さとう》さんは「大丈夫《だいじょうぶ》です。スプーンで食《た》べます」と言《い》った＝自分《じぶん》で食《た》べる。',
   ei:'Tuan Sato berkata "tidak apa-apa, saya makan dengan sendok" = makan sendiri.'});
  T({id:'pk14',c:'kaiwa',
   p:'介護職《かいごしょく》：鈴木《すずき》さんの食事介助《しょくじかいじょ》が終《お》わりました。\nリーダー：お疲《つか》れさまです。鈴木《すずき》さんは、食事《しょくじ》を全部《ぜんぶ》食《た》べましたか。\n介護職《かいごしょく》：はい、全部《ぜんぶ》食《た》べました。鈴木《すずき》さんは最近《さいきん》、お茶《ちゃ》やみそ汁《しる》を飲《の》むと、むせることがあります。\nリーダー：そうですか。誤嚥《ごえん》に気《き》をつけてください。食《た》べた量《りょう》は、必《かなら》ず記録《きろく》してくださいね。\n介護職《かいごしょく》：はい、記録《きろく》します。',
   pi:'Perawat: Bantuan makan Tuan Suzuki sudah selesai.\nPemimpin: Terima kasih. Apakah Tuan Suzuki makan semuanya?\nPerawat: Ya, semuanya. Akhir-akhir ini Tuan Suzuki kadang tersedak saat minum teh atau sup miso.\nPemimpin: Begitu ya. Hati-hati aspirasi. Jumlah yang dimakan wajib dicatat, ya.\nPerawat: Baik, akan saya catat.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['鈴木《すずき》さんは、お茶《ちゃ》を飲《の》むと、ときどきむせます','鈴木《すずき》さんは、食事《しょくじ》を残《のこ》しました','鈴木《すずき》さんは、みそ汁《しる》を飲《の》むとき、いつもむせています','鈴木《すずき》さんは、食《た》べた量《りょう》を記録《きろく》します'],
   oi:['Tuan Suzuki kadang tersedak saat minum teh','Tuan Suzuki menyisakan makanan','Tuan Suzuki selalu tersedak saat minum sup miso','Tuan Suzuki mencatat jumlah yang dimakan'],
   e:'「むせることがあります」＝ときどきむせる（いつもではない）。全部《ぜんぶ》食《た》べた。記録《きろく》するのは介護職《かいごしょく》。',
   ei:'"Kadang tersedak" = sesekali (tidak selalu). Ia makan semuanya. Yang mencatat adalah perawat.'});
  T({id:'pk15',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、食事《しょくじ》は終《お》わりましたね。もう少《すこ》し飲《の》み物《もの》はいかがですか。\n佐藤《さとう》さん：はい、いただきます。\n介護職《かいごしょく》：冷《つめ》たい麦茶《むぎちゃ》をお持《も》ちしましょうか。\n佐藤《さとう》さん：いいえ、温《あたた》かい紅茶《こうちゃ》が飲《の》みたいです。\n介護職《かいごしょく》：わかりました。じゃ、（　　　）。\n佐藤《さとう》さん：ありがとう。',
   pi:'Perawat: Tuan Sato, makannya sudah selesai, ya. Mau minum sedikit lagi?\nTuan Sato: Ya, mau.\nPerawat: Mau saya bawakan teh jelai dingin?\nTuan Sato: Tidak, saya ingin teh hitam hangat.\nPerawat: Baik. Kalau begitu, (     ).\nTuan Sato: Terima kasih.',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['温《あたた》かい紅茶《こうちゃ》を持《も》って来《き》ますね','冷《つめ》たい麦茶《むぎちゃ》を持《も》って来《き》ますね','温《あたた》かい麦茶《むぎちゃ》を持《も》って来《き》ますね','冷《つめ》たい紅茶《こうちゃ》を持《も》って来《き》ますね'],
   oi:['Saya bawakan teh hitam hangat, ya','Saya bawakan teh jelai dingin, ya','Saya bawakan teh jelai hangat, ya','Saya bawakan teh hitam dingin, ya'],
   e:'佐藤《さとう》さんは「温《あたた》かい紅茶《こうちゃ》が飲《の》みたい」と言《い》った。',
   ei:'Tuan Sato berkata "saya ingin teh hitam hangat".'});
  T({id:'pk16',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、パジャマに着替《きが》える前《まえ》に、おしりをきれいにしましょうか。\n佐藤《さとう》さん：そうですね。\n介護職《かいごしょく》：じゃ、ズボンを下《さ》げますね。\n佐藤《さとう》さん：はい、お願《ねが》いします。\n介護職《かいごしょく》：おしりがちょっと赤《あか》くなっていますね。痛《いた》くないですか。\n佐藤《さとう》さん：はい、少《すこ》し痛《いた》いです。\n介護職《かいごしょく》：そうですか。看護職《かんごしょく》に連絡《れんらく》しておきますね。',
   pi:'Perawat: Tuan Sato, sebelum berganti piyama, mari bersihkan bokongnya.\nTuan Sato: Baiklah.\nPerawat: Saya turunkan celananya, ya.\nTuan Sato: Ya, tolong.\nPerawat: Bokongnya agak merah, ya. Tidak sakit?\nTuan Sato: Ya, agak sakit.\nPerawat: Begitu ya. Saya hubungi perawat (kangoshoku), ya.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、おしりが痛《いた》いです','佐藤《さとう》さんは、パジャマに着替《きが》えました','佐藤《さとう》さんは、自分《じぶん》でズボンを下《さ》げました','佐藤《さとう》さんは、自分《じぶん》でおしりをふきました'],
   oi:['Bokong Tuan Sato sakit','Tuan Sato sudah berganti piyama','Tuan Sato menurunkan celananya sendiri','Tuan Sato menyeka bokongnya sendiri'],
   e:'佐藤《さとう》さんは「少《すこ》し痛《いた》いです」と言《い》った。着替《きが》えはまだ（「着替《きが》える前《まえ》に」）。ズボンは介護職《かいごしょく》が下《さ》げた。',
   ei:'Tuan Sato berkata "agak sakit". Belum berganti baju ("sebelum berganti"). Celananya diturunkan oleh perawat.'});
  T({id:'pk17',c:'kaiwa',
   p:'介護職《かいごしょく》：一人《ひとり》で便座《べんざ》に座《すわ》れますか。\n佐藤《さとう》さん：はい、大丈夫《だいじょうぶ》です。このボタンは何《なん》ですか。\n介護職《かいごしょく》：呼《よ》び出《だ》しボタンです。職員《しょくいん》を呼《よ》ぶとき、使《つか》います。私《わたし》は外《そと》にいます。排泄《はいせつ》が終《お》わったら、（　　　）。',
   pi:'Perawat: Bisa duduk di dudukan toilet sendiri?\nTuan Sato: Ya, tidak apa-apa. Tombol ini apa?\nPerawat: Itu tombol panggil. Dipakai saat memanggil staf. Saya ada di luar. Kalau sudah selesai buang air, (     ).',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['ボタンを押《お》して、知《し》らせてください','ボタンを押《お》して、ドアを開《あ》けてください','ボタンを押《お》して、ドアを閉《し》めてください','ボタンを押《お》して、水《みず》を出《だ》してください'],
   oi:['Tekan tombol dan beri tahu saya','Tekan tombol dan buka pintunya','Tekan tombol dan tutup pintunya','Tekan tombol dan keluarkan airnya'],
   e:'呼《よ》び出《だ》しボタンは職員《しょくいん》を呼《よ》ぶためのもの。終《お》わったら押《お》して知《し》らせてもらう。',
   ei:'Tombol panggil adalah untuk memanggil staf. Setelah selesai, minta ia menekannya untuk memberi tahu.'});
  T({id:'pk18',c:'kaiwa',
   p:'鈴木《すずき》さん：きょうは寒《さむ》いね。セーターを着《き》よう。\n介護職《かいごしょく》：わかりました。どのセーターを着《き》ますか。\n鈴木《すずき》さん：その黒《くろ》いセーターがいいね。\n介護職《かいごしょく》：きのう、奥《おく》さんが持《も》って来《き》たセーターですね。\n鈴木《すずき》さん：うん、誕生日《たんじょうび》に娘《むすめ》がくれたんだよ。\n介護職《かいごしょく》：そうですか。いいですね。',
   pi:'Tuan Suzuki: Hari ini dingin, ya. Saya pakai sweter.\nPerawat: Baik. Sweter yang mana?\nTuan Suzuki: Sweter hitam itu bagus.\nPerawat: Itu sweter yang dibawa istri Anda kemarin, ya.\nTuan Suzuki: Ya, putri saya memberikannya saat ulang tahun.\nPerawat: Begitu ya. Bagus sekali.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['鈴木《すずき》さんは、きょう黒《くろ》いセーターを着《き》ます','鈴木《すずき》さんは、奥《おく》さんにセーターをもらいました','介護職《かいごしょく》は、鈴木《すずき》さんがきょう着《き》るセーターを選《えら》びました','きのう、娘《むすめ》さんがセーターを持《も》って来《き》ました'],
   oi:['Hari ini Tuan Suzuki memakai sweter hitam','Tuan Suzuki menerima sweter dari istrinya','Perawat memilih sweter yang dipakai Tuan Suzuki hari ini','Kemarin putrinya membawa sweter'],
   e:'鈴木《すずき》さんが自分《じぶん》で「黒《くろ》いセーターがいい」と選《えら》んだ。セーターをくれたのは娘《むすめ》さん、持《も》って来《き》たのは奥《おく》さん。',
   ei:'Tuan Suzuki sendiri memilih "sweter hitam". Yang memberi sweter adalah putrinya, yang membawanya adalah istrinya.'});
  T({id:'pk19',c:'kaiwa',
   p:'佐藤《さとう》さん：歯《は》をみがいたけれど、きちんとできたか見《み》てください。\n介護職《かいごしょく》：はい、わかりました。口《くち》を開《あ》けてください。左側《ひだりがわ》に食《た》べ物《もの》が残《のこ》っていますよ。\n佐藤《さとう》さん：すみませんが、取《と》ってください。\n介護職《かいごしょく》：はい、じゃ、取《と》りますね。きれいになりましたよ。',
   pi:'Tuan Sato: Saya sudah sikat gigi, tolong lihat apakah sudah bersih.\nPerawat: Baik. Silakan buka mulut. Ada sisa makanan di sebelah kiri.\nTuan Sato: Maaf, tolong ambilkan.\nPerawat: Baik, saya ambil ya. Sudah bersih.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['介護職《かいごしょく》が、佐藤《さとう》さんの口《くち》の中《なか》に残《のこ》った食《た》べ物《もの》を取《と》りました','佐藤《さとう》さんは、歯《は》みがきをしませんでした','佐藤《さとう》さんは、きちんと歯《は》みがきができました','佐藤《さとう》さんが、自分《じぶん》で口《くち》の中《なか》に残《のこ》った食《た》べ物《もの》を取《と》りました'],
   oi:['Perawat mengambil sisa makanan di mulut Tuan Sato','Tuan Sato tidak sikat gigi','Tuan Sato sikat gigi dengan bersih','Tuan Sato mengambil sendiri sisa makanan di mulutnya'],
   e:'佐藤《さとう》さんが「取《と》ってください」と頼《たの》み、介護職《かいごしょく》が「取《と》りますね」と言《い》って取《と》った。',
   ei:'Tuan Sato meminta "tolong ambilkan" dan perawat berkata "saya ambil ya" lalu mengambilnya.'});
  T({id:'pk20',c:'kaiwa',
   p:'佐藤《さとう》さん：きょうは、歯《は》みがきをやめておきます。歯《は》が痛《いた》いんです。\n介護職《かいごしょく》：歯《は》が痛《いた》いんですか。いつからですか。\n佐藤《さとう》さん：夜中《よなか》から痛《いた》くて、よく眠《ねむ》れませんでした。\n介護職《かいごしょく》：それはいけませんね。歯医者《はいしゃ》さんに診《み》てもらいますか。\n佐藤《さとう》さん：はい。\n介護職《かいごしょく》：じゃ、予約《よやく》しますね。看護職《かんごしょく》にも連絡《れんらく》します。',
   pi:'Tuan Sato: Hari ini saya tidak sikat gigi dulu. Gigi saya sakit.\nPerawat: Gigi Anda sakit? Sejak kapan?\nTuan Sato: Sakit sejak tengah malam, jadi tidak bisa tidur nyenyak.\nPerawat: Wah, tidak baik itu. Mau diperiksa dokter gigi?\nTuan Sato: Ya.\nPerawat: Kalau begitu, saya buat janji, ya. Saya juga hubungi perawat (kangoshoku).',
   q:'佐藤《さとう》さんは、どうして歯《は》みがきをしませんか。', qi:'Mengapa Tuan Sato tidak sikat gigi?',
   o:['歯《は》が痛《いた》いから','歯医者《はいしゃ》さんに診《み》てもらうから','歯医者《はいしゃ》さんを予約《よやく》するから','よく眠《ねむ》れなかったから'],
   oi:['Karena giginya sakit','Karena akan diperiksa dokter gigi','Karena akan membuat janji dengan dokter gigi','Karena tidak bisa tidur nyenyak'],
   e:'佐藤《さとう》さんは「歯《は》みがきをやめておきます。歯《は》が痛《いた》いんです」と言《い》った。「〜んです」は理由《りゆう》を説明《せつめい》する言《い》い方《かた》。',
   ei:'Tuan Sato berkata "saya tidak sikat gigi dulu. Gigi saya sakit." Bentuk "~n desu" dipakai untuk menjelaskan alasan.'});
  T({id:'pk21',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、歯《は》みがきは終《お》わりましたか。\n佐藤《さとう》さん：みがいたけれど、きれいになったかどうか見《み》てほしいです。\n介護職《かいごしょく》：はい、わかりました。口《くち》を開《あ》けてください。左側《ひだりがわ》に食《た》べ物《もの》が残《のこ》っていますよ。\n佐藤《さとう》さん：すみません。取《と》ってください。\n介護職《かいごしょく》：（　　　）。',
   pi:'Perawat: Tuan Sato, sudah selesai sikat gigi?\nTuan Sato: Sudah, tetapi saya ingin dilihat apakah sudah bersih.\nPerawat: Baik. Silakan buka mulut. Ada sisa makanan di sebelah kiri.\nTuan Sato: Maaf. Tolong ambilkan.\nPerawat: (     ).',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['はい、わかりました','うがいをしましょう','歯《は》ブラシを取《と》り替《か》えましょうか','右側《みぎがわ》はきれいですよ'],
   oi:['Ya, baik','Mari berkumur','Mau ganti sikat gigi?','Sebelah kanan sudah bersih'],
   e:'佐藤《さとう》さんは「取《と》ってください」と頼《たの》んだので、「はい、わかりました」と引《ひ》き受《う》ける返事《へんじ》が合《あ》う。',
   ei:'Tuan Sato meminta "tolong ambilkan", jadi jawaban yang cocok adalah menyanggupi: "ya, baik".'});
  T({id:'pk22',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、お風呂《ふろ》に入《はい》りましょうか。\n佐藤《さとう》さん：きょうは、お風呂《ふろ》に入《はい》りたくないです。\n介護職《かいごしょく》：どうしましたか。ご気分《きぶん》が悪《わる》いですか。\n佐藤《さとう》さん：気分《きぶん》は悪《わる》くないけど、ちょっと腰《こし》が痛《いた》いです。服《ふく》を脱《ぬ》ぐのが大変《たいへん》です。\n介護職《かいごしょく》：着替《きが》えを手伝《てつだ》いますから、お風呂《ふろ》に入《はい》りませんか。気持《きも》ちがいいですよ。\n佐藤《さとう》さん：そうですね。じゃ、入《はい》ります。\n介護職《かいごしょく》：あしたも腰《こし》が痛《いた》かったら、病院《びょういん》を予約《よやく》しましょうか。\n佐藤《さとう》さん：そうですね。',
   pi:'Perawat: Tuan Sato, mari mandi.\nTuan Sato: Hari ini saya tidak ingin mandi.\nPerawat: Ada apa? Apakah Anda merasa tidak enak badan?\nTuan Sato: Tidak tidak enak badan, tetapi pinggang saya agak sakit. Melepas baju itu berat.\nPerawat: Saya bantu ganti bajunya, jadi bagaimana kalau mandi? Rasanya enak lho.\nTuan Sato: Benar juga. Kalau begitu, saya mandi.\nPerawat: Kalau besok pinggang masih sakit, mau saya buatkan janji ke rumah sakit?\nTuan Sato: Baiklah.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、これからお風呂《ふろ》に入《はい》ります','佐藤《さとう》さんは、きょう気分《きぶん》が悪《わる》いです','佐藤《さとう》さんは、これから病院《びょういん》へ行《い》きます','佐藤《さとう》さんは、自分《じぶん》で服《ふく》を脱《ぬ》ぎます'],
   oi:['Tuan Sato akan mandi sekarang','Hari ini Tuan Sato merasa tidak enak badan','Tuan Sato akan pergi ke rumah sakit sekarang','Tuan Sato melepas bajunya sendiri'],
   e:'最後《さいご》に佐藤《さとう》さんは「じゃ、入《はい》ります」と言《い》った。気分《きぶん》は悪《わる》くない。病院《びょういん》は、あしたも痛《いた》かったら。着替《きが》えは介護職《かいごしょく》が手伝《てつだ》う。',
   ei:'Akhirnya Tuan Sato berkata "kalau begitu, saya mandi". Ia tidak merasa tidak enak badan. Rumah sakit hanya jika besok masih sakit. Ganti baju dibantu perawat.'});
  T({id:'pk23',c:'kaiwa',
   p:'介護職《かいごしょく》：鈴木《すずき》さん、体調《たいちょう》はいかがですか。\n鈴木《すずき》さん：まだ、背中《せなか》がかゆいよ。\n介護職《かいごしょく》：ちょっと見《み》てもいいですか。きのうより赤《あか》いですね。あとで、看護職《かんごしょく》に見《み》てもらいましょう。きょうも、体《からだ》をふきましょうか。\n鈴木《すずき》さん：いやだよ。お風呂《ふろ》に入《はい》りたいよ。\n介護職《かいごしょく》：そうですか。看護職《かんごしょく》に聞《き》いてみますね。',
   pi:'Perawat: Tuan Suzuki, bagaimana kondisi Anda?\nTuan Suzuki: Punggung saya masih gatal.\nPerawat: Boleh saya lihat sebentar? Lebih merah daripada kemarin, ya. Nanti kita minta perawat (kangoshoku) memeriksanya. Hari ini juga diseka badannya saja?\nTuan Suzuki: Tidak mau. Saya ingin mandi berendam.\nPerawat: Begitu ya. Saya tanyakan ke perawat (kangoshoku), ya.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['鈴木《すずき》さんの背中《せなか》は、きのうより、きょうのほうが赤《あか》いです','鈴木《すずき》さんは、背中《せなか》が痛《いた》いです','鈴木《すずき》さんは、お風呂《ふろ》に入《はい》れないので、体《からだ》をふきます','鈴木《すずき》さんは、きょう、お風呂《ふろ》に入《はい》ります'],
   oi:['Punggung Tuan Suzuki hari ini lebih merah daripada kemarin','Punggung Tuan Suzuki sakit','Karena tidak bisa mandi berendam, badan Tuan Suzuki diseka','Hari ini Tuan Suzuki mandi berendam'],
   e:'介護職《かいごしょく》が「きのうより赤《あか》いですね」と言《い》った。背中《せなか》は痛《いた》いではなく、かゆい。お風呂《ふろ》に入《はい》るかどうかは、まだ決《き》まっていない（看護職《かんごしょく》に聞《き》く）。',
   ei:'Perawat berkata "lebih merah daripada kemarin". Punggungnya gatal, bukan sakit. Apakah ia mandi atau tidak belum diputuskan (akan ditanyakan ke perawat).'});
  T({id:'pk24',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、きょうは入浴《にゅうよく》の日《ひ》です。\n佐藤《さとう》さん：きのうは、少《すこ》しせきが出《で》ました。でも、きょうは大丈夫《だいじょうぶ》です。先週《せんしゅう》から髪《かみ》を洗《あら》っていないので、頭《あたま》がかゆいです。\n介護職《かいごしょく》：わかりました。きょうは、髪《かみ》をしっかり洗《あら》いましょう。じゃ、行《い》きましょう。',
   pi:'Perawat: Tuan Sato, hari ini hari mandi.\nTuan Sato: Kemarin saya agak batuk. Tapi hari ini tidak apa-apa. Sejak minggu lalu belum keramas, jadi kepala saya gatal.\nPerawat: Baik. Hari ini mari keramas dengan bersih. Ayo kita pergi.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、きょう、髪《かみ》を洗《あら》います','佐藤《さとう》さんは、きょう、体調《たいちょう》が悪《わる》いです','佐藤《さとう》さんは、きょう、せきが出《で》ています','佐藤《さとう》さんは、きのう、髪《かみ》を洗《あら》いました'],
   oi:['Hari ini Tuan Sato keramas','Hari ini kondisi Tuan Sato buruk','Hari ini Tuan Sato batuk','Kemarin Tuan Sato keramas'],
   e:'介護職《かいごしょく》が「きょうは、髪《かみ》をしっかり洗《あら》いましょう」と言《い》った。せきはきのう。髪《かみ》は先週《せんしゅう》から洗《あら》っていない。',
   ei:'Perawat berkata "hari ini mari keramas dengan bersih". Batuknya kemarin. Sejak minggu lalu belum keramas.'});
  T({id:'pk25',c:'kaiwa',
   p:'介護職《かいごしょく》：お湯《ゆ》の温度《おんど》はいかがですか。\n鈴木《すずき》さん：ちょっとぬるいよ。もっと熱《あつ》いお湯《ゆ》のほうがいいよ。\n介護職《かいごしょく》：（　　　）。\n鈴木《すずき》さん：ちょうどいい温度《おんど》になったよ。ありがとう。',
   pi:'Perawat: Bagaimana suhu airnya?\nTuan Suzuki: Agak suam-suam kuku. Lebih baik air yang lebih panas.\nPerawat: (     ).\nTuan Suzuki: Sekarang suhunya pas. Terima kasih.',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['少《すこ》し熱《あつ》くしますね','ちょうどいい温度《おんど》でよかったです','少《すこ》し熱《あつ》いですか。ちょっとぬるくしますね','もう少《すこ》しお風呂《ふろ》に入《はい》りたいですか'],
   oi:['Saya buat sedikit lebih panas, ya','Syukurlah suhunya pas','Agak panas? Saya buat sedikit lebih suam, ya','Mau berendam sedikit lebih lama?'],
   e:'鈴木《すずき》さんは「ぬるい。もっと熱《あつ》いほうがいい」と言《い》ったので、「少《すこ》し熱《あつ》くしますね」が合《あ》う。',
   ei:'Tuan Suzuki berkata "suam-suam kuku, lebih baik lebih panas", jadi yang cocok adalah "saya buat sedikit lebih panas".'});
  T({id:'pk33',c:'kaiwa',
   p:'山田《やまだ》さんはトイレで排泄《はいせつ》が終《お》わりました。でも、うまく立《た》てません。あなたは山田《やまだ》さんに声《こえ》をかけます。',
   pi:'Tuan Yamada sudah selesai buang air di toilet. Namun, ia tidak bisa berdiri dengan baik. Anda akan menyapa Tuan Yamada.',
   q:'何《なん》と言《い》いますか。いちばんいいものを選《えら》んでください。', qi:'Apa yang Anda katakan? Pilih yang terbaik.',
   o:['「手《て》すりをにぎって、立《た》ってみましょうか」','「がんばって、自分《じぶん》で立《た》ってみてください」','「すみませんが、自分《じぶん》だけで立《た》ってください」','「手《て》すりをにぎれば、自分《じぶん》で立《た》てると思《おも》います」'],
   oi:['"Mari coba berdiri sambil memegang pegangan."','"Ayo berusaha, coba berdiri sendiri."','"Maaf, tolong berdiri sendiri saja."','"Kalau memegang pegangan, saya rasa Anda bisa berdiri sendiri."'],
   e:'具体的《ぐたいてき》な方法《ほうほう》（手《て》すりをにぎる）をやさしく提案《ていあん》し、いっしょに立《た》つ声《こえ》かけがいちばん良《よ》い。「がんばって」「自分《じぶん》だけで」は突《つ》き放《はな》した言《い》い方《かた》。',
   ei:'Sapaan terbaik adalah dengan lembut mengusulkan cara yang konkret (memegang pegangan) dan berdiri bersama. "Ayo berusaha" atau "sendiri saja" terdengar tidak peduli.'});
  T({id:'pk43',c:'kaiwa',
   p:'（ナースコールが鳴《な》っている）\n鈴木《すずき》：エレンさん、ナースコールに出《で》てください！\nエレン：はい。\n（ナースコールに出《で》る）\nエレン：野村《のむら》さん、どうしましたか。\n野村《のむら》：ちょっと気分《きぶん》が悪《わる》いんですが。\nエレン：（　　　）\n鈴木《すずき》：わかりました。お願《ねが》いします。',
   pi:'(Nurse call berbunyi)\nSuzuki: Ellen, tolong jawab nurse call-nya!\nEllen: Baik.\n(Menjawab nurse call)\nEllen: Tuan Nomura, ada apa?\nNomura: Saya merasa agak tidak enak badan.\nEllen: (     )\nSuzuki: Baik. Tolong, ya.',
   q:'（　　　）の中《なか》に入《はい》る正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar untuk masuk ke dalam (     ).',
   o:['わかりました、今《いま》行《い》きます。鈴木《すずき》さん、野村《のむら》さんが気分《きぶん》が悪《わる》いと言《い》っています。ちょっと部屋《へや》へ行《い》ってきます','わかりました、今《いま》行《い》きます。鈴木《すずき》さん、野村《のむら》さんが熱《ねつ》があると言《い》っています。ちょっと部屋《へや》へ行《い》ってきます','わかりました、今《いま》行《い》きます。鈴木《すずき》さん、野村《のむら》さんがケーキがほしいと言《い》っています。ちょっと部屋《へや》へ行《い》ってきます','わかりました、今《いま》行《い》きます。鈴木《すずき》さん、野村《のむら》さんが気分《きぶん》が悪《わる》いと言《い》っています。今《いま》からパーティーへ行《い》きます'],
   oi:['Baik, saya segera ke sana. Bu Suzuki, Tuan Nomura bilang merasa tidak enak badan. Saya ke kamarnya sebentar','Baik, saya segera ke sana. Bu Suzuki, Tuan Nomura bilang demam. Saya ke kamarnya sebentar','Baik, saya segera ke sana. Bu Suzuki, Tuan Nomura bilang ingin kue. Saya ke kamarnya sebentar','Baik, saya segera ke sana. Bu Suzuki, Tuan Nomura bilang merasa tidak enak badan. Sekarang saya pergi ke pesta'],
   e:'野村《のむら》さんは「気分《きぶん》が悪《わる》い」と言《い》った。それを正確《せいかく》にリーダーに伝《つた》えて、部屋《へや》へ行《い》く。熱《ねつ》があるとは言《い》っていない。',
   ei:'Tuan Nomura berkata "merasa tidak enak badan". Sampaikan itu dengan tepat kepada pemimpin, lalu pergi ke kamarnya. Ia tidak berkata demam.'});
  T({id:'pk48',c:'kaiwa',
   p:'介護職《かいごしょく》：あまり食《た》べていませんね。\n佐藤《さとう》さん：手《て》が少《すこ》し痛《いた》くて、はしがうまく持《も》てません。\n介護職《かいごしょく》：手《て》が痛《いた》いんですね。両手《りょうて》ですか。お手伝《てつだ》いしましょうか。\n佐藤《さとう》さん：すみませんが、お願《ねが》いします。\n介護職《かいごしょく》：わかりました。',
   pi:'Perawat: Anda tidak banyak makan, ya.\nTuan Sato: Tangan saya agak sakit, jadi tidak bisa memegang sumpit dengan baik.\nPerawat: Tangan Anda sakit, ya. Kedua tangan? Mau saya bantu?\nTuan Sato: Maaf, tolong ya.\nPerawat: Baik.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、介護職《かいごしょく》に手伝《てつだ》ってもらって、ご飯《はん》を食《た》べます','佐藤《さとう》さんは、ご飯《はん》を全部《ぜんぶ》食《た》べました','佐藤《さとう》さんは、左手《ひだりて》ではしを持《も》ちます','佐藤《さとう》さんは、自分《じぶん》でご飯《はん》を食《た》べます'],
   oi:['Tuan Sato makan dengan dibantu perawat','Tuan Sato makan semuanya','Tuan Sato memegang sumpit dengan tangan kiri','Tuan Sato makan sendiri'],
   e:'「お手伝《てつだ》いしましょうか」に佐藤《さとう》さんは「お願《ねが》いします」と答《こた》えた＝手伝《てつだ》ってもらう。',
   ei:'Untuk "mau saya bantu?", Tuan Sato menjawab "tolong ya" = ia dibantu.'});
  T({id:'pk63',c:'kaiwa',
   p:'（ナースコールが鳴《な》っている）\n鈴木《すずき》：ニコさん、ナースコールに出《で》てください！\nニコ：はい。\n（ナースコールに出《で》る）\nニコ：木村《きむら》さん、どうしましたか。\n木村《きむら》：あの、りんごが食《た》べたいんですが、ここに来《き》て、りんごをむいてもらえますか。\nニコ：（　　　）\n鈴木《すずき》：わかりました。お願《ねが》いします。',
   pi:'(Nurse call berbunyi)\nSuzuki: Niko, tolong jawab nurse call-nya!\nNiko: Baik.\n(Menjawab nurse call)\nNiko: Tuan Kimura, ada apa?\nKimura: Anu, saya ingin makan apel. Bisakah Anda datang ke sini dan mengupaskan apelnya?\nNiko: (     )\nSuzuki: Baik. Tolong, ya.',
   q:'（　　　）の中《なか》に入《はい》る正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar untuk masuk ke dalam (     ).',
   o:['わかりました、今《いま》行《い》きます。鈴木《すずき》さん、木村《きむら》さんがりんごがほしいと言《い》っています。ちょっと部屋《へや》へ行《い》ってきます','わかりました、今《いま》行《い》きます。鈴木《すずき》さん、木村《きむら》さんがりんごがあると言《い》っています。ちょっと部屋《へや》へ行《い》ってきます','わかりました、今《いま》行《い》きます。鈴木《すずき》さん、木村《きむら》さんがりんごが悪《わる》いと言《い》っています。ちょっと部屋《へや》へ行《い》ってきます','わかりました、今《いま》行《い》きます。鈴木《すずき》さん、木村《きむら》さんが気分《きぶん》が悪《わる》いと言《い》っています。今《いま》からパーティーへ行《い》きます'],
   oi:['Baik, saya segera ke sana. Bu Suzuki, Tuan Kimura bilang ingin apel. Saya ke kamarnya sebentar','Baik, saya segera ke sana. Bu Suzuki, Tuan Kimura bilang ada apel. Saya ke kamarnya sebentar','Baik, saya segera ke sana. Bu Suzuki, Tuan Kimura bilang apelnya busuk. Saya ke kamarnya sebentar','Baik, saya segera ke sana. Bu Suzuki, Tuan Kimura bilang tidak enak badan. Sekarang saya pergi ke pesta'],
   e:'木村《きむら》さんは「りんごが食《た》べたい」と言《い》った＝りんごがほしい。正確《せいかく》に伝《つた》えて、部屋《へや》へ行《い》く。',
   ei:'Tuan Kimura berkata "saya ingin makan apel" = ingin apel. Sampaikan dengan tepat, lalu pergi ke kamarnya.'});
  T({id:'pk64',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さん、歯《は》みがきは終《お》わりましたか。\n佐藤《さとう》さん：みがいたけれど、きれいになったかどうか見《み》てほしいです。\n介護職《かいごしょく》：はい、わかりました。（口《くち》の中《なか》を見《み》る）（　　　）。\n佐藤《さとう》さん：ありがとうございました。',
   pi:'Perawat: Tuan Sato, sudah selesai sikat gigi?\nTuan Sato: Sudah, tetapi saya ingin dilihat apakah sudah bersih.\nPerawat: Baik. (Melihat ke dalam mulut) (     ).\nTuan Sato: Terima kasih.',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['きれいになっていますよ','うがいをしましょう','歯《は》ブラシを取《と》り替《か》えましょうか','あとにしましょう'],
   oi:['Sudah bersih, kok','Mari berkumur','Mau ganti sikat gigi?','Nanti saja'],
   e:'佐藤《さとう》さんは「きれいになったか見《み》てほしい」と頼《たの》み、最後《さいご》に「ありがとう」と言《い》った。口《くち》の中《なか》を見《み》て結果《けっか》を伝《つた》える返事《へんじ》が合《あ》う。',
   ei:'Tuan Sato meminta "lihat apakah sudah bersih" dan akhirnya berkata "terima kasih". Jawaban yang cocok adalah menyampaikan hasil setelah melihat mulutnya.'});
  T({id:'pk65',c:'kaiwa',
   p:'介護職《かいごしょく》：お湯《ゆ》の温度《おんど》はいかがですか。\n鈴木《すずき》さん：ちょっと熱《あつ》すぎると思《おも》うよ。もっとぬるいお湯《ゆ》のほうがいいよ。\n介護職《かいごしょく》：（　　　）。\n鈴木《すずき》さん：ちょうどいい温度《おんど》になったよ。ありがとう。',
   pi:'Perawat: Bagaimana suhu airnya?\nTuan Suzuki: Saya rasa terlalu panas. Lebih baik air yang lebih suam.\nPerawat: (     ).\nTuan Suzuki: Sekarang suhunya pas. Terima kasih.',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['少《すこ》し熱《あつ》いですか。ちょっとぬるくしますね','ちょうどいい温度《おんど》でよかったです','もう少《すこ》しお風呂《ふろ》に入《はい》りたいですか','少《すこ》し熱《あつ》くしますね'],
   oi:['Agak panas? Saya buat sedikit lebih suam, ya','Syukurlah suhunya pas','Mau berendam sedikit lebih lama?','Saya buat sedikit lebih panas, ya'],
   e:'鈴木《すずき》さんは「熱《あつ》すぎる。もっとぬるいほうがいい」と言《い》ったので、「ぬるくしますね」が合《あ》う。',
   ei:'Tuan Suzuki berkata "terlalu panas, lebih baik lebih suam", jadi yang cocok adalah "saya buat lebih suam".'});
  T({id:'pk67',c:'kaiwa',
   p:'エレン：高橋《たかはし》さん、きょうはポータブルトイレを使《つか》ってみませんか。\n高橋《たかはし》：そうね。\nエレン：では、（　　　）。\n高橋《たかはし》：はい。\nエレン：ズボンを下《お》ろしますね。ゆっくり座《すわ》ってくださいね。終《お》わるころに、また来《き》ますね。',
   pi:'Ellen: Nyonya Takahashi, hari ini mau mencoba memakai toilet portabel?\nTakahashi: Boleh juga.\nEllen: Kalau begitu, (     ).\nTakahashi: Ya.\nEllen: Saya turunkan celananya, ya. Silakan duduk pelan-pelan. Nanti saat hampir selesai saya datang lagi, ya.',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['ポータブルトイレに移《うつ》りましょうね','がまんしてください','失禁《しっきん》してはいけませんね','明日《あした》からにしましょう'],
   oi:['Mari pindah ke toilet portabel, ya','Tolong ditahan','Tidak boleh mengompol, ya','Mulai besok saja'],
   e:'高橋《たかはし》さんが「そうね」と同意《どうい》したので、ポータブルトイレに移《うつ》る声《こえ》かけが合《あ》う。「がまん」「失禁《しっきん》してはいけない」は不適切《ふてきせつ》。',
   ei:'Karena Nyonya Takahashi setuju, sapaan untuk pindah ke toilet portabel yang cocok. "Tahan" atau "tidak boleh mengompol" tidak pantas.'});
  T({id:'pk78',c:'kaiwa',
   p:'鈴木《すずき》さん：きょうは寒《さむ》いね。セーターを着《き》よう。\n介護職《かいごしょく》：わかりました。どのセーターを着《き》ますか。\n鈴木《すずき》さん：あなたが選《えら》んでください。\n介護職《かいごしょく》：はい、じゃ、これにしましょうか。\n鈴木《すずき》さん：ああ、私《わたし》もこの赤《あか》いセーターが好《す》きです。\n介護職《かいごしょく》：それはよかったです。',
   pi:'Tuan Suzuki: Hari ini dingin, ya. Saya pakai sweter.\nPerawat: Baik. Sweter yang mana?\nTuan Suzuki: Tolong Anda yang pilih.\nPerawat: Baik, bagaimana kalau yang ini?\nTuan Suzuki: Oh, saya juga suka sweter merah ini.\nPerawat: Syukurlah.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['介護職《かいごしょく》は、鈴木《すずき》さんがきょう着《き》るセーターを選《えら》びました','鈴木《すずき》さんは、赤《あか》いセーターをもらいました','鈴木《すずき》さんは、きょう黒《くろ》いセーターを着《き》ます','きのう、娘《むすめ》さんがセーターを持《も》って来《き》ました'],
   oi:['Perawat memilih sweter yang dipakai Tuan Suzuki hari ini','Tuan Suzuki menerima sweter merah','Hari ini Tuan Suzuki memakai sweter hitam','Kemarin putrinya membawa sweter'],
   e:'鈴木《すずき》さんが「あなたが選《えら》んでください」と言《い》い、介護職《かいごしょく》が赤《あか》いセーターを選《えら》んだ。',
   ei:'Tuan Suzuki berkata "tolong Anda yang pilih", dan perawat memilih sweter merah.'});
  T({id:'pk79',c:'kaiwa',
   p:'介護職《かいごしょく》：あまり食《た》べていませんね。\n佐藤《さとう》さん：ええ……。\n介護職《かいごしょく》：どうしましたか。\n佐藤《さとう》さん：歯《は》が痛《いた》くて、このとうふもかむことができません。\n介護職《かいごしょく》：そうですか。あとで歯医者《はいしゃ》さんに診《み》てもらって、食事《しょくじ》をもっとやわらかいものに変《か》えましょうか。\n佐藤《さとう》さん：はい、お願《ねが》いします。ゼリーなら食《た》べられると思《おも》います。',
   pi:'Perawat: Anda tidak banyak makan, ya.\nTuan Sato: Iya...\nPerawat: Ada apa?\nTuan Sato: Gigi saya sakit, tahu ini pun tidak bisa saya kunyah.\nPerawat: Begitu ya. Nanti kita periksakan ke dokter gigi, dan makanannya kita ganti dengan yang lebih lembut, bagaimana?\nTuan Sato: Ya, tolong. Kalau jeli, saya rasa bisa dimakan.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['佐藤《さとう》さんは、歯《は》が痛《いた》いです','佐藤《さとう》さんは、ご飯《はん》がおいしくないと言《い》いました','佐藤《さとう》さんは、とうふがきらいです','佐藤《さとう》さんは、介護職《かいごしょく》に手伝《てつだ》ってもらって、ご飯《はん》を食《た》べます'],
   oi:['Gigi Tuan Sato sakit','Tuan Sato berkata makanannya tidak enak','Tuan Sato tidak suka tahu','Tuan Sato makan dengan dibantu perawat'],
   e:'佐藤《さとう》さんは「歯《は》が痛《いた》くて、かむことができません」と言《い》った。とうふがきらいなのではなく、かめない。',
   ei:'Tuan Sato berkata "gigi saya sakit, tidak bisa mengunyah". Bukan karena tidak suka tahu, tetapi tidak bisa mengunyah.'});
  T({id:'pk81',c:'kaiwa',
   p:'介護職《かいごしょく》：佐藤《さとう》さんは、あまり食《た》べていませんね。\n佐藤《さとう》さん：おいしくないんです。\n介護職《かいごしょく》：そうですか。佐藤《さとう》さんは料理《りょうり》が上手《じょうず》でしたね。明日《あした》の昼《ひる》ご飯《はん》をいっしょに作《つく》りましょうか。\n佐藤《さとう》さん：うれしい。私《わたし》は魚《さかな》の煮付《につ》けがとても上手《じょうず》です。みそ汁《しる》も作《つく》りましょう。\n介護職《かいごしょく》：そうですね。私《わたし》も楽《たの》しみです。',
   pi:'Perawat: Tuan Sato tidak banyak makan, ya.\nTuan Sato: Tidak enak.\nPerawat: Begitu ya. Tuan Sato pandai memasak, kan. Bagaimana kalau besok kita masak makan siang bersama?\nTuan Sato: Senangnya. Saya sangat pandai membuat ikan rebus kecap. Kita buat sup miso juga.\nPerawat: Baik. Saya juga menantikannya.',
   q:'会話《かいわ》の内容《ないよう》で、正《ただ》しいものを選《えら》んでください。', qi:'Pilih yang benar sesuai isi percakapan.',
   o:['あしたの昼《ひる》ご飯《はん》は、魚《さかな》の煮付《につ》けを作《つく》ります','あしたの昼《ひる》ご飯《はん》は、みそ汁《しる》を買《か》います','あしたの昼《ひる》ご飯《はん》は、佐藤《さとう》さんが一人《ひとり》で作《つく》ります','あしたの昼《ひる》ご飯《はん》は、介護職《かいごしょく》が作《つく》ります'],
   oi:['Besok makan siang membuat ikan rebus kecap','Besok makan siang membeli sup miso','Besok makan siang dibuat Tuan Sato sendiri','Besok makan siang dibuat oleh perawat'],
   e:'佐藤《さとう》さんが「魚《さかな》の煮付《につ》けがとても上手《じょうず》」と言《い》い、いっしょに作《つく》ることになった。みそ汁《しる》も「作《つく》る」（買《か》うではない）。',
   ei:'Tuan Sato berkata "sangat pandai membuat ikan rebus kecap" dan mereka akan memasak bersama. Sup miso juga "dibuat" (bukan dibeli).'});
  T({id:'pk97',c:'kaiwa',
   p:'アル：体《からだ》と髪《かみ》と、どちらを先《さき》に洗《あら》いますか。\n小林《こばやし》さん：髪《かみ》から洗《あら》おうかな。\nアル：では、髪《かみ》を洗《あら》いますね。お湯《ゆ》をかけますね。熱《あつ》くありませんか。\n小林《こばやし》さん：うん。大丈夫《だいじょうぶ》。\nアル：シャンプーをつけますね。ご自分《じぶん》で洗《あら》えますか。\n小林《こばやし》さん：うん。\nアル：シャンプーを流《なが》しますね。（　　　）。\n小林《こばやし》さん：うん。\nアル：お湯《ゆ》をかけますね。はい、終《お》わりましたよ。',
   pi:'Al: Mau mencuci badan atau rambut lebih dulu?\nTuan Kobayashi: Rambut dulu, deh.\nAl: Baik, saya cuci rambutnya, ya. Saya siram airnya. Tidak panas?\nTuan Kobayashi: Tidak. Tidak apa-apa.\nAl: Saya beri sampo, ya. Bisa mencuci sendiri?\nTuan Kobayashi: Ya.\nAl: Saya bilas samponya, ya. (     ).\nTuan Kobayashi: Ya.\nAl: Saya siram airnya. Nah, sudah selesai.',
   q:'（　　　）の中《なか》に入《はい》ることばを選《えら》んでください。', qi:'Pilih kata yang masuk ke dalam (     ).',
   o:['耳《みみ》をおさえてください','やっぱり、やめましょうか','シャンプーのにおいがしますか','シャンプーを変《か》えましょうか'],

 ei:'Dengan oksigen api mudah menyala, jadi api dilarang keras. Pencegahan infeksi juga penting. Siapkan baterai cadangan untuk saat listrik padam.'},
{id:'kt13',c:'kokoro',t:'mc',
 q:'ストーマ（人工肛門《じんこうこうもん》など）の周《まわ》りの皮膚《ひふ》が赤《あか》くただれていた。最《もっと》も適切《てきせつ》な対応《たいおう》を1つ選《えら》びなさい。',
 qi:'Kulit di sekitar stoma (anus buatan, dll.) merah dan lecet. Pilih penanganan yang paling tepat.',
 o:['医療職《いりょうしょく》に報告《ほうこく》する','介護職《かいごしょく》が自分《じぶん》の判断《はんだん》で薬《くすり》をぬる','そのままにして様子《ようす》を見《み》る','パウチを外《はず》したままにする'],
 oi:['Melapor ke tenaga medis','Perawat mengoleskan obat atas penilaian sendiri','Dibiarkan dan diamati','Membiarkan kantong (pouch) terlepas'],
 a:0,
 e:'介護職《かいごしょく》はパウチ（袋《ふくろ》）にたまった排泄物《はいせつぶつ》を処理《しょり》する。ストーマの周《まわ》りが赤《あか》くただれていたら、医療職《いりょうしょく》に報告《ほうこく》する。',
 ei:'Perawat menangani kotoran yang terkumpul di kantong (pouch). Jika sekitar stoma merah dan lecet, laporkan ke tenaga medis.'},
{id:'kt14',c:'kokoro',t:'mc',
 q:'2型糖尿病《とうにょうびょう》の説明《せつめい》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih penjelasan yang paling tepat tentang diabetes tipe 2.',
 o:['高齢者《こうれいしゃ》に多《おお》く、食《た》べすぎや運動不足《うんどうぶそく》などの生活習慣《せいかつしゅうかん》が関係《かんけい》する','子《こ》どもや若《わか》い人《ひと》に多《おお》い','インスリンがまったく出《で》なくなる型《かた》である','人《ひと》から人《ひと》にうつる病気《びょうき》である'],
 oi:['Banyak pada lansia, terkait gaya hidup seperti makan berlebihan dan kurang olahraga','Banyak pada anak-anak dan orang muda','Tipe di mana insulin sama sekali tidak keluar','Penyakit yang menular dari orang ke orang'],
 a:0,
 e:'1型はインスリンが出《で》なくなる型《かた》で若《わか》い人《ひと》に多《おお》い。2型はインスリンが少《すく》なくなる型《かた》で高齢者《こうれいしゃ》に多《おお》い。合併症《がっぺいしょう》は網膜症《もうまくしょう》・腎障害《じんしょうがい》・神経障害《しんけいしょうがい》。',
 ei:'Tipe 1: insulin tidak keluar, banyak pada orang muda. Tipe 2: insulin berkurang, banyak pada lansia. Komplikasinya retinopati, gangguan ginjal, gangguan saraf.'},
{id:'kt15',c:'kokoro',t:'mc',
 q:'骨粗鬆症《こつそしょうしょう》の高齢者《こうれいしゃ》が転倒《てんとう》したとき、骨折《こっせつ》しやすい部位《ぶい》を1つ選《えら》びなさい。',
 qi:'Pilih bagian yang mudah patah saat lansia dengan osteoporosis terjatuh.',
 o:['大腿骨頸部《だいたいこつけいぶ》（太《ふと》ももの付《つ》け根《ね》）','鼻《はな》の骨《ほね》','あごの骨《ほね》','足《あし》の指《ゆび》'],
 oi:['Leher tulang paha (pangkal paha)','Tulang hidung','Tulang rahang','Jari kaki'],
 a:0,
 e:'高齢者《こうれいしゃ》に多《おお》い骨折《こっせつ》は、大腿骨頸部《だいたいこつけいぶ》・脊椎《せきつい》・上腕骨《じょうわんこつ》・橈骨《とうこつ》（手首《てくび》）。転倒予防《てんとうよぼう》のため生活環境《せいかつかんきょう》を整《ととの》える。',
 ei:'Patah tulang yang banyak pada lansia: leher tulang paha, tulang belakang, tulang lengan atas, radius (pergelangan tangan). Tata lingkungan hidup untuk mencegah jatuh.'},
{id:'kt16',c:'kokoro',t:'mc',
 q:'健康《けんこう》な成人《せいじん》の1日の尿量《にょうりょう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih jumlah urine sehari orang dewasa sehat yang paling tepat.',
 o:['1000〜1500mL','100〜200mL','3000mL以上《いじょう》','5000mL以上《いじょう》'],
 oi:['1.000–1.500 mL','100–200 mL','3.000 mL atau lebih','5.000 mL atau lebih'],
 a:0,
 e:'正常《せいじょう》な尿量《にょうりょう》は1日1000〜1500mL、回数《かいすう》は1日4〜6回。2000〜3000mL以上《いじょう》は多尿《たにょう》、300〜500mL以下《いか》は乏尿《ぼうにょう》。',
 ei:'Jumlah urine normal 1.000–1.500 mL sehari, frekuensi 4–6 kali sehari. 2.000–3.000 mL atau lebih = poliuria, 300–500 mL atau kurang = oliguria.'},
{id:'kt17',c:'kokoro',t:'mc',
 q:'膀胱《ぼうこう》に尿《にょう》がどのくらいたまると、尿意《にょうい》（トイレに行《い》きたい感《かん》じ）を感《かん》じるか。1つ選《えら》びなさい。',
 qi:'Berapa banyak urine terkumpul di kandung kemih sampai terasa ingin buang air kecil? Pilih satu.',
 o:['200〜300mLくらい','20〜30mLくらい','1000mLくらい','2000mLくらい'],
 oi:['Sekitar 200–300 mL','Sekitar 20–30 mL','Sekitar 1.000 mL','Sekitar 2.000 mL'],
 a:0,
 e:'膀胱《ぼうこう》の容量《ようりょう》は約《やく》500mLで、200〜300mLくらいたまると尿意《にょうい》を感《かん》じる。',
 ei:'Kapasitas kandung kemih sekitar 500 mL; jika terkumpul sekitar 200–300 mL, terasa ingin buang air kecil.'},
{id:'kt18',c:'kokoro',t:'mc',
 q:'頻尿《ひんにょう》の目安《めやす》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih patokan sering buang air kecil (frekuensi) yang paling tepat.',
 o:['昼間《ひるま》8回以上、夜《よる》2回以上','1日4〜6回','昼間《ひるま》3回だけ','夜《よる》は0回'],
 oi:['Siang 8 kali atau lebih, malam 2 kali atau lebih','4–6 kali sehari','Hanya 3 kali siang hari','Malam 0 kali'],
 a:0,
 e:'昼間《ひるま》8回以上、夜《よる》2回以上は頻尿《ひんにょう》。1日4〜6回は正常《せいじょう》。',
 ei:'Siang 8 kali atau lebih, malam 2 kali atau lebih = sering buang air kecil. 4–6 kali sehari = normal.'},
{id:'kt19',c:'kokoro',t:'mc',
 q:'せきやくしゃみなど、おなかに力《ちから》が入《はい》ったときに尿《にょう》がもれる尿失禁《にょうしっきん》を1つ選《えら》びなさい。',
 qi:'Pilih jenis inkontinensia urine yang bocor saat perut tertekan, misalnya batuk atau bersin.',
 o:['腹圧性尿失禁《ふくあつせいにょうしっきん》','切迫性尿失禁《せっぱくせいにょうしっきん》','機能性尿失禁《きのうせいにょうしっきん》','溢流性尿失禁《いつりゅうせいにょうしっきん》'],
 oi:['Inkontinensia stres (tekanan perut)','Inkontinensia urgensi','Inkontinensia fungsional','Inkontinensia luapan'],
 a:0,
 e:'腹圧性《ふくあつせい》＝せき・くしゃみでもれる。切迫性《せっぱくせい》＝尿意《にょうい》はあるが間《ま》に合《あ》わない。機能性《きのうせい》＝認知症《にんちしょう》などでトイレの場所《ばしょ》がわからない・動作《どうさ》が間《ま》に合《あ》わない。溢流性《いつりゅうせい》＝前立腺肥大《ぜんりつせんひだい》などで少《すこ》しずつもれる。',
 ei:'Stres = bocor saat batuk/bersin. Urgensi = ada rasa ingin, tetapi tidak sempat. Fungsional = karena demensia tidak tahu letak toilet atau gerakan tidak sempat. Luapan = bocor sedikit-sedikit karena pembesaran prostat, dll.'},
{id:'kt20',c:'kokoro',t:'mc',
 q:'認知症《にんちしょう》でトイレの場所《ばしょ》がわからず、間《ま》に合《あ》わずにもれてしまう尿失禁《にょうしっきん》を1つ選《えら》びなさい。',
 qi:'Pilih jenis inkontinensia urine karena demensia tidak tahu letak toilet sehingga bocor.',
 o:['機能性尿失禁《きのうせいにょうしっきん》','腹圧性尿失禁《ふくあつせいにょうしっきん》','反射性尿失禁《はんしゃせいにょうしっきん》','溢流性尿失禁《いつりゅうせいにょうしっきん》'],
 oi:['Inkontinensia fungsional','Inkontinensia stres','Inkontinensia refleks','Inkontinensia luapan'],
 a:0,
 e:'機能性尿失禁《きのうせいにょうしっきん》は、排尿《はいにょう》のしくみではなく、認知機能《にんちきのう》や動作《どうさ》の問題《もんだい》で起《お》こる。トイレの場所《ばしょ》をわかりやすく表示《ひょうじ》するなどの工夫《くふう》をする。反射性《はんしゃせい》は脊髄損傷《せきずいそんしょう》などで尿意《にょうい》がないままもれる。',
 ei:'Inkontinensia fungsional terjadi bukan karena mekanisme berkemih, tetapi karena masalah kognitif atau gerakan. Buat tanda letak toilet yang mudah dimengerti. Refleks = bocor tanpa rasa ingin karena cedera sumsum tulang belakang, dll.'},

// ===== 生活支援技術 =====
{id:'kt21',c:'seikatsu',t:'mc',
 q:'おむつのテープをとめるときの方法《ほうほう》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih cara yang paling tepat saat merekatkan pita popok.',
 o:['おなかと太《ふと》ももに指《ゆび》が2〜3本入《はい》るくらいのゆとりを持《も》たせる','すき間《ま》がないように、きつくとめる','指《ゆび》が5本入《はい》るくらい、ゆるくとめる','テープはとめなくてよい'],
 oi:['Beri kelonggaran sekitar 2–3 jari di perut dan paha','Direkatkan kencang tanpa celah','Direkatkan longgar sampai 5 jari bisa masuk','Pita tidak perlu direkatkan'],
 a:0,
 e:'強《つよ》い圧迫《あっぱく》はかゆみの原因《げんいん》になる。指《ゆび》2〜3本のゆとりを持《も》たせる。衣類《いるい》やシーツのしわは不快感《ふかいかん》や褥瘡《じょくそう》につながるので整《ととの》える。',
 ei:'Tekanan kuat menyebabkan gatal. Beri kelonggaran 2–3 jari. Kerutan pakaian atau seprai menyebabkan tidak nyaman dan luka tekan, jadi dirapikan.'},
{id:'kt22',c:'seikatsu',t:'mc',
 q:'女性《じょせい》の陰部《いんぶ》を拭《ふ》く方向《ほうこう》として、正《ただ》しいものを1つ選《えら》びなさい。',
 qi:'Pilih arah yang benar saat menyeka area kemaluan perempuan.',
 o:['尿道《にょうどう》から肛門《こうもん》に向《む》かって（前《まえ》から後《うし》ろへ）','肛門《こうもん》から尿道《にょうどう》に向《む》かって（後《うし》ろから前《まえ》へ）','左右《さゆう》に何度《なんど》もこする','同《おな》じ面《めん》で何度《なんど》もくり返《かえ》して拭《ふ》く'],
 oi:['Dari uretra ke anus (dari depan ke belakang)','Dari anus ke uretra (dari belakang ke depan)','Menggosok ke kiri dan kanan berkali-kali','Menyeka berulang dengan sisi yang sama'],
 a:0,
 e:'感染予防《かんせんよぼう》のため、尿道《にょうどう》から肛門《こうもん》に向《む》かって拭《ふ》く。同《おな》じ面《めん》で何度《なんど》も拭《ふ》かない。',
 ei:'Untuk mencegah infeksi, seka dari uretra ke arah anus. Jangan menyeka berulang dengan sisi yang sama.'},
{id:'kt23',c:'seikatsu',t:'mc',
 q:'陰部洗浄《いんぶせんじょう》に使《つか》うお湯《ゆ》の温度《おんど》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih suhu air yang paling tepat untuk mencuci area kemaluan.',
 o:['体温《たいおん》と同《おな》じくらい','50℃くらいの熱《あつ》いお湯《ゆ》','冷《つめ》たい水《みず》','入浴《にゅうよく》のときより熱《あつ》め'],
 oi:['Sekitar sama dengan suhu tubuh','Air panas sekitar 50°C','Air dingin','Lebih panas daripada saat mandi'],
 a:0,
 e:'陰部《いんぶ》は温度《おんど》に敏感《びんかん》なので、体温《たいおん》と同《おな》じくらいのお湯《ゆ》を使《つか》う。清拭《せいしき》のお湯《ゆ》は冷《さ》めやすいので入浴《にゅうよく》より熱《あつ》めにするが、陰部洗浄《いんぶせんじょう》はちがう。',
 ei:'Area kemaluan sensitif terhadap suhu, jadi pakai air sekitar suhu tubuh. Air untuk menyeka badan dibuat lebih panas dari mandi karena cepat dingin, tetapi untuk mencuci kemaluan berbeda.'},
{id:'kt24',c:'seikatsu',t:'mc',
 q:'全身清拭《ぜんしんせいしき》をする順番《じゅんばん》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih urutan menyeka seluruh tubuh yang paling tepat.',
 o:['顔《かお》→腕《うで》→胸《むね》・おなか→背中《せなか》→足《あし》→陰部《いんぶ》','陰部《いんぶ》→足《あし》→背中《せなか》→顔《かお》','足《あし》→陰部《いんぶ》→顔《かお》→腕《うで》','背中《せなか》→陰部《いんぶ》→顔《かお》→足《あし》'],
 oi:['Wajah → lengan → dada & perut → punggung → kaki → kemaluan','Kemaluan → kaki → punggung → wajah','Kaki → kemaluan → wajah → lengan','Punggung → kemaluan → wajah → kaki'],
 a:0,
 e:'きれいな所《ところ》から汚《よご》れやすい所《ところ》へ。顔《かお》は目《め》の周《まわ》りから拭《ふ》く。拭《ふ》いていない所《ところ》はバスタオルでおおう。',
 ei:'Dari bagian yang bersih ke bagian yang mudah kotor. Wajah diseka mulai dari sekitar mata. Bagian yang belum diseka ditutup handuk mandi.'},
{id:'kt25',c:'seikatsu',t:'mc',
 q:'清拭《せいしき》に使《つか》うお湯《ゆ》の温度《おんど》として、最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Pilih suhu air yang paling tepat untuk menyeka badan.',
 o:['入浴《にゅうよく》のときより熱《あつ》め（すぐ冷《さ》めるため）','入浴《にゅうよく》のときよりぬるめ','冷《つめ》たい水《みず》','温度《おんど》は気《き》にしなくてよい'],
 oi:['Lebih panas dari saat mandi (karena cepat dingin)','Lebih hangat-suam daripada saat mandi','Air dingin','Suhu tidak perlu diperhatikan'],
 a:0,
 e:'お湯《ゆ》はすぐ冷《さ》めるので、入浴《にゅうよく》より熱《あつ》めにし、熱《あつ》いお湯《ゆ》も準備《じゅんび》しておく。濡《ぬ》れたタオルで拭《ふ》いたら、すぐ乾《かわ》いたタオルで水分《すいぶん》を取《と》る。',
 ei:'Air cepat dingin, jadi dibuat lebih panas dari mandi dan siapkan juga air panas. Setelah menyeka dengan handuk basah, segera keringkan dengan handuk kering.'},
{id:'kt26',c:'seikatsu',t:'mc',
 q:'片麻痺《かたまひ》の利用者《りようしゃ》が、ベッドの上《うえ》で横向《よこむ》き（側臥位《そくがい》）で食事《しょくじ》をする。最《もっと》も適切《てきせつ》な姿勢《しせい》を1つ選《えら》びなさい。',
 qi:'Pengguna dengan hemiplegia makan di tempat tidur dalam posisi miring. Pilih posisi yang paling tepat.',
 o:['健側《けんそく》を下《した》にする','患側《かんそく》を下《した》にする','うつぶせにする','あお向《む》けで顎《あご》を上《あ》げる'],
 oi:['Sisi sehat di bawah','Sisi lumpuh di bawah','Telungkup','Telentang dengan dagu terangkat'],
 a:0,
 e:'上体《じょうたい》を起《お》こすのが難《むずか》しいときは側臥位《そくがい》で食《た》べる。片麻痺《かたまひ》があれば健側《けんそく》を下《した》にする。顎《あご》を上《あ》げた姿勢《しせい》は誤嚥《ごえん》しやすく危険《きけん》。',
 ei:'Jika sulit menegakkan badan, makan dalam posisi miring. Jika ada hemiplegia, sisi sehat di bawah. Posisi dagu terangkat mudah tersedak dan berbahaya.'},
{id:'kt27',c:'seikatsu',t:'mc',
 q:'誤嚥性肺炎《ごえんせいはいえん》を予防《よぼう》するため、食後《しょくご》はどうしてもらうのがよいか。最《もっと》も適切《てきせつ》なものを1つ選《えら》びなさい。',
 qi:'Untuk mencegah pneumonia aspirasi, apa yang sebaiknya dilakukan setelah makan? Pilih yang paling tepat.',
 o:['30分くらい、座《すわ》った姿勢《しせい》でいてもらう','すぐに横《よこ》になってもらう','すぐにお風呂《ふろ》に入《はい》ってもらう','すぐに激《はげ》しい運動《うんどう》をしてもらう'],
 oi:['Tetap dalam posisi duduk sekitar 30 menit','Segera berbaring','Segera mandi','Segera berolahraga keras'],
 a:0,
 e:'食後《しょくご》30分くらいは座位《ざい》を保《たも》ってもらう。口腔《こうくう》ケア（うがい・歯《は》みがき・義歯《ぎし》の清掃《せいそう》）も行《おこな》う。',

// ===== パスワード確認（SHA-256）=====
// パスワードそのものは保存せず、ハッシュ値（元に戻せない値）だけを比べる
function sha256Hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(Math.floor(bitLen / Math.pow(2, i * 8)) & 0xff);
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (bytes[off+i*4] << 24) | (bytes[off+i*4+1] << 16) | (bytes[off+i*4+2] << 8) | bytes[off+i*4+3];
    for (let i = 16; i < 64; i++) {

  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

  return DB.set.furi ? s.replace(RUBY_RE, '<ruby>$1<rt>$2</rt></ruby>') : s.replace(RUBY_RE, '$1');
}
function plain(t) { return String(t || '').replace(RUBY_RE, '$1'); }
function ID(t, tag) { return DB.set.idn && t ? `<span class="idn">${esc(t)}</span>` : ''; }
function catName(c) { return R(CATS[c].ja); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }
const NUMS = ['①','②','③','④','⑤'];

function toggleSet(k) {
  DB.set[k] = !DB.set[k]; save(); updateToggles(); render();
}
function updateToggles() {

const HAS_TTS = 'speechSynthesis' in window;
let jaVoice = null;
function loadVoices() {
  if (!HAS_TTS) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => v.lang === 'ja-JP') || vs.find(v => (v.lang || '').toLowerCase().startsWith('ja')) || null;
}
if (HAS_TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate) {
  if (!HAS_TTS) { toast('この端末では音声が使えません'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(RUBY_RE, '$2')); // 漢字は読みで読ませる
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = rate || 0.9;
  speechSynthesis.speak(u);
}
function stopSpeak() { if (HAS_TTS) speechSynthesis.cancel(); }

// =====================================================================
//  復習スケジュール（間隔反復）
// =====================================================================
function record(q, ok) {
  const now = Date.now();
  const r = DB.srs[q.id] || { box: 0, due: 0, ok: 0, ng: 0 };
  if (ok) {
    r.ok++;
    r.box = r.box === 0 ? 2 : Math.min(r.box + 1, 5);
    r.due = now + INTERVAL_DAYS[r.box] * DAY;
  } else {
    r.ng++;
    r.box = 1;
    r.due = now;           // まちがえた問題はすぐ「復習」に入る
  }
  DB.srs[q.id] = r;
  save();
}
function dueList() {
  const now = Date.now();
  return Object.entries(DB.srs)
    .filter(([id, r]) => QMAP[id] && r.due <= now)
    .sort((a, b) => a[1].box - b[1].box || a[1].due - b[1].due)
    .map(([id]) => QMAP[id]);
}
function catStats(c) {
  let ok = 0, ng = 0, seen = 0, mastered = 0, total = 0;
  QUESTIONS.forEach(q => {
    if (c && q.c !== c) return;
    total++;
    const r = DB.srs[q.id];
    if (r) { ok += r.ok; ng += r.ng; seen++; if (r.box >= 4) mastered++; }
  });
  return { ok, ng, seen, mastered, total, pct: ok + ng ? Math.round(ok / (ok + ng) * 100) : null };
}
